  <body class="calibre"><h1 id="pos1_1" class="test_header_style">附录A</h1><div class="img_style"><img src="../images/00067.jpeg" class="div_img_6" alt=""/><p class="img_desc_style">图9-1被故意绘制为错误的图形。尽管三角形<i class="calibre4">OAB</i>和三角形<i class="calibre4">ODC</i>确实是相似的，它们的关系却与图9-1中所示的完全不同。直线<i class="calibre4">L</i>和<i class="calibre4">L</i>′的交点<i class="calibre4">O</i>实际上要更高（如上图所示）。因此角δ=α-β，但是δ′=2π-α-β。基于这样的关系显然无法得到角δ′的大小。</p><p class="img_desc_style">附录A-1　对图9-1“证明”的修正</p></div><script src="../../math.js"></script></body>
