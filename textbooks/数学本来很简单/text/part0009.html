<p class="calibre4"><img alt="" class="kindle-cn-inline-image1" src="../images/00453.jpeg"/>
 <span class="font1">函数是两个变量之间的关系。</span>
</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00461.jpeg"/>
</div>
<p class="kindle-cn-exam-choice">■函数是两个变量之间的关系，在一个变化过程中，发生变化的量叫变量（数学中，常常为<span class="kindle-cn-italic">x</span>
 ，而<span class="kindle-cn-italic">y</span>
 随<span class="kindle-cn-italic">x</span>
 值的变化而变化），有些数值是不随变量改变而改变的，我们称它为常量。</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone" src="../images/00046.jpeg"/>
</div>

 ）＝<span class="kindle-cn-italic">X</span>
