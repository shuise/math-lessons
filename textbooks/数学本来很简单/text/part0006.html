代数</h1>
<h2 class="kindle-cn-heading1"><a class="calibre8" id="sec001"></a>
 指数</h2>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00066.jpeg"/>
 <span class="font1">指数标示在数字或变量的右上角，表示数或变量乘以自身一定次数。如果指数是2，这也被称为“2次幂”或称“平方”。</span>
</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00352.jpeg"/>
</div>
<p class="kindle-cn-exam-choice">■这个指数是2，意味着4乘以4：</p>
<p class="kindle-cn-para-center">4<span class="math-super">2</span>
 ＝4×4＝16</p>
<p class="kindle-cn-para-center">4乘以4本身</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone" src="../images/00327.jpeg"/>
</div>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone" src="../images/00185.jpeg"/>
</div>
<p class="calibre4">可以用其他指数，如3，这就是所谓的“立方”，表示一个数乘以自己3次。</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone" src="../images/00164.jpeg"/>
</div>
<p class="calibre4" id="calibre_pb_2"></p>
