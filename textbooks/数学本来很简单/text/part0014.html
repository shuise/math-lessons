<h2 class="kindle-cn-heading3" id="TG-1274c0cb949e445b96411d793bf517bc"><a class="calibre8" id="sec002"></a>
 数学符号<br class="calibre3"/>
π</h2>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00086.jpeg"/>
 π<span class="font1">表示数字3.141 5……（它将永远持续下去！）。圆周率π是圆的周长与直径的比值。</span>
</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00320.jpeg"/>
</div>
<p class="calibre4">（圆周率＝周长/直径）</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00448.jpeg"/>
</div>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00237.jpeg"/>
</div>
<p class="kindle-cn-picture-txt-withfewcharactors">如果你知道一个圆的直径，你可以用圆周率公式计算圆的周长。</p>
<p class="kindle-cn-para-center">
<span class="kindle-cn-bold">2<span class="kindle-cn-italic">R</span>
 ＝<span class="kindle-cn-italic">D</span>
</span>
</p>
<p class="kindle-cn-para-center">
<span class="font1">（2倍半径＝直径）</span>
</p>
<p class="kindle-cn-para-center">
<span class="kindle-cn-bold">2 <span class="kindle-cn-italic">R π</span>
 ＝<span class="kindle-cn-italic">D π</span>
</span>
</p>
<p class="kindle-cn-para-center">
<span class="font1">（2倍半径乘以圆周率＝直径乘以圆周率）</span>
</p>
<p class="kindle-cn-para-center">
<span class="kindle-cn-bold">
<span class="kindle-cn-italic">C</span>
 ＝<span class="kindle-cn-italic">D π</span>
</span>
</p>
<p class="kindle-cn-para-center">
<span class="font1">（周长＝直径乘以圆周率）</span>
</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone80-withnote" src="../images/00287.jpeg"/>
<p class="kindle-cn-picture-txt-withfewcharactors">如果知道圆的半径，就可以确定圆的周长</p>
</div>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone80-withnote" src="../images/00070.jpeg"/>
<p class="kindle-cn-picture-txt-withmanycharactors">如果知道圆的半径，就可以确定圆的周长。半径是直径的<img alt="" class="kindle-cn-inline-image" src="../images/00274.jpeg"/>
 。二倍半径乘以圆周率就是周长</p>
</div>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone80-withnote" src="../images/00077.jpeg"/>
<p class="kindle-cn-picture-txt-withmanycharactors">如果知道圆的周长，就可以用圆周率来计算它的直径或半径</p>
</div>
<p class="calibre4" id="calibre_pb_5"></p>
