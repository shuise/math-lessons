<h2 class="kindle-cn-heading3" id="FP-1274c0cb949e445b96411d793bf517bc"><a class="calibre8" id="sec003"></a>
 变量</h2>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image1" src="../images/00401.jpeg"/>
 <span class="font1">变量是一个代号或字母，如<span class="kindle-cn-italic">X</span>
 。</span>
</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone1" src="../images/00132.jpeg"/>
</div>
<p class="kindle-cn-exam-choice">■变量就像一个口袋，一个容纳数字的口袋——我们只是不知道口袋里装的是什么。但所有的数学规则都适用于它。</p>
<p class="kindle-cn-exam-choice">■其他的字母可以表示其他的值。例如，<span class="kindle-cn-italic">t</span>
 、<span class="kindle-cn-italic">v</span>
 和<span class="kindle-cn-italic">d</span>
 分别代表时间、速度和距离。</p>
<p class="kindle-cn-exam-choice">■例如：<span class="kindle-cn-italic">f</span>
 （<span class="kindle-cn-italic">x</span>
 ），或<span class="kindle-cn-italic">x</span>
 的函数，是一个依赖于<span class="kindle-cn-italic">x</span>
 值的变量，函数定义输入和输出之间的关系。</p>
<div class="kindle-cn-bodycontent-div-alone"><img alt="" class="kindle-cn-bodycontent-image-alone" src="../images/00377.jpeg"/>
</div>
<p class="calibre4">把变量<span class="kindle-cn-italic">x</span>
 单独放在等号的一边：</p>
<p class="calibre4">
<span class="font1">求解</span>
 <img alt="" class="kindle-cn-inline-image" src="../images/00439.jpeg"/>
 ：</p>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00439.jpeg"/>
 ＋3＝7</p>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00439.jpeg"/>
 ＋3−3＝7−3</p>
<p class="calibre4">
<span class="font1">这两个互相抵消</span>
</p>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00439.jpeg"/>
 ＋3−3＝4</p>
<p class="calibre4"><img alt="" class="kindle-cn-inline-image" src="../images/00147.jpeg"/>
 ＝4</p>
<p class="calibre4" id="calibre_pb_8"></p>
