<h1 class="firstTitle"><a href="part0002.html#toc4">内容提要</a></h1>
<p class="content">“数学是上帝用来书写宇宙的文字”蕴含在生活中的各个角落，越靠近它，你就越能体会到它的不简单之处。本书精选了《最强大脑》节目中的热门项目，详细剖析了这些烧脑问题背后的数学知识并加以扩展。数字华容道的排列问题，立体一笔画的解链，迷宫中的拓扑知识，繁花规图案的摆线方程，数独的设计与求解……这一系列有趣的问题不仅可以加深你对数学的了解，还能开发智力、活跃大脑。</p>
<p class="content">本书适合喜欢数学的读者阅读。</p>
