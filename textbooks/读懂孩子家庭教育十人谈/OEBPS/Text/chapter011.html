  <h1 class="bodycontent-first-title" id="sigil_toc_id_43">在慈悲与勇气之间</h1>

  <div class="tupian"><img alt="" class="image-alone3" src="../Images/figure_0228_0011.jpg"/></div>

  <p class="bodycontent-text_yinwen">专家介绍：张文质，著名教育学者，家庭教育研究专家，生命化教育发起人。长期植根学校教育与儿童发展的研究，在全国做过上千场的教育讲座，见解新颖深刻，影响广泛。是中国第一部中小学《生命教育》教材的主编，也是全国第一部中小学课程化家庭教育教材的主编。已出版个人教育著作20余部，其中《教育是慢的艺术》是华东师范大学出版社“大夏书系”十年经典之一，《父母改变 孩子改变》入选中国教育报2013年度最受教师欢迎的十大图书，集五年之功完成的新作《奶蜜盐——家庭教育第一定律》一出版即引发强烈反响。</p>
