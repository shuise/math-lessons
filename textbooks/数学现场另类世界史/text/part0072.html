  <p class="bodycontent-text_center">数海拾贝16</p>

  <p class="bodycontent-text">贾宪三角形是有记载的世界最早的高阶二项式（a+b）<sup class="calibre2">n</sup>展开后的系数的写法。注意它不是几何中的三角形，而是一个状似三角形的数表。南宋人杨辉（公元 1238—公元 1298）在《详解九章算法》里描述了这种数表，并明确指出，这种数表来自11世纪前半叶贾宪所著的《释锁算术》。14世纪初叶的元代数学家朱世杰在《四元玉鉴》里面明确画出七阶二项式展开的系数数表：</p>

  <div class="biaoge"><img alt="" class="image-alone" src="../images/00035.jpeg"/></div>

  <p class="bodycontent-text">根据这个表格可以很方便地列出二项式的展开。比如，</p>

  <p class="bodycontent-text">（a+b）<sup class="calibre2">5</sup>=1a<sup class="calibre2">5</sup>+5a<sup class="calibre2">4</sup>b+10a<sup class="calibre2">3</sup>b<sup class="calibre2">2</sup>+10a<sup class="calibre2">2</sup>b<sup class="calibre2">3</sup> +5ab<sup class="calibre2">4</sup>+1b<sup class="calibre2">5</sup>。</p>

  <p class="bodycontent-text">我们前边已经看到代数与几何的同源关系：1到3阶的二项式展开可以用下面的几何图形来表示。</p>
