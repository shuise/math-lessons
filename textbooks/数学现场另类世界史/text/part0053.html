  <p class="bodycontent-text_center">数海拾贝12</p>

  <p class="bodycontent-text">不定方程组是一组方程，它们有不唯一的解。比如ax+by=c是一个简单不定方程。不过，</p>

  <p class="bodycontent-text">ax+by=c</p>

  <p class="bodycontent-text">x<sup class="calibre2">2</sup>=d</p>

  <p class="bodycontent-text">两个方程结合起来，是一个不定方程组。我们前面提到的丢番图方程就是不定方程，因为它们有很多可能的解。</p>

  <p class="bodycontent-text">库塔卡是阿耶波多发明的解决一次丢番图不定方程ax+by=c的算法，用来求 x 和 y 的所有整数解。</p>
