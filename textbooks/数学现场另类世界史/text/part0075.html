  <p class="bodycontent-text_center">数海拾贝17</p>

  <p class="bodycontent-text">如果两个整数除以同一个正整数得到相同的余数，那么这两个整数就成为同余。这是数论里面一个重要的等价关系。最早的同余问题出现在《孙子算经》里：</p>

  <p class="bodycontent-text">有物不知其数，三三数之剩二，五五数之剩三，七七数之剩二。问物几何?答曰：二十三。</p>

  <p class="bodycontent-text">这是一个一次同余式组：</p>

  <p class="bodycontent-text">x/3=n<sub class="calibre3">1</sub>+2</p>

  <p class="bodycontent-text">x/5=n<sub class="calibre3">2</sub>+3</p>

  <p class="bodycontent-text">x/7=n<sub class="calibre3">3</sub>+2</p>

  <p class="bodycontent-text">其中 n<sub class="calibre3">1</sub>、n<sub class="calibre3">2</sub>、n<sub class="calibre3">3</sub> 是正整数。</p>

  <p class="bodycontent-text">《孙子算经》成书的时间目前还不大清楚。估计是在魏晋或南北朝期间（4世纪—6世纪）</p>
