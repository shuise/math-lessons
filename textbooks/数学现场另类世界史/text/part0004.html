  <p class="bodycontent-text">汹涌的战争浪潮之下，</p>

  <p class="bodycontent-text">希腊和她的基床</p>

  <p class="bodycontent-text">建立在永恒的</p>

  <p class="bodycontent-text">思维结晶的大海之上。</p>

  <p class="bodycontent-text">摘自19世纪英国浪漫诗人雪莱（Percy Bysshe Shelley，</p>

  <p class="bodycontent-text">公元1792—公元1822）的抒情诗剧《希腊》（Hellas）</p>
