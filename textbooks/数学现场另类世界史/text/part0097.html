  <h1 class="bodycontent-first-title" id="sigil_toc_id_26">书尾题记</h1>

  <p class="bodycontent-text">当埃斯库罗斯（Aeschylus，公元前525—公元前456古希腊悲剧名家）被人忘记时，阿基米德仍会被记起，因为语言可能消亡而数学思想永存。“不朽”或许是个可笑的形容词，但数学家大概最有可能达到这个词所表达的含义。</p>

  <p class="bodycontent-text_right">G. H.哈代,《一个数学家的辩白》</p>
