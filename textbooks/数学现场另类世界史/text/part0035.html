  <p class="bodycontent-text_center">数海拾贝8</p>

  <p class="bodycontent-text">1983 年 12 月，湖北省江陵市 （今天叫荆州市）张家山 M247 号汉 代古墓出土了二百多片竹简，其中 一百八十片保存完整。竹简上的三道 连纬早就腐烂掉了，竹简当然也就混 乱了，但它们显然属于同一部著作。 经过十七年的研究整理，2000 年《文 物》杂志发表了竹简的简体字全文， 引起轰动。这就是著名的《算术书》。 据估计，这部书的成书年代不晚于公 元前 186 年（也就汉高祖的妻子吕后 当政的时代），这比《九章算术》早了 三百多年，其内容可能更接近墨子时 代的数学。</p>
