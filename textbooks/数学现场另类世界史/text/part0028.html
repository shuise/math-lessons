  <p class="bodycontent-text_center">数海拾贝6</p>

  <p class="bodycontent-text">在几何学中，切线指的是一条刚刚而且仅仅触碰到曲线上某一点的直线更准确地说，当切线经过曲线上的某点（即切点）时，切线的斜率与曲线上该点的斜率相同莱布尼茨（Gottfried Leibniz，1646-1716）定义一条曲线的切线是经过曲线上两个无限接近的点的直线这两个无限接近的点就是切点类似地，经过曲面上一群无限接近的点的平面是曲面的切面。</p><img alt="图像" src="../00j.jpg" />
