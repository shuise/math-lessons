<h1 class="sgc-toc-title" id="1VSLM1-9087f57f6a48459480bbdb21c1e56f0e">第五章 从文艺复兴到微积分的诞生</h1>
<p class="kaiti2">我希望画家应当通晓全部自由艺术，但我首先希望他们精通几何学。</p>
<p class="kaiti5">——莱昂·阿尔贝蒂</p>
<p class="kaiti2">他几乎以神一般的思维，最先说明了行星的运动和图像，彗星的轨迹和大海的潮汐。</p>
<p class="kaiti5">——牛顿墓志铭</p>
