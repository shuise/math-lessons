<h1 class="sgc-toc-title" id="DB7S1-9087f57f6a48459480bbdb21c1e56f0e">致谢</h1>
<p class="calibre11">我要向迈克尔·奥马拉图书有限公司（Michael O’Mara Books）的所有工作人员致以最诚挚的谢意，尤其是我的编辑安娜·马克思（Anna Marx），感谢她的支持、热心和建议，还有做出可爱设计的安娜（Ana Bježančević）以及绘制精美插画的格雷格·史蒂文森（Greg Stevenson）。我还要感谢丹·奥格雷迪（Dan O’Grady）和我的兄弟彼得·埃弗斯（Peter Evers）提出的宝贵意见。最后，我最想感谢的是西尔维娅·克朗普顿（Silvia Crompton），她是我的好朋友，也是一位杰出的编辑，感谢她过去几年里为我付出的所有的珍贵时光。</p>
