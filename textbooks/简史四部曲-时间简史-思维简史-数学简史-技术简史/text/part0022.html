<h2 class="sigil_not_in_toc1" id="sigil_toc_id_17">蜡烛钟……</h2>
<p class="calibre11">存时较久且流行于亚洲（尤其是中东）和欧洲的一种计时器就是蜡烛钟。大概在公元6世纪初甚至更早时，蜡烛钟就出现了。其原理很简单——就是用蜡烛燃烧的速率来测量时间的流逝。</p>
<p class="calibre11">人们在蜡烛上均匀刻上标记以显示时间段，或者在蜡烛背后放置一个带有刻度的背景做参考，蜡烛燃烧时背景上被照亮的地方就可以显示时间。还有些蜡烛会在某个固定时间段内燃尽，其内部有一个钉子，蜡烛一旦燃尽，钉子就掉落发出声音，表示一段时间的结束。
[shu籍 分.享 V信jnztxy]</p>
