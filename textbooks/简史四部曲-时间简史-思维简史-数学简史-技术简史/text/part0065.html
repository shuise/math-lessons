<h1 class="calibre22" id="calibre_pb_0">
<span class="kaiti6">第一部分</span>
<br class="calibre23"/>
直立的思想家</h1>
<p class="kaiti7">神秘感是一个人所能经历的最美好、最深刻的体验。它既是宗教的基本原理，也是所有艺术和科学的基本原理。在我看来，一个不曾有此体验的人，如果不是死了，至少也是瞎了。</p>
<p class="kaiti4">——阿尔伯特·爱因斯坦，<br class="calibre16"/>
《我的世界观》，1932</p>
