计时</h1>
<h2 class="sigil_not_in_toc" id="sigil_toc_id_11">计算时间</h2>
<p class="calibre11">与很多其他跟数学和天文有关的事物一样，我们对时间的划分也始于公元前3000年，由巴比伦人和苏美尔人“发明”并从美索不达米亚文明传开。同时，还有一些如每星期应该有几天这样的划分，甚至是“星期”本身的存在也都是由他们提出的。虽然这些划分貌似都是很随意的决定，却对我们的日常生活产生了巨大影响。</p>
