<h2 class="sigil_not_in_toc1" id="sigil_toc_id_13">小时</h2>
<p class="calibre11">人类祖先选用12这一神奇数字来划分一天主要是基于计数喜好，而非科学。古埃及人依据36个“旬星”的升起划分每一天，“旬星”指的是随地球每一次旋转而依次在地平线上升起的星座。每升起一颗旬星代表一小时（约等于现在的40分钟），至中王国时期（公元前16世纪至公元前11世纪），该系统经过进一步优化，将一天分为24小时，白天12小时，夜晚12小时。但若想定义每个小时的实际长度，就需要一个测量工具。于是诞生了第一个计时器……</p>
