<h1 class="sgc-toc-title" id="1Q5IA1-9087f57f6a48459480bbdb21c1e56f0e">第四章 印度人和波斯人</h1>
<p class="kaiti2">人们可以写一部印度历史，一直写到距今四百年前而不提到一个“海”字。</p><img alt="图像" src="../00j.jpg" />
<p class="kaiti5">——赫伯特·乔治·韦尔斯</p>
<p class="kaiti2">从《鲁拜集》的诗篇里可以看出，宇宙的历史是神构思、演出、观看的戏剧。</p>
<p class="kaiti5">——豪尔赫·路易斯·博尔赫斯</p>
