  <h1 class="calibre3" id="RL0A1-00dd8d0dbadc4081bb5d47f9f7c4cef8">第五章　黄金比例与自然</h1>

  <p class="calibre2">请你在脑海中想象出一个非常简单的矩形。它如何在形状不变的情况下增大？常识告诉我们，整个矩形必须均匀地增大，也就是说，在所有的方向上都以相同的比例增大。这就好像矩形的每条边都是有弹性的，一点一点地被小心拉长。矩形的自然增大意味着各边以相同的速度变长，这种假设好像符合逻辑，但这样会导致邻边之比发生改变，增大的矩形也会因此失去原有的形状。</p>
