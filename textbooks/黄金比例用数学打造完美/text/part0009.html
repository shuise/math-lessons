  <h1 class="calibre3" id="8IL21-00dd8d0dbadc4081bb5d47f9f7c4cef8">第二章　黄金矩形</h1>

  <p class="calibre2">在前一章中，我们知道了黄金比例的传统定义：把一条线段分为两部分，如果整条线段比较长部分等于较长部分比较短部分，那么这条线段就是按照中外比（黄金比例）分割的。换句话说就是整体比部分等于该部分比另一部分。现在我们来看一下如何使用黄金比例来分图形中的线段。</p>
