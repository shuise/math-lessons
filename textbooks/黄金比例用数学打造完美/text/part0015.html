  <h1 class="calibre3" id="E9OE1-00dd8d0dbadc4081bb5d47f9f7c4cef8">第三章　黄金比例与五边形</h1>

  <p class="calibre2">亚述人很自然地就创造出了五边形。五边形出现在他们的泥板上，有时我们仍然可以看到印在上面的五个手指印。然而这个图形却让古希腊人十分头痛。他们认为只有使用直尺和圆规才能绘制几何图形，但只用这两样东西似乎不可能画出正五边形。</p>
