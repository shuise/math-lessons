<h1 id="131-dca88afb0a564847802a099374a893ec" class="calibre6">第四章 印度人和波斯人</h1>
<p class="kaiti4">人们可以写一部印度历史，一直写到距今四百年前而不提到一个“海”字。</p>
<p class="kaiti3">——赫伯特·乔治·韦尔斯</p>
<p class="kaiti4">从《鲁拜集》的诗篇里可以看出，宇宙的历史是神构思、演出、观看的戏剧。</p>
<p class="kaiti3">——豪尔赫·路易斯·博尔赫斯</p>
