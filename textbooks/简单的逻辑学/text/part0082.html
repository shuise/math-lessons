    <h3 class="calibre2">28.简化推理</h3>

    <p class="calibre5">有时我们受简单化的驱使，黑白不分，那是因为生活的复杂性淹没了我们。但是，通过对复杂的现实的简单扭曲来达到简化的目的同样是不合逻辑的反应。过分简化的结果往往是扭曲现实。</p>

    <p class="calibre5">有些听众将其接受能力局限在自己想听的东西之上，另一些人只喜欢简单的答案，这往往是愤世嫉俗者的特点。不要告诉听众他们想听到的，要告诉他们真实的。不要对他们假言欺骗。无论现实是光明的，还是黑暗的或者是灰色的，都要实话实说。可能听众不能立刻欣赏你的坦白，但是经过长时间的历练之后，他们会发现，他们必须面对的只能是现实。</p>
