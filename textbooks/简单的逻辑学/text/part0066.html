    <h3 class="calibre2">12.压制理性</h3>

    <p class="calibre5">理想的论证是通过证据使人们认识到某些事物是真的。一个真正的论证者只会运用推理本身的理性的力量。</p>

    <p class="calibre5">当然你也可以诉诸粗暴的强制而不是理性来说服他人。人们可以因为被强迫而做一些不愿去做的事情，但是他们不能被强迫去想一些他们不愿去想的事情。真相不能以强制的方式传播。在论证中，高压政策的背后永远隐藏着危机。防民之口，甚于防川。人们只有在自由思考的时候才能接受什么是真，也只有在独立判断的时候才能确定什么是真。</p>
