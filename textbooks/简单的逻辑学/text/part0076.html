    <h3 class="calibre2">22.无力反驳不算证明</h3>

    <p class="calibre5">没有强有力的证据能够加以反对的论证，并不能因此而证明其为真。不能仅仅因为你不能证明我是错的，就说我的观点是对的。我们来看如下例子：</p>

    <p class="calibre5">威廉博士：我们并不是宇宙中唯一的生物。我坚持认为在广阔的宇宙中有其他生物的存在。</p>

    <p class="calibre5">伯德博士：你有证据吗？</p>

    <p class="calibre5">威廉博士：我没有。但是你有证据可以证明宇宙中没有其他生物吗？</p>

    <p class="calibre5">伯德博士：我也没有。</p>

    <p class="calibre5">威廉博士：哈哈，这就证明我是正确的。</p>

    <p class="calibre5"><b class="calibre4">分析：</b>威廉博士试图过早地结束一个还没有定论的问题。虽然双方都没有证据来证明宇宙中是否有其他的生物，但是对方缺乏证据并不能成为己方观点成立的证据。</p>
