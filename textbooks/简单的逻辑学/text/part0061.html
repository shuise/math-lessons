    <h3 class="calibre2">7.稻草人谬误</h3>

    <p class="calibre5">论证中，我们要对事不对人，要紧扣论证中给定的论点。在与他人辩论的过程当中，如果你为了削弱对方的论点而故意扭曲其论证过程，那就犯了稻草人谬误。在这个比喻中，"稻草人"意味着容易对付的事物。在我们误解某个论证时，或是当一些论证非常复杂，我们在理解上犯了一些无意的错误时，我们犯的并不是这种谬误。稻草人谬误不是无心之过，因为它是在有意地歪曲别人的论点。</p>
