    <h3 class="calibre2">17.简化主义</h3>

    <p class="calibre5">如前所述，一个整体大于其组成部分的总和。例如，人的身体可以根据化学元素被分解，但是如果声称人的身体等同于一堆化学元素，那将是对简单的推理的盲从，是向简化主义谬误屈服。</p>

    <p class="calibre5">这种谬误发生于当我们选择性地只对整体的一部分加以关注之时。例如，当我们只把精神放在一个人的缺点上，并因此认为我们已经完全了解了这个人的本质时，这个谬误就正在发生作用。</p>
