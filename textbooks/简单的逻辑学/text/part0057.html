    <h3 class="calibre2">3.中项不周延</h3>

    <p class="calibre5">在讨论三段论时，我们知道中项（出现在前提中但不出现在结论中）必须至少有一次是全称的（周延的），因为它要有适当的范围来联结大前提和小前提。如若不然，就会产生中项不周延谬误。通俗一些，可以称之为牵连犯罪。针对后一点，我们来看下面例子：</p>

    <p class="calibre5">几个纳粹党人是凯撒俱乐部的成员。</p>

    <p class="calibre5">汉斯是凯撒俱乐部的成员。</p>

    <p class="calibre5">所以，汉斯是纳粹党人。</p>

    <p class="calibre5"><b class="calibre4">分析：</b>这是个错误推理，并不能因为汉斯是俱乐部的成员，而俱乐部里有几个纳粹党人，就能得出汉斯也是纳粹党人的结论。这种情况下，汉斯是有嫌疑的，但这并不是说我们就可以把自己的猜测作为真相来宣布。</p>
  </div>
