    <h3 class="calibre2">10.民主谬误</h3>

    <p class="calibre5">在一个给定的社会中，大多数人对某个给定的事物秉持同一个观点是个有趣的心理学现象，但是没有必要将事物的真实与否考虑进去。大多数也不绝对代表着正确。当然，也可能是正确的。民主谬误是说，如果大多数人都认为命题X是正确的，那么我们就可以就此得出结论说X是正确的。</p>

    <p class="calibre5">如果社会上大多数人认为白就是黑，黑就是白，这个社会就是黑白不分的。虽然某物是黑还是白不是主观的看法，而是客观的事实。如前面所说，我们必须承认，在情感方面，民主谬误是很有说服力的。如许多历史事件所证明的，当民众黑白不分的时候，为坚持真理而站在民众的对立面是件很艰难的事情。</p>
