    <h3 class="calibre2">8.真诚的局限性</h3>

    <p class="calibre5">真诚是正确推理的必要条件，但不是充分条件。如果你对自己公然鼓吹、极力辩护的观点都不信服，那么你就是在滥用推理。谁愿意和对自己观点都不认同的对手辩论？更让人无法忍受的是，在你为自己深信不疑的某事和对手做了长时间激情四溢的辩论后，忽然发现你的对手仅仅是出于对辩论本身的偏爱，而不是出于对观点的坚持才和你针锋相对时，你又情何以堪！但是只有多愁善感的人才会相信真诚本身就已足够。实际上，绝对真诚可能难免会带来错误。或许你绝对真诚，但同时也绝对错误。真诚不能将谬误变成真相。人要真诚，然而人更要正确。</p>
