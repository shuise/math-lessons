    <h3 class="calibre2">20.以笑饰非</h3>

    <p class="calibre5">当不能对某个论证做出合理反应时，我们会用这种策略，假装这个问题不值得严肃对待，仅仅是个可以一笑而过的问题。使人们嘲笑某个论证是反对它的强有力的途径，但是这种方式对论证本身的价值没有任何影响。如果辩论者不能使听众的注意力转移到一些无关主题的事情上，例如，演讲中对手的口吃，等等，以此来回避他所不能胜任的辩论。</p>

    <p class="calibre5">当然，确实存在不恰当的可笑的论证，它们受到大家的嘲笑是应该的。但是，即使在这种情况下，花点时间来说明为什么这个论证是失败的，同样好过简单地嘲笑论证本身。</p>
