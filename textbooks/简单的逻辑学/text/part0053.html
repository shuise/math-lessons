    <h3 class="calibre2">9.常识</h3>

    <p class="calibre5">逻辑，生于常识，但又高于常识。逻辑思维的出现以及对非逻辑思维的避免，都根植于常识的某一面。常识是对日常生活中显而易见的事物的敏锐洞悉。它以可靠的辨别力为标志，以语言作为首要的揭示事物的方式，不欺瞒，将语言的作用定位于表达而不是炫耀。常识更接近本源，服务于推理的基本原则。它是被亚里士多德定义的"理性的动物"所共享的普遍意识。</p>
