    <h3 class="calibre2">第一章</h3>

    <p class="calibre10"><b class="calibre4">学习逻辑学的思想准备</b></p>

    <p class="calibre10"><b class="calibre4">Preparing the Mind for Logic</b></p>

    <p class="calibre5">学习逻辑学首先意味着我们要对语言保持高度敏感，并且掌握有效运用他们的技巧，因为逻辑和语言是密不可分的。学习逻辑学同时也意味着我们要对身处其中的世界保持正确的认识，因为逻辑来源于现实。</p>

    <p class="calibre5">最后，学习逻辑学还意味着我们要深刻理解主观认识与客观存在相互作用的方式，因为逻辑反映现实。在本书的第一章，我将着重讨论这些认识和观点如何帮助我们做好学习逻辑学的思想准备的。</p>
