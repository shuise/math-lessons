    <h3 class="calibre2">26.功利误导</h3>

    <p class="calibre5">效果不能单独确定一个行为的价值。当我们仅仅注意于一个方法对想要得到结果的作用而不考虑其他方面时，我们就犯了功利误导谬误。仅仅看到目标是不够的，但那经常是我们所关注的全部。问题是：我们是如何达到目标的？</p>

    <p class="calibre5">当我们利欲熏心，为达目的不择手段时，就犯了功利误导谬误。操纵这种谬误的态度是：只要我成功了，如何取得成功并不重要。</p>
