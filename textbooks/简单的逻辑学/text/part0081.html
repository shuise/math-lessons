    <h3 class="calibre2">27.避免结论</h3>

    <p class="calibre5">人们的推理是有目的的。我们发现问题，研究其解决之道。我们通过论证得出结论。论证的前提是得出结论的基础。如我们所知，前提必须符合论证。如果我们由无效的证据（弱前提）直接跳到结论，论证将不是必然的。</p>

    <p class="calibre5">结论是必然要达到的。论证------人类推理的语言学称谓------是以目标为导向的。如果我们做论证目的只是为了使自己听到自己在说什么，那将是论证的庸俗化。认识到有些问题目前在我们认识能力的范围以外，暂时无法解决是一回事，但是接受这样的问题永远不能解决的结论则完全是另外一回事。这是在用推理来破坏推理的内在目的。</p>
