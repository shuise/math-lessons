    <h3 class="calibre2">7.论证不是争吵</h3>

    <p class="calibre5">论证是理性的探讨，不要将它和争吵混为一谈。论证的目的是发现真相，争吵的目的是击败你的对手。有许多人，虽然他们愿意和你争吵，但却不愿意或者没有能力和你进行论证。不要浪费时间、精力和这种人进行争论。</p>
