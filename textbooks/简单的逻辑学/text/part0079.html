    <h3 class="calibre2">25.情感误导</h3>

    <p class="calibre5">当我们选择性地忽略一些与我们的信仰相抵触的重要信息时，我们就犯了情感误导谬误。导致的结果就是对所讨论问题的严重扭曲。</p>

    <p class="calibre5">假设我在写一部关于我的母校------X大学------的历史。我热爱我的母校，将在校园的日子视为我一生中最美好的时光。我想在我的作品中向人们证明我的母校是全国最好的大学之一。但是，研究得越深入，我越发现母校过去的历史并不是那么令人满意。我不改初衷，所以在写作的时候，我决定剔除所有母校历史上的负面新闻，只反映它光辉的一面。于是，我就犯了情感误导谬误，我在书中所描绘的X大学的面目已经被严重扭曲。</p>
  </div>
