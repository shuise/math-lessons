    <h3 class="calibre2">第二章</h3>

    <p class="calibre10"><b class="calibre4">逻辑学的基本原理</b></p>

    <p class="calibre10"><b class="calibre4">The Basic Principles of Logic</b></p>

    <p class="calibre5">逻辑学可以被认为是一门科学、一门艺术，或者一项技能，它也完全可以被认为是这三者的综合体。逻辑学必须有其自身的基本原理，用来规范它的范围，指引它的方向。在本章中，我们主要探讨这些基本原理，但侧重点将是其实际应用而非理论来源。我们的目的是让你吸收理论的精华，把它变成你的第二本能，随时应用到生活中，而无需可以地去想理论。</p>
