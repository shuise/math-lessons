  <p class="bodyContent">漫画中，已知庄小壮一个人吹完60个气球要20分钟，奇小奇一个人吹完60个气球要30分钟，那么两个人一起吹完60个气球要多长时间呢？</p>

  <p class="conQuot">答案：两人速度和：60÷5=12（千米）</p>

  <p class="conQuot">灵灵的速度：12-4=8（千米/小时）</p>

  <p class="conQuot">第7页的答案在这里哦！</p>
