  <p class="bodyContent">某工厂食堂运来一批蔬菜，原计划每天吃50千克，30天可以吃完。后来根据大家的意见，每天比原计划多吃10千克，这批蔬菜可以吃多少天？</p>

  <p class="conQuot">解析：×。“满100减20”与“打八折”不同：前者需要买满100元才能减20，后者则没有这个要求；并且前者是刚好买到100元的时候，才相当于打八折，超过100元的时候，就不是正好八折了。</p>

  <p class="conQuot">第31页的答案在这里哦！</p>
