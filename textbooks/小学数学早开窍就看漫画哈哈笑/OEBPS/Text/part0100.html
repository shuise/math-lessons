  <p class="bodyContent"><span class="bold">答案在第25页，一定要先做完，再看答案哦！</span></p>

  <p class="bodyContent">有一条2000米长的公路，在路的一侧从头到尾每隔50米栽一棵树，那么总共需要栽多少棵树呢？</p>

  <p class="conQuot">答案：距离差：72×15=1080（米）</p>

  <p class="conQuot">追及时间：1080÷（132-72）=18（分钟）</p>

  <p class="conQuot">第13页的答案在这里哦！</p>
