  <p class="bodyContent">一个圆柱的底面半径是2cm，侧面积是12.56cm<sup>2</sup>，那么这个圆柱的体积是多少？</p>

  <p class="conQuot">答案：64个。经过观察，这是一个4层的正方体，每层的小正方体各有4行，一行4个，所以一层有4×4=16（个），4层共有16×4=64（个）。</p>

  <p class="conQuot">第37页的答案在这里哦！</p>
