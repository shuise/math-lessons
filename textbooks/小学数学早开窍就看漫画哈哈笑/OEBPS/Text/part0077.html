  <p class="bodyContent"><span class="bold">答案在第19页，一定要先做完，再看答案哦！</span></p>

  <p class="bodyContent">小朋友们，漫画中奇小奇习题册上的九宫格你能帮他填完整吗？注意要每一行、每一列、每一斜行的3个数之和都是15。</p>

  <p class="conQuot">答案：云云最矮。分析：题目中让找谁是最矮的，首先排除天天，因为他是最高的；然后排除阳阳，因为阳阳比云云高，从而推理出云云是最矮的。</p>

  <p class="conQuot">第25页的答案在这里哦！</p>
