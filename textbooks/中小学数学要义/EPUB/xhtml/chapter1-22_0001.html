  <body class="calibre2">
	<p class="calibre3"><span id="" class="calibre8">小时候，很多孩子都玩过数字读心术游戏，你请你的朋友在心里想一个两位数，但不要告诉你和其他任何人。接下来请他用计算器将这个数乘以5，再加上9，结果继续保密，然后再乘以4，加上4，最后乘以5，并把最后的结果报给你。</span></p>
	<p class="calibre3"><span id="" class="calibre8">如果他最后报给你的数是2500，你将这个数字去掉最后两个0，减去2，就可以“读出”他最初心里想的数是23。你知道这种数字读心术的奥秘吗？这一章介绍的代数方法将为你揭开数字读心术的奥秘。</span></p>
