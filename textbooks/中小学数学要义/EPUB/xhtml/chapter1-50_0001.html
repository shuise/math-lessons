	<p class="calibre3"><span id="" class="calibre8">解析几何中的坐标方法可以很好地处理一些与线段长度相关的几何问题，但是涉及直线方向和角度的问题时，单纯的坐标方法并没有多大优势。这一章介绍的向量方法也是属于解析几何范围，也是将几何问题转化为代数运算——向量的加法运算、数乘运算、内积运算。比起坐标方法，向量在处理与直线方向和角度相关的问题上有天然优势，因为向量本身就是带方向的量。向量及其运算的另一大优势是不依赖直角坐标系的选取，所以在处理几何问题时，比坐标方法更直接，更能把握几何问题的代数本质。</span></p>
