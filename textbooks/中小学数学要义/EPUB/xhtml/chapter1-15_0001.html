	<p class="calibre3"><span id="" class="calibre8">最早的几何学起源于人们对空间结构和万物形状的认识。几何中最基本的概念都可以在现实生活中找到根源，点的概念是对位置的抽象；直线和长度概念是对笔直的事物和行程距离的抽象；射线和角源自于对方向和观察角度的抽象；面积概念来源于对土地的测量；体积的概念来源于对谷仓和各种器皿容量的计算……</span></p>
