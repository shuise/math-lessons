	<p class="calibre3"><span id="" class="calibre8">1630年前后，两位法国数学家费马和笛卡尔，分别独立地开创了一门联系几何与代数的数学分支——解析几何。解析几何的核心思想就是利用两条垂直的数轴，将平面上的每个点用实数对（两个实数）表示，就像数轴上的点可以用一个实数表示一样。平面上的点与实数对之间的这种对应关系可以将大量的几何问题转化为代数问题，同时也可以为许多代数、方程问题提供几何意义。</span></p>
	<p class="calibre3"><span id="" class="calibre8">其实费马开创解析几何比笛卡尔要早10年左右，但很遗憾的是，现在的大多数教科书介绍解析几何的时候，只提笛卡尔，不提费马。</span></p>
