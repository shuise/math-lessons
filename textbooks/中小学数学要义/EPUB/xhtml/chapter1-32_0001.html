	<p class="calibre3"><span id="" class="calibre8">在这一章中，我们要做的事情，和两千多年前一位叫欧几里得的古希腊几何学家所做的事情是一样的。这位两千多年前的古人，他究竟做了什么事情，有多大意义？居然值得两千年后的我们继续效仿。其实在欧几里得之前，巴比伦人、古埃及人、古希腊人已经积累了大量的几何知识，但这些知识散落在各个角落，不成体系。欧几里得将前人关于几何的大量知识系统地整理在他的巨著《几何原本》中。在这本书中，作者从少数几个显而易见的公理出发，利用严密的逻辑推理，推导出整个几何知识体系！</span></p>
