  <body id="C27JQ0-7fb6169c724040fabc00d7e2dab9522e" class="calibre">
  <h2 class="bodycontent-first-title" id="calibre_pb_0">第二部分　数学知识</h2>

  <p class="bodycontent-text_yinwen">碰撞</p>

  <p class="bodytext1"><br class="calibre6"/></p>

  <p class="bodycontent-text_yinwen">世界很大，又或很小，</p>

  <p class="bodycontent-text_yinwen">有些事情我们从未曾见过，</p>

  <p class="bodycontent-text_yinwen">却迟早会发生。</p>

  <p class="bodycontent-text_yinwen">如果不是无数次发生在诡异的夜晚，</p>

  <p class="bodycontent-text_yinwen">或昏暗的残月下，</p>

  <p class="bodycontent-text_yinwen">又或闰年，</p>

  <p class="bodycontent-text_yinwen">那么我保证，</p>

  <p class="bodycontent-text_yinwen">在无数次可能后它们必将发生。</p>

  <p class="bodytext1"><br class="calibre6"/></p>

  <p class="bodycontent-text_right3">——约瑟夫·马祖尔</p>

  <p class="bodytext1"><br class="calibre6"/>
  <br class="calibre6"/></p>

  <p class="bodycontent-text_yinwen">接下来我们介绍几个分析巧合故事的数学工具——大数定律，真正的大数定律、生日问题、概率论和频数分布论。本部分内容包含了所有能派上用场的数学知识，以便理解本书的主要论点，即如果某件事情有可能发生，不管多小，一定会在某个时间发生。有些数学知识将用于分析第一部分的故事，在第三部分仍会回过头再次使用。</p>
