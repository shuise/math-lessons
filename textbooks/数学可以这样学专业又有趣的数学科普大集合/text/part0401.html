  <body id="BUDHI0-7fb6169c724040fabc00d7e2dab9522e" class="calibre">
  <h2 class="bodycontent-first-title" id="calibre_pb_0">第一部分　奇闻异事</h2>

  <p class="bodycontent-text_yinwen">巧合</p>

  <p class="bodytext1"><br class="calibre6"/></p>

  <p class="bodycontent-text_yinwen">这是一个真实的故事</p>

  <p class="bodycontent-text_yinwen">故事的开端新颖独特，闻所未闻</p>

  <p class="bodycontent-text_yinwen">接着我们惊奇地发现</p>

  <p class="bodycontent-text_yinwen">它与大千世界中的事物有着极大的相似</p>

  <p class="bodycontent-text_yinwen">我们困惑不解</p>

  <p class="bodycontent-text_yinwen">或许这只是我们认为的巧合</p>

  <p class="bodycontent-text_yinwen">但如果不是呢？</p>

  <p class="bodytext1"><br class="calibre6"/></p>

  <p class="bodycontent-text_right3">——约瑟夫·马祖尔</p>

  <p class="bodytext1"><br class="calibre6"/>
  <br class="calibre6"/></p>

  <p class="bodycontent-text_yinwen">生活充满着期待、喧闹和快乐，但奇妙的巧合给我们无尽的欢喜。下面将向您讲述几个故事，让您感受到世界很大，但有时也很小，接着将区分侥幸和巧合这两个概念。在了解了一定的理论知识，能够阐释其中隐藏的原因之后，第三部分我们将再次回到这些故事。</p>
