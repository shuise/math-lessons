  <h5 class="chapter-four1">2.3.1　再会自乘机器</h5>

  <p class="bodytext">我们在M（x）≡＃这类机器上验证了无穷放大镜的思想，得到了M'（x）=0。我们还在M（x）≡ax+b这样的机器上进行了验证，得到了M'（x）=a。到此为止我们都只是重新发现我们已经发现了的常规斜率公式，并且没有无穷放大。</p>

  <p class="bodytext">然后我们又第一次用弯曲的东西——自乘机器M（x）≡x<sup class="calibre5">2</sup>——检验了我们的无穷放大镜，并得到了M'（x）=2x。在继续其他例子之前，让我们用两种不同的方式来解读一下，以确定自己理解了这些。</p>
