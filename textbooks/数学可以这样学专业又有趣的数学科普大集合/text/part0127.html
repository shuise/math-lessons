  <h3 class="chapter-two1">第3章　仿佛来自虚空</h3>

  <p class="yinwen">每一门科学，当我们不是将它作为能力和统治力的工具，而是作为人类一代代努力追求的对知识的冒险历程，不是别的，就是这样一种协奏，从一个时期到另一个时期，或多或少，巨大而又丰饶：在不同的时代和世纪，对于依次出现的不同主题，它展现给我们精妙入微的对应，仿佛来自虚空。</p>

  <p class="bodytext-right">——格罗滕迪克，《收获与播种》（Récoltes et Semailles）</p>
