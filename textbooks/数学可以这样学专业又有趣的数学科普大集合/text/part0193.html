  <h5 class="chapter-four1">6.2.5　不熟悉的情形</h5>

  <p class="bodytext">同以往一样，机器m（x）≡x<sup class="calibre5">2</sup>提供了一个简单的测试。我们来看一下，如果我们想知道（比如）x=0和x=3之间的面积，基本锤子会告诉我们什么：</p>

  <div class="zhong2"><img alt="" class="image-tuzhu" src="../images/03724.jpeg"/></div>

  <p class="bodytext">其中M（x）是导数为x<sup class="calibre5">2</sup>的某台机器。我们能想到是什么机器吗？嗯，由于求导会让指数减1，因此应该类似＃x<sup class="calibre5">3</sup>。如果我们求导并将指数减1，最后需要得到x<sup class="calibre5">2</sup>，因此有（＃x<sup class="calibre5">3</sup>）'=3＃x<sup class="calibre5">2</sup>=x<sup class="calibre5">2</sup>，从而得到＃必须为<img alt="" class="gongshi" src="../images/03725.jpeg"/>。因此M（x）=<img alt="" class="gongshi" src="../images/03726.jpeg"/>是x<sup class="calibre5">2</sup>的反导数，这样我们就可以继续展开上面的等式，得到</p>

  <div class="zhong1"><img alt="" class="image-tuzhu" src="../images/03727.jpeg"/></div>

  <p class="bodytext">有意思……这个特别的弯曲东西的面积刚好是整数。简单得让人心里没底。接下来我们该做什么？</p>
