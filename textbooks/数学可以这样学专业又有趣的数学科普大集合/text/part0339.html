  <h2 class="bodycontent-first-title" id="calibre_pb_0">第十五章　为大众而生的食物</h2>

  <p class="bodytext">烹饪有其实用的一面。烹饪最初目的是维持生计，提供健康的、维系生命的膳食。</p>

  <p class="bodytext">数学有其实用的一面，数学（算术和几何）最初的目的是解决社会、农业和宗教中的重大问题。</p>

  <p class="bodytext">很明显，数学和美食学在其对世界的物质重要性上是相似的。如此显而易见的事实，我不会再提及了。</p>

  <p class="bodytext">这本书专注于弄清数学和美食学的非物质方面——</p>

  <p class="bodytext">·它们有什么吸引人之处。</p>

  <p class="bodytext">·我们如何对它们进行判断。</p>

  <p class="bodytext">·我们该如何从事数学和美食学实践和研究。</p>

  <p class="bodytext">·我们的创意、想法从何而来。</p>

  <p class="bodytext">以及许多其他问题——也都非常相似。</p>

  <p class="bodytext">有用性已经足矣！下一章！</p>
