  <body id="3M85O0-7fb6169c724040fabc00d7e2dab9522e" class="calibre2">
  <h4 class="chapter-three1">为什么零次幂必须等于1</h4>

  <p class="bodytext">我们不知道（<span class="jiacu">某个东西</span>）<sup class="calibre5">＃</sup>的意义是什么，但我们可以要求它的意义必须保证（<span class="jiacu">某个东西</span>）<sup class="calibre5">a+b</sup>=（<span class="jiacu">某个东西</span>）<sup class="calibre5">a</sup>（<span class="jiacu">某个东西</span>）<sup class="calibre5">b</sup>能够成立，其中a和b可以是任何数，而不必是正数或整数。根据这条不寻常的思路，让我们来看看（<span class="jiacu">某个东西</span>）<sup class="calibre5">0</sup>意味着什么。根据方框中的思想，我们可以写：</p>

  <p class="bodytext-c">（<span class="jiacu">某个东西</span>）<sup class="calibre5">＃</sup>=（<span class="jiacu">某个东西</span>）<sup class="calibre5">＃+0</sup>=（<span class="jiacu">某个东西</span>）<sup class="calibre5">＃</sup>（<span class="jiacu">某个东西</span>）<sup class="calibre5">0</sup>。</p>

  <p class="bodytext">这表明（<span class="jiacu">某个东西</span>）<sup class="calibre5">0</sup>在与任何数相乘时结果应当不变。因此我猜（<span class="jiacu">某个东西</span>）<sup class="calibre5">0</sup>应当为1。这次终于清楚了！我们把它写下来。</p>

  <div class="kx">
    <p class="bodytext-c"><span class="jiacu">我们的间接定义要求这个必须成立</span></p>

    <p class="bodytext-c">（<span class="jiacu">某个东西</span>）<sup class="calibre5">0</sup>=1。</p>
  </div>
