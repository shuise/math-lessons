<h2 class="bodycontent-second-title1" id="sigil_toc_id_28">图示的重要性</h2>

  <p class="bodycontent-text">如果我们的研究对象属于微观或者宏观形态学范畴，那么精确地画出研究对象的各种特征和全貌就是最基本的要求之一。无论文字描述多么精细、准确，其效果永远也比不上一张出色的示意图，这是千真万确的。因为表现研究对象的图示直接反映出观察的仔细程度，给希望亲自确认我们研究结果的其他研究者提供了宝贵的资料。一张忠实绘制的图示与一篇精当的文字描述的价值是相等的。</p>

  <p class="bodycontent-text">如果研究对象太过复杂，那么图示绘制完成后，还要加上说明性的或者半说明性的图表。有些情况中使用普通照片或者显微照片会起到很大作用，当然后者更能确保我们描述的客观真实性。</p>
