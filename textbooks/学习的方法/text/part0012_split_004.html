<h2 class="bodycontent-second-title1" id="sigil_toc_id_27">结论</h2>

  <p class="bodycontent-text">一旦我们清楚、简明、系统化地阐释了自己的观察和看法，就可以给文章添加一个简洁有力的收尾，综合概括有用的数据，即我们从事研究的首要动机。将读者的注意力引到尚未解决的问题上去以便其他研究者做出努力，最终完善我们的工作，这种结尾方式虽然不是每个学者都用，但这是一种值得赞许的做法。向后来的研究者指出进一步研究的方向，阐明我们目前的工作还没有解决的问题，这样做可以使我们的发现迅速得到检验和全面确认，同时也会慷慨地给予年轻研究者成名的机会。</p>
