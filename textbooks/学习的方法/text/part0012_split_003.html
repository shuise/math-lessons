<h2 class="bodycontent-second-title1" id="sigil_toc_id_26">如何描述方法</h2>

  <p class="bodycontent-text">全面地描绘出作者使用的所有研究方法也很重要。这些描述既可以放在专论的开头，也可以放在结尾。不要像有些学者那样，以还需要改进为借口，对自己使用了什么方法严格保密，藏着不说。这种做法很容易让人想起几个世纪之前的、早已被遗忘的风俗。那时的数学家和化学家将解决问题的步骤、细节等当作不可告人的秘密，因为他们有一种幼稚的虚荣心，希望人们惊奇于自己的智慧。如今，幸而科学昌明，这种令人费解的做法已经逐渐消失，连科学期刊的普通读者都可以马上了解到某种方法的全部细节，读者仿佛成为科学家的亲密朋友一样熟知他的行动。</p>
