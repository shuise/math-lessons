<p id="filepos394480" class="calibre_"><span class="calibre1"><span class="bold">第 5 章　数据的统计分析——机会限度的认识</span></span></p><p class="calibre_">讲完了收集数据的问题，在本章中我们要转向数据的统计分析方面。这个问题在前面已谈了一些，如在第 3 章中谈及用算术平均去估计总体平均值及其误差问题和区间估计问题，这些都是重要的统计分析方法。相比较起来，统计分析问题的讨论涉及的数学问题更多更复杂，不宜在本书中过分深入，而只能做一些原则性的解释。想要实地应用这些方法的读者，还得去研读有关的统计学教科书。</p><div class="mbp_pagebreak" id="calibre_pb_20"></div>
