<p id="filepos477071" class="calibre_"><span class="calibre1"><span class="bold">作者简介</span></span></p><p class="calibre_"><span class="bold">陈希孺</span></p><p class="calibre_">数理统计学家。1934年2月11日生于湖南望城。1956年毕业于武汉大学数学系。1997年当选为中国科学院院士。 曾任中国科学技术大学、中国科学院研究生院教授，中国概率统计学会第一届理事长，中国现场统计学会理事长，《应用概率统计》主编等。主要从事数理统计学研究，在线性回归大样本理论领域获得一系列具有重要意义的成果。在参数统计和非参数统计领域都做出了具有国际影响的工作。1998年获中国科学院自然科学奖一等奖。著有《概率论与数理统计》《数理统计学教程》《数理统计学简史》《统计学漫话》等。 </p><p class="calibre_"> </p><div class="mbp_pagebreak" id="calibre_pb_26"></div>
