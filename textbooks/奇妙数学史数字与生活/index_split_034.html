<p id="filepos393119" class="calibre_8"><a href="index_split_002.html#filepos7781"><span class="calibre1"><span class="bold">作者简介</span></span></a></p><p class="calibre_9">汤姆·杰克逊（Tom Jackson），英国著名科普作家、编辑，从事科普创作和编辑20多年，创作过100多部畅销作品。汤姆擅长多个学科领域的知识，其作品涵盖范围甚广。他一直致力于寻找有趣、生动的叙述方式，以使自己的作品适合不同年龄层、不同阅读能力的读者阅读。汤姆偕妻子和3个孩子居住在英国的布里斯托。</p><div class="mbp_pagebreak" id="calibre_pb_34"></div>
