  <h1 class="onetitle" id="CHP1">引文</h1>

  <p class="text">如果你要造船，不要招揽人来搬木材，不要给人指派任务和工作，而是要教他们去渴望那广袤的大海。</p>

  <p class="dateauthor">——安托万·德·圣埃克苏佩里</p>
