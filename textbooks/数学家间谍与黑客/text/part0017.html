  <h1 class="calibre6" id="G6PI1-80aa98e934db469689808312cf09950c">第三章 编码机</h1>

  <p class="calibre5">19世纪，编码不断普及，其用途不再局限于发送秘密信息。19世纪上半叶，电报的发展，以及随后托马斯·爱迪生的双向电报的发展，革新了全世界的信息通信。由于电报靠电脉冲驱动，就必须运用一套系统，将信息内容翻译为机器能够表达的语言，并发送出去。换句话说，需要用代码表示自然语言。在众多创意当中，美国艺术家和发明家塞缪尔·莫尔斯（Samuel Morse）发明的点线系统（即莫尔斯电码）脱颖而出。人们把莫尔斯电码看作编码的前身，几十年之后，我们间接使用它们给计算机输入数据，并读懂从计算机输出的数据。</p>
