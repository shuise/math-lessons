  <h1 class="calibre6" id="11C3M1-80aa98e934db469689808312cf09950c">第六章 量子化的未来</h1>

  <p class="calibre5">根据菲利普·齐默尔曼在西蒙·辛格（Simen Singh）的《密码故事》（<span class="italic">The Code Book</span>）中的说法，“在现代密码学中，有可能创造出所有密码分析手段都破解不了的密码”。前面我们说过，即便是性能最强大的计算机，其计算能力也无法暴力破解像RSA或DES那样的加密算法，甚至连PGP那样的混合加密系统也不太可能被暴力破解。那么有没有可能存在某种数学捷径，能够降低密码破解的复杂性呢？虽然不能完全否认这种可能性，但也没人特别看好这种可能。</p>

  <p class="calibre5">齐默尔曼说的话对吗？加密者和解密者之间持续1 000多年的爱恨对决已经结束了吗？</p>
