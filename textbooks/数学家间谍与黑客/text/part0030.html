  <h2 class="calibre4" id="SJGS1-80aa98e934db469689808312cf09950c">密钥分配问题</h2>

  <p class="calibre5">人们普遍认同，为维护密码的安全性，保护密钥应先于保护算法。那么问题就产生了：如何分配密钥才安全？即便是最简单易用的加密方式，大规模使用时也会出现问题，比如如何在庞大的军队中分派数千本密码本，或者如何把它们分派给处于极端条件下（比如在深海执行秘密任务或与敌方激战正酣）的部队。经典加密系统无论有多精密，它们的密钥都易被截取。</p>
