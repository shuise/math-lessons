  <h1 class="calibre6" id="6LJU1-80aa98e934db469689808312cf09950c">第二章 19世纪之前的密码学</h1>

  <p class="calibre5">在前文中我们说过，密码学是一门古老的学科，或许与文字交流本身一样古老。但是，它不是唯一秘密传送信息的方法。毕竟，所有文本都必须要有传播媒介，如果能让这个媒介只对接收者可见，就算达到了隐藏信息的目的。隐藏信息存在的技术叫作“隐写术”，与密码学兴起于大约同一时期，也有着同样的起因和使命。</p>
