<h1 class="calibre1" id="calibre_pb_0">下 篇 归纳逻辑</h1>
<p class="bodytext">归纳逻辑是指对经验科学以及日常思维中非演绎论证类型的推理过程与方法的种种研究。前提必然蕴含结论的称为演绎，前提不必然蕴含结论或者说前提与结论的关系是或然的，称为非演绎。广义的归纳逻辑研究非演绎结论的推理过程，具体内容包括归纳推理、统计推理、因果推理、合情推理和科学假说等，从它们的前提出发虽然不能确保结论为真，但通过理性的批判性准则进行归纳推理，可以推出高概率的结论。</p>
