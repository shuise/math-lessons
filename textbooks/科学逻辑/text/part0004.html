<h1 class="calibre1" id="calibre_pb_0">上 篇 演绎逻辑</h1>
<p class="bodytext">科学演绎方法在科学认识中的作用巨大，是人们以一定的反映客观规律的理论认识为依据，从该认识的已知部分推知事物的未知部分的思维方法。演绎逻辑的根本特征是保真推理，即只要前提正确，结论必定正确的一种推理形式。具体是指从一般性的前提出发，通过推导即“演绎”，必然性地推出确定的结论。</p>
