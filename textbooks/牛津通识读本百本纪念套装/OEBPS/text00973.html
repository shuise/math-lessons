<h1 class="chapter-one">前言</h1>
<p class="bodytext">计划写作一本关于古典哲学的通识读物令我着迷了一段时间。我要感谢克里斯托弗·吉尔、劳拉·欧文、大卫·欧文和牛津大学出版社的一位读者，更要感谢谢利·考克斯给我的鼓励和对该书的评论。还要感谢辛迪·霍尔德在校对和编注索引方面为我提供的帮助。自不待言，本书中出现的疏漏与不足责任在我。谨以此书纪念我的朋友琼·汉普顿，我多么希望她已读到这本书。</p>
