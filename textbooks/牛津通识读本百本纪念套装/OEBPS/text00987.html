<h1 class="chapter-one">前言</h1>
<p class="bodytext">广告业充斥着神话与误解。在常人眼中，广告行为影响巨大但铺张浪费，在推动经济繁荣的同时却又在道德方面受到质疑。人们对于广告行为的历史起源和现代运作都不甚了解。和普通公众一样，在广告业内部（这个行业本身就是个神话），许多这样的神话和误解同样广为流传。本书作者熟知广告业务，他纠正并澄清了人们对广告业的普遍误解。</p>
