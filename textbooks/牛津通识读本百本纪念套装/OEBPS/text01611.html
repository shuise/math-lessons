<h1 class="chapter-one" id="CHP15">注释</h1>
<p class="biaoti">第一章</p>
<p class="noteContent">
<a id="jzyy_20_1" href="text01600.html#jz_1_20">[1]</a>
 即犹太人聚居隔离区。——译注</p>
<p class="biaoti">第三章</p>
<p class="noteContent">
<a id="jzyy_45_1" href="text01602.html#jz_1_45">[1]</a>
 意为“提凡的儿子塔比塔的女儿卡西珊·达希亚”。——译注</p>
<p class="noteContent">
<a id="jzyy_55_1" href="text01602.html#jz_1_55">[2]</a>
 复活节前的第七个星期三，需以灰抹额以示忏悔。——译注</p>
<p class="biaoti">第五章</p>
<p class="noteContent">
<a id="jzyy_84_1" href="text01604.html#jz_1_84">[1]</a>
 原文如此。应为1972。——编注</p>
<p class="noteContent">
<a id="jzyy_86_1" href="text01604.html#jz_1_86">[2]</a>
 译文选自和合本《圣经》。——译注</p>
<p class="biaoti">第六章</p>
<p class="noteContent">
<a id="jzyy_97_1" href="text01605.html#jz_1_97">[1]</a>
 出自《申命记》第11章第18节。——译注</p>
<p class="biaoti">第九章</p>
<p class="noteContent">
<a id="jzyy_137_1" href="text01608.html#jz_1_137">[1]</a>
 指本章以下各小节按照小标题英文原文首字母先后顺序排列。——编注</p>
