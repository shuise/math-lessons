<h1 class="chapter-one">修订版序</h1>
<p class="bodytext">我在修订这本简明读本的时候参考了近期的研究成果，对无论是第一手资料还是第二手资料都尽量提供更为可靠的指南。我还在自认为不准确或容易引起误解的地方对文本进行了修改，并且新增一章来探讨康德的政治哲学——该主题自本书问世以来引起了越来越多的关注。我对康德所作的阐释绝不是唯一的一种。在变得愈加复杂的争议中我只能支持其中的一方。在延伸阅读指南中我列出了一些书目，这些书将会帮助修正这本小册子不可避免地所带有的片面性。</p>
<p class="bodytext-right">2001年1月于马姆斯伯里</p>
