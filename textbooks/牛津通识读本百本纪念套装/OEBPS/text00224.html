<h1 class="chapter-one">注释</h1>
<p class="heiti">前言</p>
<p class="noteContent">
<a id="notef1" href="text00214.html#note1">[1]</a>
 指原书名中的Introduction。——编注</p>
<p class="noteContent">
<a id="notef2" href="text00214.html#note2">[2]</a>
 诺曼·汉普森生于4月8日，与“前言”撰写同日。汉普森已于2011年去世。——编注</p>
<p class="noteContent">
<a id="notef3" href="text00215.html#note3">[3]</a>
 珀西·布莱克尼的别名。——编注</p>
<p class="noteContent">
<a id="notef4" href="text00216.html#note4">[4]</a>
 这里指的是1756年“外交革命”中法国与昔日的宿敌哈布斯堡君主国缔结的联盟，这个联盟在随后的七年战争中惨败。——译注</p>
<p class="noteContent">
<a id="notef5" href="text00220.html#note5">[5]</a>
 指索邦大革命史研究所原所长让——克莱芒·马丁，他自2000年开始担任所长，现已卸任。——译注</p>
<p class="noteContent">
<a id="notef6" href="text00221.html#note6">[6]</a>
 这个日期以及以下两个日期中，5月应为6月。原著有误。——译注</p>
<p class="noteContent">
<a id="notef7" href="text00221.html#note7">[7]</a>
 应为7月。——译注</p>
