<h1 class="chapter-one">注释</h1>
<p class="xiaobiao">第二章</p>
<p class="noteContent">
<a id="b1" href="text01398.html#a1">[1]</a>
 个体判断远近，把世界看成三维的知觉。——编注</p>
<p class="xiaobiao">第三章</p>
<p class="noteContent">
<a id="b2" href="text01399.html#a2">[1]</a>
 经验上的。——译注</p>
<p class="xiaobiao">第四章</p>
<p class="noteContent">
<a id="b3" href="text01400.html#a3">[1]</a>
 即“丁字路口”。——译注</p>
<p class="noteContent">
<a id="b4" href="text01400.html#a4">[2]</a>
 原文reinvent the wheel指做多余的努力。——译注</p>
<p class="noteContent">
<a id="b5" href="text01400.html#a5">[3]</a>
 科学幻想电视节目中的人物。——译注</p>
<p class="xiaobiao">第六章</p>
<p class="noteContent">
<a id="b6" href="text01402.html#a6">[1]</a>
 人格成熟的一种状态，是一个人根本的、连续性的自我。——编注</p>
<p class="xiaobiao">第八章</p>
<p class="noteContent">
<a id="b7" href="text01404.html#a7">[1]</a>
 让病人在身体放松时逐渐靠近刺激物，直至病人的焦虑反应完全消失为止。——编注</p>
<p class="xiaobiao">第十章</p>
<p class="noteContent">
<a id="b8" href="text01406.html#a8">[1]</a>
 指研究人和机器、环境的相互作用及其合理结合的一门科学。——译注</p>
