<h1 class="chapter-one">前言</h1>
<p class="bodytext">克尔凯郭尔的著作涉猎广泛，纷繁复杂，对他的思想进行简短的介绍不是一件容易的事情。我没有试图涵盖其全部思想的不同方面，而是觉得着重介绍与他那个时代的学术和文化主题最有关联的方面比较好。走笔之间，我努力追溯促使他形成自己关于伦理和宗教地位的独特观点的种种因素，同时指出他对后来的思想史在哪些方面产生了影响——我们虽然没有及时认识到这些影响，它们却是重要的。本书内容有限，无法讨论他的其他许多作品，包括他对宗教生活之本质最为直接的论述，而他认为人们应该理解这一本质。</p>
<p class="bodytext">本书第四章的部分内容来自我几年前在英国电影学院所作的一次演讲，演讲内容已经发表。在本书中，这些内容已经作了相当的修正和改动。</p>
