<h2 class="chapter-two">患有自闭症谱系障碍需要花费多少？</h2>
<p class="bodytext">健康经济学家还真算出来照顾一位具有自闭症谱系状况的人一辈子需要花费多少。在英国，一位自闭症高功能人士据估算要花费290万英镑，而低功能人士一生则需要470万英镑。现在大多数资金都花在生活辅助上。然而，很多情况还达不到理想的生活所需。社会服务和特殊教育长期缺乏资金，还很容易把更多资金花费在促进和提高它们的工作上。</p>
<p class="bodytext">但估算经济负担是一回事，人工成本又是一回事，而且完全不可能估算。很明显，减轻自闭症造成的负担势在必行。</p>
