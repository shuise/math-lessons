<h1 class="chapter-one">致谢</h1>
<p class="bodytext">在此对迈克尔·艾尔斯深表感谢，感谢他慷慨地将他大部分重要的洛克哲学研究手稿借给我，他对洛克著作的出色认识和理解令我在过去许多年中感到快乐和兴奋。感谢牛津大学出版社的亨利·哈代、基思·托马斯和艾伦·瑞安，他们在书稿的准备过程中给予了我极有帮助的建议，他们展现的耐心远超我所应得。我还要诚挚感谢那些在不同阶段、出于不同原因帮我审读部分草稿或通读草稿的朋友。我还要特别感谢辛西娅·法勒、迈克尔·伊格纳季耶夫、加藤隆史、乔纳森·里尔和昆廷·斯金纳的鼓励、帮助和批评。</p>
