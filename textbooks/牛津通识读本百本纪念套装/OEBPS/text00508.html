<h1 class="chapter-one">第二章 什么是民族？</h1>
<p class="yinwen">
<span class="jiacu">民族是由出身情况决定的、居住在一个领地内的共同体</span>
 。一个人生来就属于一个民族。民族是历史上不断变迁、在一个领地内生活并具有一定文化特征的共同体。正因为生来就属于一个民族这一生物事实极被看重，民族是人类几种亲属关系的一种。它不同于其他亲属关系形式，比如家庭，因为其核心是领地。它也不同于其他拥有领地的社会，比如部落、城邦或各种“族群”，因为它不仅占有更大范围的领地，而且有相对统一的文化为民族提供稳定性，使其长时间持续存在。</p>
<p class="bodytext">民族的这一定义，有一些复杂情况需要仔细考虑。</p>
