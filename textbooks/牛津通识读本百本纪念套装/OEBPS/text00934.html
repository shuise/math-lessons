<h1 class="chapter-one">注释</h1>
<h2>第一章</h2>
<p class="noteContent">
<a id="notef1-1" href="text00928.html#note1-1">[1]</a>
 原文为拉丁文。——编注</p>
<h2>第二章</h2>
<p class="noteContent">
<a id="notef2-1" href="text00929.html#note2-1">[1]</a>
 津巴布韦的旧称。——译注</p>
<h2>第四章</h2>
<p class="noteContent">
<a id="notef4-1" href="text00931.html#note4-1">[1]</a>
 英文为Doo Wop，一种节奏布鲁斯音乐，首先在美国黑人社区兴起。——译注</p>
<p class="noteContent">
<a id="notef4-2" href="text00931.html#note4-2">[2]</a>
 此处为双关语，“理所当然地”原文justly，与“正义”一词的原文justice具有相同的词根。——编注</p>
<p class="noteContent">
<a id="notef4-3" href="text00931.html#note4-3">[3]</a>
 本句中字母g、d、c分别代表“获利”、“决定”、“经济状况”三词的原文gain、decision、circumstance。——编注</p>
<h2>第五章</h2>
<p class="noteContent">
<a id="notef5-1" href="text00932.html#note5-1">[1]</a>
 社会主义者，其发表于1977年《法律和社会评论》第11期的《商品形态与法律形态》一文，在法律社会学界产生了重大影响。——译注</p>
