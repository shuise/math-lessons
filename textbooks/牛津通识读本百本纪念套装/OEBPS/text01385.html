<h1 class="chapter-one" id="CHP2">致谢</h1>
<p class="bodytext">我要感谢牛津大学纳菲尔德学院的戈登·马歇尔教授和牛津大学出版社的乔治·米勒建议我撰写此书。感谢马歇尔教授、约克大学的史蒂文·耶里教授和阿伯丁大学社会学系的大卫·英格利斯博士，他们极为友善地对前面几稿提出建议。还要感谢编辑希拉里·沃尔福德，她一如既往的编辑工作确保我说出的每一句话都表达了我的本意。</p>
