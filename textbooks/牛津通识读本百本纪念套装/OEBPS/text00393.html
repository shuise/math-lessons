<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text00388.html#zw1">[1]</a>
 这是由美国作曲家和词作家斯蒂芬·桑德海姆（1930— ）创作的一部音乐剧。该剧于1962年首演，并获得极大成功。—译注</p>
<p class="noteContent">
<a id="zhu2" href="text00388.html#zw2">[2]</a>
 《埃涅阿斯纪》第836行。此处翻译直接采自杨周翰译本。—译注</p>
<p class="noteContent">
<a id="zhu3" href="text00390.html#zw3">[3]</a>
 译文引自朱生豪译，《莎士比亚全集》第五卷，人民文学出版社，1994年，148—149页。朱译剧名为《裘力斯·凯撒》。—译注</p>
<p class="noteContent">
<a id="zhu4" href="text00390.html#zw4">[4]</a>
 又名鹅溪，“creek”一词在英文中有小河、溪流之意。—译注</p>
<p class="noteContent">
<a id="zhu5" href="text00390.html#zw5">[5]</a>
 即国会山，美国国会所在地。—译注</p>
