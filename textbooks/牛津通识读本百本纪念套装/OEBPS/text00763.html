<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text00759.html#zw1">[1]</a>
 　阿利效应是物种生态学的重要原理之一：当种群密度低于某一阈值时，物种将会灭绝。</p>
<p class="noteContent">
<a id="zhu2" href="text00760.html#zw2">[2]</a>
 　指菊科植物滨菊（<span class="xieti">Leucanthemum vulgare</span>
 ），又称法国菊、西洋菊等。——译注</p>
<p class="noteContent">
<a id="zhu3" href="text00760.html#zw3">[3]</a>
 　朱缨花属植物又名粉扑花、红绒球等。——译注</p>
<p class="noteContent">
<a id="zhu4" href="text00761.html#zw4">[4]</a>
 　《本草纲目》成书于16世纪，此处似应为“400年前”，原文应有误。——编注</p>
<p class="noteContent">
<a id="zhu5" href="text00762.html#zw5">[5]</a>
 　国际自然保护联盟的物种濒危等级系统包括灭绝、野外灭绝、极危、濒危、易危、低危、数据不足和未评估等8个等级，其中低危又分为依赖保护、接近受危、略需关注等3个亚等级。略需关注指该分类单元未达到依赖保护，但其种群数量接近受危类群。——译注</p>
