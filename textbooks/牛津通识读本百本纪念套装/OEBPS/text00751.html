<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text00709.html#zw1">[1]</a>
 指英文原版。——书中所有注释均由译者所加，以下不再一一说明。</p>
<p class="noteContent">
<a id="zhu2" href="text00709.html#zw2">[2]</a>
 指成人生涯。</p>
<p class="noteContent">
<a id="zhu3" href="text00712.html#zw3">[3]</a>
 原文Last的字面意思是“最后”。</p>
<p class="noteContent">
<a id="zhu4" href="text00746.html#zw4">[4]</a>
 指美国殖民史中，生活在北美地区的部分印第安人。</p>
<p class="noteContent">
<a id="zhu5" href="text00749.html#zw5">[5]</a>
 又作“激进现实主义”。</p>
