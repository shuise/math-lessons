<h1 class="chapter-one">前言</h1>
<p class="bodytext">既是通识读本，就该有一篇短小精悍的前言。衷心感谢“牛津通识读本”系列高级组稿编辑和高级助理组稿编辑安德烈娅· 基根和艾玛· 马自始至终的帮助。本书是在柏林国家图书馆（林登大道）那间装修得金碧辉煌的阅览室里写作完成的，感谢该馆诸位工作人员的友好协助。我还想感谢迈克· 斯夸尔和克里斯· 惠顿帮我寻找和选择插图，谢谢他们给我在柏林的生活留下了那么多美好回忆。最后，我的妻子劳拉· 斯威夫特仔细阅读了全书，并且在很多方面让它变得更加完美，我像以往任何时候一样，对她充满感激。</p>
<p class="bodytext-right">W. R. A.<br/>
于柏林<br/>
2013年7月</p>
