 Agathotopia意为“美好但非完美”，而Utopia则意为“完美但不可行”。——序言作者注</p>
<h2 class="sigil_not_in_toc">第五章</h2>
<p class="noteContent">
<a id="notef2-1" href="text00863.html#note2-1">[1]</a>
 作者将此二者视为两种制度。其中Science指的是共众资助的研发，Technology指的是民间资助的研发。在译文中保留英文（首字母大写）来区分通常意义上的科学和技术。——译者注</p>
