<h1 class="chapter-one">注释</h1>
<p class="xiaobiao">第一章</p>
<p class="noteContent">
<a id="jzyy_9_1" href="text01442.html#jz_1_9">[1]</a>
 巨石构成的环形遗迹。——书中注释均由译者所加，以下不再一一注明。</p>
<p class="xiaobiao">第二章</p>
<p class="noteContent">
<a id="jzyy_16_1" href="text01443.html#jz_1_16">[1]</a>
 古称塞恩。</p>
<p class="xiaobiao">第三章</p>
<p class="noteContent">
<a id="jzyy_29_1" href="text01444.html#jz_1_29">[1]</a>
 伊斯兰国家的高官大臣。</p>
<p class="noteContent">
<a id="jzyy_30_1" href="text01444.html#jz_1_30">[2]</a>
 元代译名，指历表。</p>
<p class="noteContent">
<a id="jzyy_40_1" href="text01444.html#jz_1_40">[3]</a>
 即穆勒，他以其出生地的拉丁文名字闻名于世。</p>
