<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="jzyy_63_1" href="text01466.html#jz_1_63">[1]</a>
 即一种由被控制者接受的统治格局。统治集团并不是纯粹通过力量去统治一切，而是通过一种协调的社会结构，文化正是这种结构中的一部分，它使当今的社会组合合法化。（这是出自意大利马克思主义理论家安东尼奥·葛兰西的观点。）</p>
