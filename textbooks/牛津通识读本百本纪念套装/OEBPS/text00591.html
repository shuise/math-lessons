<h1>致谢</h1>
<p class="yinwen">本书由斯坦福大学胡佛研究所“自由社会的美德特别工作组”（Taskforce on the Virtues of a Free Society）资助，我本人在该研究所担任卡罗尔·G. 西蒙讲席高级研究员。应我的老朋友海因里希·迈尔博士之邀，德国慕尼黑的卡尔·弗里德里希·冯·西门子基金会也提供了一笔研究奖金，在2009年上半年资助我撰写本书。哈佛大学始终如一地慷慨以待，我自当铭记于心，那里毕竟是我大部分工作与生活的所在地。凯瑟琳·森森对本文内容不留情面的批评实属可贵，我对此充满感激。亡妻德尔巴·温思罗普原本会是本书的合著者，而今却只有对她的思念，陪伴我写作本书的日日夜夜。</p>
