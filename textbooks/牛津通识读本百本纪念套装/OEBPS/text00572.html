<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text00564.html#zw1">[1]</a>
 “俄罗斯芭蕾”（Ballets Russes）是巴黎的一家芭蕾舞巡演公司，于1909年与1929年间在整个欧洲巡演。——编注</p>
<p class="noteContent">
<a id="zhu2" href="text00564.html#zw2">[2]</a>
 后文统一简称CDG。——编注</p>
<p class="noteContent">
<a id="zhu3" href="text00564.html#zw3">[3]</a>
 实为2004年，应为讹误。——译注</p>
<p class="noteContent">
<a id="zhu4" href="text00566.html#zw4">[4]</a>
 又名“奥斯卡金像奖”。——编注</p>
<p class="noteContent">
<a id="zhu5" href="text00567.html#zw5">[5]</a>
 一种在商业繁华区设置临时店铺，于较短时间内推广品牌的商业模式。——编注</p>
<p class="noteContent">
<a id="zhu6" href="text00568.html#zw6">[6]</a>
 “Spoilt Bitches”为双关，“spoilt”有“损坏”和“宠坏”两重含义，“bitches”也有“母兽”和“婊子”两层意思。——编注</p>
<p class="noteContent">
<a id="zhu7" href="text00568.html#zw7">[7]</a>
 原意为“通心粉”。——编注</p>
<p class="noteContent">
<a id="zhu8" href="text00568.html#zw8">[8]</a>
 意为“赶时髦的年轻人”。——编注</p>
