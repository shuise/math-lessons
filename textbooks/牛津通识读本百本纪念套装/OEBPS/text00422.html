<h1 class="chapter-one">致谢</h1>
<p class="bodytext">我是从国会大厦的参议院一侧来审视国会的，但获益于两位众议院专家的审慎观察，他们是国家档案馆立法档案中心的肯尼思·卡托以及众议院历史与遗存办公室的马修·瓦斯纽斯基，遗憾篇幅所限，未能囊括他们的全部建议。我的朋友和同行——历史学者罗德尼·约瑟夫在国会山之外提供了一种别具一格的视角。编辑南希·托夫独具慧眼，她的意见始终引导我思考，并使行文更加锐利。我的夫人安妮·里奇不断给予我鼓励和金玉良言。谨以此书献给参议院历史办公室全体同仁，他们每一个人的协助都使这项工作成为一次积极的学习经历。</p>
