<h1 class="chapter-one">致谢</h1>
<p class="bodytext">在这里我想要感谢安徳烈娅· 基根，她是牛津大学出版社负责此书的编辑，感谢她对于这本书全力的支持与始终的鼓励。我还要感谢伦敦皇家艺术学院设计史系的所有同仁与同学们。卡罗琳· 埃文斯提出的精彩建议，夏洛特· 阿什比与比阿特丽斯· 贝伦对书稿所做的细致点评，都使我感激不尽。感谢艾利森· 托普利斯、朱迪思· 克拉克还有伊丽莎白· 柯里给这本书的有益建言。最后，衷心地感谢我的家人，感谢阿德里安· 加维所付出的一切。</p>
