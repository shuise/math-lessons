<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text01371.html#zw1">[1]</a>
 特殊消费群体形成的市场，因其规模较小常被大型企业所忽视。——编注</p>
<p class="noteContent">
<a id="zhu2" href="text01372.html#zw2">[2]</a>
 指在具体的环境和文化下，人们认为物品所具有的功能。——译注</p>
<p class="noteContent">
<a id="zhu3" href="text01373.html#zw3">[3]</a>
 保时捷汽车公司的创始者，该公司即以他的姓（Porsche）命名。——编注</p>
<p class="noteContent">
<a id="zhu4" href="text01373.html#zw4">[4]</a>
 指软件过分强调新的功能，以至于损害了其他的设计目标。——译注</p>
