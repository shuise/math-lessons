<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="jzyy_8_1" href="text01529.html#jz_1_8">[1]</a>
 原文为拉丁语，意为“人各有所好”。这既是一句谚语，也是诺贝尔经济学奖获得者加里·贝克尔一篇著名论文的标题。贝克尔的主要研究方向与选择理论紧密相关，作者此处显然是一语双关。——本书注释除特别注明外，均由译者添加。</p>
<p class="noteContent">
<a id="jzyy_10_1" href="text01529.html#jz_1_10">[2]</a>
 原文大量使用俚语，为明白起见，译文采用标准用语。</p>
<p class="noteContent">
<a id="jzyy_11_1" href="text01529.html#jz_1_11">[3]</a>
 译文用粗体表示。——编注</p>
<p class="noteContent">
<a id="jzyy_17_1" href="text01529.html#jz_1_17">[4]</a>
 原文为英美谚语，直译为“难办的案件容易败坏法律”，指人们如果徇情，对个别案件特殊处理，就会造成整个法纪的混乱。</p>
<p class="noteContent">
<a id="jzyy_39_1" href="text01531.html#jz_1_39">[5]</a>
 此处似乎与赌局Y的表述不符。0.5的概率应为一无所获，而不是鳄梨。</p>
