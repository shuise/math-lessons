<h1 class="chapter-one">第五章 学习和记忆，阅读和数字</h1>
<p class="bodytext">对幼儿而言，上学会带来非常多新的要求。学习、推理和记忆都成了儿童需要主动达成的目标，而非仅仅是每天的日常生活体验。成功的在校表现要求儿童对自己的信息处理能力有所了解：“我的记忆力怎么样？”儿童还需要能够监控自己的认知表现。学校要求儿童了解课上不同的任务需要运用何种认知技能。心理学研究显示，所有这些“元认知”技能会在3到7岁间迅速发展。本章和第六章会提到关于儿童是否了解自己的认知（元认知）的研究。与此同时，幼儿还在应对着阅读、书写及运算等重大学习要求。阅读和运算都是数百年前就已经出现了的文化创造，所以毫不奇怪的是，儿童也许要花一段时间才能顺利掌握。</p>
