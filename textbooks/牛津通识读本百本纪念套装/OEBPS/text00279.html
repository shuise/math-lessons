<h1 class="chapter-one">第二章　子类目</h1>
<p class="bodytext">我们已经阐明，纪录片是这样一种影片类型：它向观众承诺他们将要看到和听到的是一件真实而准确的事情——而且，理解这件事情还常常对我们有很重要的意义。不过，纪录片制作人必须用大量的技巧来证明以上承诺，而他们中的许多人都在商业或者准商业的环境中工作，可以运用的手段十分有限。随着纪录片的不断发展，纪录片制作人制作影片的标准、习惯、习惯手法甚至桥段都在不断更新。</p>
<p class="bodytext">我们现在就来研究几种不同的纪录片，从而了解制作人如何在不同的题材领域解决再现现实的问题。</p>
