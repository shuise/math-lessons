<h1 class="chapter-one">致谢</h1>
<p class="bodytext">最高法院专职摄影师史蒂夫·帕蒂韦，不吝时间，协助我挑选了本书采用的绝大部分图片。这是我得益于史蒂夫的专业热情的第二本书，再次向他致谢。感谢桑福德·列文森对本书初稿的意见。谢谢我的丈夫尤金·菲德尔，他也是我在法学院的同事，每章完成之后，他都作为第一读者通读全稿。我的编辑南希·托夫邀请我加入这一项目，并努力让我相信，在英语世界有许许多多好奇的读者想要更多地了解美国最高法院。我很高兴她做到了。</p>
