<h1 class="chapter-one" id="CHP2">前言</h1>
<p class="bodytext">我想通过这本书，让政治哲学对以前从未接触过它的人变得有吸引力而且易于读懂，所以努力在不牺牲准确性的前提下，尽可能写得简单。解释某些非常抽象的概念而不致陷入专门的圈内语言——如今这样的语言使那么多的学术著作索然无味——证明是一项有趣的挑战。我非常感激来自各行各业的朋友，他们惠允阅读了本书初稿，给了我总体上的鼓励和许多有益的建议，他们包括：格雷厄姆·安德森、乔治·布朗、休·米勒、伊莱恩·普尔和亚当·斯威夫特，以及牛津大学出版社的两位审稿人。我还要感谢索非娅·斯特姆洛芙斯卡在本书定稿时很有价值的帮助。</p>
