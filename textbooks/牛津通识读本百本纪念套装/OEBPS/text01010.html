<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text01003.html#zw1">[1]</a>
 德语，指被迫迁移的人。——编注</p>
<p class="noteContent">
<a id="zhu2" href="text01003.html#zw2">[2]</a>
 一般指来自黑海海岸的希腊人。——编注</p>
<p class="noteContent">
<a id="zhu3" href="text01003.html#zw3">[3]</a>
 公元前586年，犹太王国被新巴比伦王国国王尼布甲尼撒二世所灭。此时被毁的应是第一圣殿，而非第二圣殿。原文似有误。——编注</p>
<p class="noteContent">
<a id="zhu4" href="text01006.html#zw4">[4]</a>
 中学和大学之间学业间断的一年。——译注</p>
<p class="noteContent">
<a id="zhu5" href="text01008.html#zw5">[5]</a>
 美国的县为州以下的行政区。——编注</p>
<p class="noteContent">
<a id="zhu6" href="text01008.html#zw6">[6]</a>
 印度及其周边地区盛产的一种红茶。——编注</p>
