<h1 class="chapter-one">致谢</h1>
<p class="bodytext">当我对彼得说要感谢他对本书的贡献时，他给了我如下建议：“我要感谢彼得·哈珀，如果不是他执着于使用拼写检查器的话，这本书会完全不一样。”还有，我要感谢他在咖啡制作方面的专业知识和他的幽默感！这种支持本身就已无价，但彼得所做的远不止于此。可以说，没有他的持续鼓励和建设性贡献，这本书就不会写出来。</p>
<p class="bodytext-right">道恩·E.霍尔姆斯<br/>
2017年4月<span class="noteSuper">xvii</span>
</p>
