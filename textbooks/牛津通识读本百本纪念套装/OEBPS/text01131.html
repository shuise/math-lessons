<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="bz1" href="text01126.html#z1">[1]</a>
 表中第三纪最后给出的地质时代开始时间，数据与最新地质年代表有一定的出入。依据最新的地质学研究，第三纪现分为古近纪（含古新世、始新世和渐新世）和新近纪（含中新世和上新世）。——译注，下同</p>
<p class="noteContent">
<a id="bz2" href="text01126.html#z2">[2]</a>
 数据有误，应为1.5亿年。</p>
<p class="noteContent">
<a id="bz3" href="text01126.html#z3">[3]</a>
 数据有误，应为5000万年。</p>
<p class="noteContent">
<a id="bz4" href="text01127.html#z4">[4]</a>
 “动物、植物、矿物”是维多利亚时代英国的传统文字游戏。一位玩家在心中想象一个物品，另一位玩家要在20个问题后猜出这是什么。但是对于20个问题，第一位玩家只能用“是”或“否”来回答。如果回答是类似于“不知道”这样的答案，那么这个问题将不被计入问题总数内。</p>
<p class="noteContent">
<a id="bz5" href="text01129.html#z5">[5]</a>
 梁宗岱译文。</p>
