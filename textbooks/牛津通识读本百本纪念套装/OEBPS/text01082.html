<h1 class="chapter-one">注释</h1>
<p class="noteContent">
<a id="zhu1" href="text01079.html#zw1">[1]</a>
 即西奈山。——除特别注明外，本书注释均为译者所加，以下不再一一说明。</p>
<p class="noteContent">
<a id="zhu2" href="text01079.html#zw2">[2]</a>
 希腊神学家。</p>
<p class="noteContent">
<a id="zhu3" href="text01079.html#zw3">[3]</a>
 指20世纪。——编注</p>
<p class="noteContent">
<a id="zhu4" href="text01079.html#zw4">[4]</a>
 基督教中称上帝。</p>
<p class="noteContent">
<a id="zhu5" href="text01079.html#zw5">[5]</a>
 基督教中称救世主。</p>
<p class="noteContent">
<a id="zhu6" href="text01079.html#zw6">[6]</a>
 见《新约·启示录》（1：8）。</p>
<p class="noteContent">
<a id="zhu7" href="text01079.html#zw7">[7]</a>
 英文Dalit，是印度独立前对社会最底层民众的一种特定称呼，又称为“贱民”。</p>
<p class="noteContent">
<a id="zhu8" href="text01080.html#zw8">[8]</a>
 “on”在英语中为介词，指“在……之上”；在法语中为人称代词，可泛指或确指一人或多人。</p>
<p class="noteContent">
<a id="zhu9" href="text01080.html#zw9">[9]</a>
 伽达默尔已于2002年去逝。</p>
<p class="noteContent">
<a id="zhu10" href="text01080.html#zw10">[10]</a>
 保罗·利科已于2005年去逝。</p>
