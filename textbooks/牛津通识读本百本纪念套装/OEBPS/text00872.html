<h1 class="chapter-one">引用文献说明</h1>
<p class="bodytext">书中所标注的卷数和页码依据的是亚当和塔内里编辑的笛卡尔著作的标准版（巴黎：弗兰出版社，1964——1975），例如“7.12”指亚当版的第7卷第12页。英语译文主要来自科廷罕、斯多瑟夫和默多克的《笛卡尔的哲学著作》（剑桥：剑桥大学出版社，1985）。在这个译本中，亚当版的卷数标在作品最前面，页码标在文字两边的空白处。卷数后的字母A代表拉丁文本，B代表法语文本。大段引用的笛卡尔信件来自安东尼·肯尼编译的《笛卡尔：哲学信札选》（牛津：牛津大学出版社，1970年）。</p>
