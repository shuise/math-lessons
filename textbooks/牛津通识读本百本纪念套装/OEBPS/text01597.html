<h1 class="chapter-one" id="CHP1">前言</h1>
<p class="bodytext">犹太人难道没长眼睛吗？犹太人难道没长双手双脚、五脏六腑，不知冷热、不分香臭，没有七情六欲！犹太人吃的是同样的粮食，刀砍斧剁同样会受伤，同样会得病，同样能治好，同样感受得到酷暑严冬，和基督徒不一样吗？任谁刺我们一剑，我们不流血吗？</p>
<p class="bodytext-right">——威廉·莎士比亚，《威尼斯商人》，第三幕第一场</p>
