<h1 class="chapter-one">致谢</h1>
<p class="bodytext">这本小书的初稿完成于2003年夏，当时我正在法兰克福大学主持关于福柯的研讨班。衷心感谢阿克塞尔·霍耐特的邀请和友善，感谢福柯研讨班全体学生的兴趣和问题，以及文苑餐厅（Literaturhaus Restaurant）的工作人员（特别是奥利弗和弗朗兹），感谢他们的热忱、美食和美酒。</p>
<p class="bodytext">我的妻子阿纳斯塔西娅·弗里尔·古廷一直是我作品的最早、最好的读者。同时还要感谢杰里·布伦斯和托德·梅的建设性评论。感谢牛津大学出版社的玛莎·菲利翁对本项目的建议和支持。</p>
