<h1 class="chapter-one">致谢</h1>
<p class="bodytext">写一本书，哪怕这样一册短小的读本，也是个艰巨的任务。我要感谢妻子艾莉森和家人的帮助和支持，他们给了我写书所需要的时间和空间。还要感谢父母为支持我受教育所做的巨大投入，那往往意味着他们个人要做出极大的牺牲。</p>
