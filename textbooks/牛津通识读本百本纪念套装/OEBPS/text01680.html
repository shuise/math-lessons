<h1 class="chapter-one" id="CHP10">注释</h1>
<p class="noteContent">
<a id="jzyy_6_1" href="text01672.html#jz_1_6">[1]</a>
 “市政社会主义”运动追求“普遍的公共产权”，不仅教育和医疗脱离了市场，其他重要的工业和服务也是如此。它将煤气和水的供应收归国有，并且提供公共所有的城市交通。1890年颁布的法律给予市政议会建造房屋的权力，政府由此开始为公众提供住房，到1979年有1/3的英国家庭住在公共住房里。</p>
<p class="noteContent">
<a id="jzyy_40_1" href="text01675.html#jz_1_40">[2]</a>
 威塞克斯王朝的最后一位君主，1066年10月在与诺曼军队决战时战死。——编注</p>
