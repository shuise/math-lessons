<h1 class="chapter-one">注释</h1>
<p class="heiti">第二章 信任影像</p>
<p class="noteContent">
<a id="zhu1" href="text00107.html#zw1">[1]</a>
 “Wonder Ring”字母倒序排列后即为“Gnir Rednow”，这是一种回文游戏。——编注</p>
<p class="noteContent">
<a id="zhu2" href="text00107.html#zw2">[2]</a>
 美国著名的色情杂志，走的是高格调、中产娱乐消费路线。——编注</p>
<p class="heiti">第三章 金钱本色</p>
<p class="noteContent">
<a id="zhu3" href="text00108.html#zw3">[3]</a>
 原文为“Moviegoers”，特指上电影院观影的人。——编注</p>
<p class="noteContent">
<a id="zhu4" href="text00108.html#zw4">[4]</a>
 原文为“picture palace”，是电影院的旧式称呼，在本节中特指在20世纪10年代到40 年代兴起的一种装饰恢宏华丽的播放电影的剧院。——编注</p>
<p class="noteContent">
<a id="zhu5" href="text00108.html#zw5">[5]</a>
 《双虎屠龙》的英文名即为<span class="xieti">The Man Who Shot Liberty Valance</span>
 。——编注</p>
