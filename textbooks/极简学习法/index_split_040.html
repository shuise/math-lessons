<p id="filepos191848" class="calibre_9">第二节<br class="calibre3"/><span class="calibre4"> 解题型输出，如何刷题效果最佳</span></p><p class="calibre_10">解题型输出，是一种很常见的输出方式。尤其是在学生阶段，在考试中运用所学的知识把题目解出来，就是一个非常重要的学习目的。通过做题进行练习，对于学生来说是一种非常重要的学习方式。</p><p class="calibre_11">那到底怎么刷题效果最佳呢？关于这个问题，我与很多清华北大的学霸以及老师深度沟通过。在这一部分，我就专门为大家讲述这个问题，让大家真正明白刷题的根本目的是什么，也让大家知道如何科学高效地刷题。</p><div class="mbp_pagebreak" id="calibre_pb_40"></div>
