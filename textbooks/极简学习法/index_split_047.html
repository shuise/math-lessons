<p id="filepos226450" class="calibre_9">第四节<br class="calibre3"/><span class="calibre4"> 现实应用，把握“33原则”</span></p><p class="calibre_10">学习知识的最终目的，是用起来。你一定有过这样的感觉，那就是你自己明明已经学懂的知识，在真正使用时，会出现根本不会用或者用起来并不熟练的情况。</p><p class="calibre_11">那么，在这个部分，我将和你分享一个“33原则”，不仅能让你在学习知识后真正应用起来，还能让你做到举一反三，将知识应用到多个领域。</p><div class="mbp_pagebreak" id="calibre_pb_47"></div>
