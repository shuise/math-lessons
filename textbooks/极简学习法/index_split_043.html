<p id="filepos201601" class="calibre_9">第三节<br class="calibre3"/><span class="calibre4"> 考试输出，如何科学抢分</span></p><p class="calibre_10">对于应试学习，学习的直接目的是把考试的题目做出来。在考场上，把考题做出来拿下高分，就是一种非常常见的输出方式。</p><p class="calibre_11">在这一部分，我们就专门来讲，到底该如何在考试中科学抢分，如何做出更多的题目，考出更高的分数。</p><p class="calibre_11">虽然每种考试都有其特性，但既然都是考试，肯定存在共性。所以，在这一部分，我将教你在任何考试中都能拿下高分的通用大招。</p><div class="mbp_pagebreak" id="calibre_pb_43"></div>
