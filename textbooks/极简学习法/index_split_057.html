<p id="filepos255169" class="calibre_9">第二节<br class="calibre3"/><span class="calibre4"> 别迷恋自律，习惯其实更重要</span></p><p class="calibre_10">别迷恋自律，因为自律真的没有那么神奇，也没有那么可靠，而且大多数人都很难做到长期自律。</p><p class="calibre_11">这是我想告诉你的一个关于自律的观点。是不是会颠覆你以前的认知？</p><p class="calibre_11">在此之前，我想你一定听过很多类似的观点：</p><p class="calibre_11">人要自律，自律的人才能成功！</p><p class="calibre_11">成功的人，都是自律的人！</p><p class="calibre_11">你不成功，是因为你不自律！</p><p class="calibre_11">虽然我并不否认这些观点，但我想告诉你，我们每个人都可以做到自律，但也都无法做到长期自律。</p><div class="mbp_pagebreak" id="calibre_pb_57"></div>
