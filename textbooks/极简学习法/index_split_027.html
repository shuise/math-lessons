<p id="filepos130486" class="calibre_9">第二节<br class="calibre3"/><span class="calibre4"> 精准自查：请极度坦诚，三招揪出漏洞</span></p><p class="calibre_10">当我们解决了心态问题，现在就要开始具体的行动了。</p><p class="calibre_11">要完成深度消化，第一件事就是找到自己的问题，也就是找到自己还没有消化的部分。你一定有这样的经历，当你学习新知识时，其中有很多是比较简单的，你一学就懂了。但总有一些部分，你无法一下就学明白学透。而深度消化，就是要把你没有学明白学透的部分彻底弄懂弄透。</p><p class="calibre_11">那么，怎么找出那些我们没有搞懂的部分呢？主要分两个方面：第一个方面就是你要有对的心态，第二个方面就是你要有对的方法。</p><div class="mbp_pagebreak" id="calibre_pb_27"></div>
