<p class="calibre_15"><span class="calibre1">二、开干：来一个三秒的小仪式</span></p><p class="calibre_11">现在，自己默念1、2、3，或者说出来也可以。说完，你就马上开始你的学习，去做你应该做的事。这是给自己的一个三秒仪式。不要小看这个小小的仪式，它是帮你干掉拖延症的最重要的开始。因为，只要你开始了，一切就有了改善的可能。</p><p class="calibre_11">只要开始，你就不是在拖延了；只要开始行动了，就有可能做下去。</p><p class="calibre_11">你可能会说，这个小小的默念仪式，有这样神奇的效果吗？不信你可以试试。</p><div class="mbp_pagebreak" id="calibre_pb_62"></div>
