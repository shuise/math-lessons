  <h2 class="chapter-one" id="calibre_pb_0">第一幕</h2>

  <h3 class="chapter-two1" id="sigil_toc_id_1">第1章　从无到有</h3>

  <p class="yinwen">如果你想造船，不要召集人们去伐木，也不要给他们分配任务，只需告诉他们大海的广阔无垠。</p>

  <p class="bodytext-right">——安东尼·圣艾修伯里（Antoirle de Saint-Exupéry），《城堡》（Citadelle）</p>
