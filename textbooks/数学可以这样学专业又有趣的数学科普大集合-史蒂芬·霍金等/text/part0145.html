  <h3 class="chapter-two1">插曲3：回望未来</h3>

  <p class="yinwen">总有一天你会认为一切都结束了。</p>

  <p class="yinwen">其实那才是开始。</p>

  <p class="bodytext-right">——拉慕（Louis LAmour），《山上的孤独》（Lonely on the Mountain）</p>
