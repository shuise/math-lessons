<h1 id="isbn9787572231056_1_4" class="test_header_style">02　婴儿天生会计数</h1><p class="paragraph_style">刚出生的婴儿是否对算术有抽象的认识呢？这个问题似乎很荒谬。直觉告诉我们，婴儿是初始的生命体，除了学习能力，他们没有其他任何能力。但是，如果我们的研究假设是正确的，那就意味着人类天生具有理解数量的能力，这种能力通过进化传承下来，引导着人类学习数学。儿童在一岁半左右会进入语言大发展时期，一些心理学家称之为“词汇爆发期”，在此之前，这种原数模块（protonumerical module）便已准备就绪，它将会影响儿童的数词学习。因此，在生命的第一年，婴儿应该能够理解部分算术知识。</p><script src="../../math.js"></script></body>
