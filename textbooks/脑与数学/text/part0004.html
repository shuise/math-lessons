  <body class="calibre"><h1 id="pre3_3" class="test_header_style">测一测　你了解数感对人类的影响吗？</h1><p class="question_style">·　在某个城市的机场，标号为小数字的登机口向右侧延伸，标号为大数字的登机口向左侧延伸。很多旅客在这里会走错方向，这仅仅是因为他们对这个机场不够熟悉。你认为这种说法对吗？</p><p class="options_style">A．对</p><p class="options_style">B．不对</p><p class="question_style">·　小A出生在意大利，大学毕业后定居美国，在那里生活了20年，他能用流利的英语交谈和写作。在涉及心算时，你认为他会使用哪种语言？</p><p class="options_style">A．英语</p><p class="options_style">B．意大利语</p><p class="question_style">·　人类的大脑中有一个专门负责“数学思维”的特定的脑区，这是真的吗？</p><p class="options_style">A．真</p><p class="options_style">B．假</p><div class="img_style"><p class="img_desc_style">扫码鉴别正版图书</p><p class="img_desc_style">获取您的专属福利</p><img src="../images/00079.jpeg" class="div_img_2" alt=""/><p class="img_desc_style">扫码获取全部测试题及答案，了解数学思维是如何在人类大脑中进化的。</p></div><script src="../../math.js"></script></body>
