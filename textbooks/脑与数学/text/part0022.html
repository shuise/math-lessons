  <body class="calibre"><p class="paragraph_style">想要了解人类思维的真正意义，就必须将它看作是由不同感觉或不同存在组成的一个系统。这些感觉和存在通过因果关系联系在一起，并且相互生成、破坏、影响和改变……从这方面来看，把灵魂比作一个共和国或联邦最为恰当，其中的成员通过统治和服从的互惠关系联合在一起。</p><p class="person_mark_style">——大卫·休谟，《人性论》</p><script src="../../math.js"></script></body>
