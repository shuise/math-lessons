  <body class="calibre"><p class="paragraph_style">我观察到，当我们提到任意一个大数字，比如1 000，我们对它通常并没有恰当的认识，但是我们有能力凭借我们本身对十进位的足够认识来理解这个数字。</p><p class="person_mark_style">——大卫·休谟（David Hume），《人性论》（<i class="calibre4">A Treatise of Human Nature</i>）</p><script src="../../math.js"></script></body>
