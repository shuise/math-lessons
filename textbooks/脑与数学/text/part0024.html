  <body class="calibre"><p class="paragraph_style">在一张照片上，爱因斯坦躺在床上，他的头部密布着电线，这些电线用于在他“思考相对论”的同时把他的脑电波记录下来。</p><p class="person_mark_style">——罗兰·巴特（Roland Barthes），《神话修辞术》（<i class="calibre4">Mythologies</i>）</p><script src="../../math.js"></script></body>
