  <body class="calibre"><p class="paragraph_style">不朽的灵魂，经历了许多次重生，见证了这里和世界各地所有存在的事物，它已经学会了这些事物；无怪乎它能唤起关于德行的记忆，唤起关于所有事物的记忆。</p><p class="person_mark_style">——柏拉图，《美诺篇》（<i class="calibre4">Meno</i>）</p><script src="../../math.js"></script></body>
