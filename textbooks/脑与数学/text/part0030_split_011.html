<h2 class="second_level_style" id="isbn9787572231056_4_20_1_11">教室将成为下一个实验室</h2><p class="paragraph_style">正如戴维·普雷马克和安·普雷马克（Ann Premack）所说：“一个教育理论只能来源于对将要教育的心灵的理解。”<sup class="annotation_style"><a id="wzyy_1_327" href="part0032.html#wz_1_327">93</a></sup>事实上，目前我们对那些仍处于萌芽期的“小小数学家们”的思想拥有了一种精确的认识，对大脑中数学进程的认识也有了显著的进展。认知神经科学研究成果应用于教育已不再“遥不可及”<sup class="annotation_style"><a id="wzyy_1_328a" href="part0032.html#wz_1_328a">94</a></sup>。相反，许多概念与实证的研究方法已经具有可行性。创新性教学方案可以被引入教育，我们已经拥有用于研究这些教案对儿童大脑和思维影响的全部工具。</p><p class="paragraph_style">教室将成为我们的下一个实验室。</p><script src="../../math.js"></script></body>
