  <h1 class="center"><span class="xiao">第二章</span><br class="calibre3"/>
  学习驱动力：<br class="calibre3"/>
  从内而外爱上学习</h1>

  <div class="block1">
    <p class="noindent">我们都知道，学习是一场终身长跑，笑到最后的人才是真正的赢家。但是，在“胡萝卜加大棒”法则已失效的当下，如何才能焕发并保持我们的学习热情？就像火车要想飞驰离不了火车头一样，学习这场艰苦的旅行也离不开驱动力。学习动机和学习乐趣，就是学习驱动力最有效的两只轮子。</p>
  </div>
