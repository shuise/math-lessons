  <h1 class="center"><span class="xiao">第四章</span><br class="calibre3"/>
  学习创造力：<br class="calibre3"/>
  从被动学习到主动学习</h1>

  <div class="block1">
    <p class="noindent">你想要8块腹肌，补充一些蛋白质是有帮助的。但如果你只吃蛋白质而不去运动，恐怕就永远没有办法完成目标了。</p>
  </div>

  <div class="block1">
    <p class="noindent">学习也是如此。很多时候，单纯输入知识并不能使我们具备力量，这种力量必须通过输入和输出的循环交替才能得到锻炼。</p>
  </div>
