    <p class="right">——《礼记·学记》</p>
  </div>

  <div class="block1">
    <p class="noindent">人们的学习态度各有不同，有的人贪多求快，囫囵吞枣；有的人蜻蜓点水，浅尝辄止；有的人专找捷径，急于求成。</p>
