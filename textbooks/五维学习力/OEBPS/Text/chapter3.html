  <h1 class="center"><span class="xiao">第三章</span><br class="calibre3"/>
  学习策略力：<br class="calibre3"/>
  学习方法才是关键</h1>

  <div class="block1">
    <p class="noindent">你相信天才吗？或者说你觉得任何事情靠后天努力就可以完成吗？不论你支持哪个观点，我们都必须承认：我们中的大多数人都达不到天才的程度，努力是我们的不二选择，对学习而言尤其如此。但是，努力不只是意志力的较量，它更是一种具有策略性的活动。</p>
  </div>

  <div class="block1">
    <p class="noindent">那么，到底应该怎样努力学习？应该采用什么样的策略来投入自己的时间和精力？应该怎样有效启动、维持和优化对学习行为的投入？这些都是值得探讨的重要问题。</p>
  </div>
