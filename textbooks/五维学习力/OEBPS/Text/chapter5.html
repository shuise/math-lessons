  <h1 class="center"><span class="xiao">第五章</span><br class="calibre3"/>
  学习持久力：<br class="calibre3"/>
  解决5个常见的学习困扰</h1>

  <div class="block1">
    <p class="noindent">人对于自我价值的感觉有两种：一种是好的感觉，比如学习方向明确、兴趣强烈、效率高超，个体因此充满自信和幸福感；另一种是坏的感觉，比如学习时常半途而废、自制力差、习惯性拖延，个体因此觉得自己非常糟糕。</p>
  </div>

  <div class="block1">
    <p class="noindent">而人与人之间的差别，很多时候与如何面对糟糕的自我感觉相关。</p>
  </div>
