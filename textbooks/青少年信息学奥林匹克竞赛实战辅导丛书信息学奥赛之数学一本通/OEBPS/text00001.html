<p class="kindle-cn-para-center">
<span class="kindle-cn-bold">内容提要</span>
</p>
<p>数学是计算机程序设计的灵魂。利用数学方面的知识、数学分析的方法以及数学题解的技巧，可以使得程序设计变得轻松、美观、高效，而且往往能反映出问题的本质。在国内外各项程序设计比赛（比如，ACM、NOI）活动中，越来越多地用到各种复杂的数学知识，对选手的数学修养要求越来越高。编写本书的目的就在于给广大ACM队员、NOI选手以及编程爱好者，系统分析一些程序设计中常用的数学知识和数学方法。</p>
<p>本书的适用对象包括：中学信息学奥林匹克竞赛选手及辅导老师、大学ACM程序设计比赛选手及教练、高等院校计算机相关专业的师生、程序设计爱好者等。</p>
