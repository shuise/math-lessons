<blockquote width="0pt" align="left">
<font color="#000">不管怎么样，这是容易证明的。取一长方形，其边为n与</font>
 <font size="2">
<font color="#000">n+1</font>
</font>
 <font color="#000">，用波折线把它分</font>
</blockquote>
</blockquote>
<blockquote height="0pt">
<blockquote width="0pt" align="left">
<font color="#000">成两半，如图18a所表示的是</font>
 <font size="2">
<font color="#000">n=4</font>
</font>
 <font color="#000">情况。每一半都是“阶梯形”的，而其面积的</font>
</blockquote>
</blockquote>
<blockquote height="0pt">
<blockquote width="0pt" align="left">
<font color="#000">表达式为</font>
 <font size="2">
<font color="#000">1+2+</font>
</font>
 <font color="#000">…</font>
 <font size="2">
<font color="#000">+n</font>
</font>
 <font color="#000">；当</font>
 <font size="2">
<font color="#000">n=4</font>
</font>
 <font color="#000">，它是</font>
 <font size="2">
<font color="#000">1+2+3+4</font>
</font>
 <font color="#000">，见图</font>
 <font size="2">
<font color="#000">18b</font>
</font>
 <font color="#000">。现在整个面积是 n(n+1)，</font>
</blockquote>
</blockquote>
<blockquote height="0pt">
<blockquote width="0pt" align="left">
<font color="#000">而阶梯形面积仅是上述面积之一半；于是上述公式得证。</font>
</blockquote>
