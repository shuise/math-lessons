  <h1 class="bodycontent-first-title" id="calibre_pb_0">关于伊凡·莫斯科维奇</h1>

  <p class="bodycontent-text">伊凡·莫斯科维奇是一位生于南斯拉夫的机械工程师。他创立了拉斯基科技与天文博物馆。他还是许多消遣数学与谜题书籍的作者。</p>

  <p class="bodycontent-text">多年来，他发明了许多谜题、游戏与玩具，其中有100多种游戏都投入了商业生产。他的这些发明获奖无数，其原创性在世界各地赢得了赞誉。</p>
