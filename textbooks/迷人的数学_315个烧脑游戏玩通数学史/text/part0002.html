  <p class="bodycontent-text_yinwen">这本书是爱的结晶，我衷心将本书献给我亲爱的妻子安妮塔，感谢她无限的耐心、宝贵的意见与帮助。我要感谢我亲爱的女儿茜拉，感谢她带给我新的见解与创意。我要感谢我可爱的孙女艾米丽娅，她正在慢慢成长，踏上美好的人生旅程。我还要将此书献给那些热爱美感、谜题与数学的人。</p>

  <p class="bodycontent-text_yinwen">如果你总是做自己感兴趣的事情，那么至少有一个人会感到高兴。</p>

  <p class="bodycontent-text_right">——凯瑟琳・赫本</p>
