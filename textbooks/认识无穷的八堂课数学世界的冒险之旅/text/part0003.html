  <h1 class="p" id="calibre_pb_0"><a href="part0002.html#a1" class="pcalibre calibre3">内容提要</a></h1>

  <p class="ziti4">本书以数论和集合论两个数学理论为依据来展开介绍无穷这一概念。全书的形式为每一章讲一堂课，共8章，每一章都以幽默、轻快的笔触，以及最基础的数学符号来讲述与无穷相关的理论及悖论，展现了数学世界的精彩。在书中我们会遇到许多既熟悉又陌生的数学家、思想家及他们在数学之旅中的故事，如芝诺、毕达哥拉斯、伯特兰·罗素、艾米·诺特、欧几里得等；还介绍了相关的悖论和问题，如芝诺悖论、希尔伯特的旅馆悖论、阿基里斯与众神悖论、天堂与地狱悖论、罗斯-利特尔伍德悖论、伽利略悖论等。</p>

  <p class="ziti4">本书读起来轻松惬意，适合所有爱好数学的人阅读。</p>
