  <h1 class="p" id="calibre_pb_0"><a href="part0002.html#a2" class="pcalibre calibre3">致谢</a></h1>

  <p class="ziti4">在最前面，我要感谢伊坦·伊尔费尔德（Etan Ilfeld），他对我和我的作品充满信心。感谢我忠实的翻译琳达·耶基尔（Linda Yechiel）。我要特别感谢阿兰·德克尔（Alain Dekker）的不断鞭策，鼎力协助。衷心感谢集合论专家汤姆·本哈莫（Tom Benhamou）的精心修订。我还要感谢本书的项目经理斯拉夫·托多罗夫（Slav Todorov），并向为本书辛勤劳作的沃特金斯出版社的工作人员致谢。最后，也是很重要的，我要感谢我的经纪人维姬·萨特洛（Vicki Satlow）和齐夫·刘易斯（Ziv Lewis）。</p>
