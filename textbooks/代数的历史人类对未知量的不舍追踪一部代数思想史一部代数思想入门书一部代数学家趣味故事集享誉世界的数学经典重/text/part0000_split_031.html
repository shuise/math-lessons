<h1 id="nav_point_29" class="not-in-toc">作者简介</h1>
<p class="calibre1"><strong class="calibre2">约翰·德比希尔（John Derbyshire）</strong>出生于英国，是一位美国系统分析师、作家和评论家，曾学习过数学和语言学。他曾是美国《国家评论》的专栏作家，其写作题材非常广泛，著有《素数之恋》《梦见柯立芝》等多部作品。</p>
