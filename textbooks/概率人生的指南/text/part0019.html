<h1 class="prefacetitle-c" id="pos4_4">译后记</h1>
<p class="bodycontent">本书由雒自新（西安交通大学副教授）负责完成初稿，刘叶涛（南开大学教授）负责全书审校。任晓明（南开大学教授、中国逻辑学会副会长）为本书作序。本书得到陈波（北京大学教授、国际哲学学院院士）的大力推荐，其翻译出版工作得到上海人民出版社的大力支持，于力平老师对本书进行了专业细致的编辑。译校过程中，原作者还邀请相关学者协助阅读了译稿，提出了一些有价值的改进意见。南开大学逻辑学专业硕士生薛青青帮助收集整理了若干资料。谨此一并致谢！</p>
