  <h1 class="calibre1" id="calibre_pb_0">第五章 从文艺复兴到微积分的诞生</h1>

  <p class="kaiti6">我希望画家应当通晓全部自由艺术，但我首先希望他们精通几何学。</p>

  <p class="kaiti5">——莱昂·阿尔贝蒂</p>

  <p class="kaiti6">他几乎以神一般的思维，最先说明了行星的运动和图像，彗星的轨迹和大海的潮汐。</p>

  <p class="kaiti5">——牛顿墓志铭</p>
