  <h1 class="calibre1" id="calibre_pb_0">致谢</h1>

  <p class="calibre11">感谢圣马丁出版社每个为本书的出版做出努力的人，这其中包括迈克尔·霍姆勒、劳伦·雅布隆斯基。同时也感谢每个帮助我思考数学与科学之间关系的人，包括牛津大学知名教授阿德里安·穆尔。他之所以研究哲学，我之所以对数学和无穷大产生兴趣，都是因为受到了同一个人的启发——曼彻斯特文理学校的尼尔·谢尔登。</p>
