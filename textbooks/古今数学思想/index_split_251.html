<p id="filepos2364357" class="calibre_19"><span class="calibre1"><span class="bold">1．引言</span></span></p><p class="calibre_20">求解多项式方程这个代数的基本问题，继续占据着19世纪前期代数舞台的中心。这期间，哪些方程可用代数运算求解，这个重要问题由伽罗瓦明确而透彻地回答了。然而，他不仅创立了代数理论头等意义表达清楚的主体，而且引进了新概念，这些新概念被发展成其他有广泛应用的代数理论。特别地，在他和阿贝尔的著作中出现了群和域的概念。</p><div class="mbp_pagebreak" id="calibre_pb_251"></div>
