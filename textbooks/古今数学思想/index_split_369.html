<p id="filepos3591097" class="calibre_"><span class="calibre1"><span class="bold">第47章　发散级数</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">在这世纪初已认为要断然从严密数学中驱逐出去的那些级数，在这世纪末竟又重敲接纳之门，这确实是我们科学的一个奇怪的变迁。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">皮尔庞特（James Pierpont）</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_15">这级数是发散的；因此我们有可能用它来做些事情。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">亥维赛（Oliver Heaviside）</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_369"></div>
