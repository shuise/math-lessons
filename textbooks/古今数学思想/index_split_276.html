<p id="filepos2614861" class="calibre_"><span class="calibre1"><span class="bold">第34章　19世纪的数论</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">傅里叶确实有过这样的看法，认为数学的主要目的是公众的需要和对自然现象的解释；但是像他这样一个哲学家应当知道，科学的唯一目的是人类精神的光荣，而且应当知道，在这种观点之下，数［论］的问题和关于世界体系的问题具有同等价值。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">雅可比（Carl Gustav Jacob Jacobi）</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_276"></div>
