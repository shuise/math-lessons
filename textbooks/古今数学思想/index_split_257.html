<p id="filepos2435376" class="calibre_"><span class="calibre1"><span class="bold">第32章　四元数，向量和线性结合代数</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">哈密顿做了确实非常出色的工作，之后，四元数就诞生了；虽然美妙而富有创造性，但对于以任何方式接触过它们的那些人来说曾经是一个纯粹的邪念……向量是无用的幸存物或四元数的无价值的支流，对任何创造，从未有过最微细的应用。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">开尔文勋爵</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_257"></div>
