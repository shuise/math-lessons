<p id="filepos3676775" class="calibre_"><span class="calibre1"><span class="bold">第48章　张量分析和微分几何</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">于是，或者作为空间基础的客体必须形成一个离散的流形，或者我们必须从它的外部关系中，从作用于它上面的各约束力中，去寻找其度量的根据。这就把我引到另一门科学——物理学的领域，而我工作的目的不允许我今天进入那个领域。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">黎曼</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_374"></div>
