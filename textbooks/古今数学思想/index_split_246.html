<p id="filepos2325441" class="calibre_19"><span class="calibre1"><span class="bold">1．引言</span></span></p><p class="calibre_20">我们已经看到，变分法主要是由欧拉和拉格朗日在18世纪确立的。除各类数学和物理问题外，对它的研究有一个主导的动力，即最小作用原理，它在莫佩尔蒂、欧拉和拉格朗日手中已成了数学物理的主导原理。19世纪的人们继续做着最小作用方面的工作，而19世纪前半期对变分法最大的刺激就来自这方面。在物理方面，其兴趣来自力学特别是天文学的问题。</p><div class="mbp_pagebreak" id="calibre_pb_246"></div>
