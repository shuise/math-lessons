<p id="filepos2784618" class="calibre_"><span class="calibre1"><span class="bold">第36章　非欧几里得几何</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">……因为那似乎是对的，很多事物仿佛都有那么一个时期，届时它们就在很多地方同时被人们发现了，正如在春季看到紫罗兰处处开放一样。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">波尔约（Wolfgang Farkas Bolyai）</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_15">人们所推崇于数学真理的必然性，甚至归属于它的特殊的确定性，只是一种错觉。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">米尔（John Stuart Mill）</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_289"></div>
