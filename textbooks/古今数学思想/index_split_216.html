<p id="filepos1961942" class="calibre_19"><span class="calibre1"><span class="bold">1．引言</span></span></p><p class="calibre_20">从技术观点来看，19世纪最独特的创造是单复变函数的理论。这个科目时常被称为函数论，虽然这个简称隐含有更多的意思。这个新的数学分支统治了19世纪，几乎像微积分的直接扩展统治了18世纪那样。函数论，这一最丰饶的数学分支，曾被称为这个世纪的数学享受。它也曾被欢呼为抽象科学中最和谐的理论之一。</p><div class="mbp_pagebreak" id="calibre_pb_216"></div>
