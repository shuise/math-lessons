<p id="filepos100844" class="calibre_"><span class="calibre1"><span class="bold">第3章　古典希腊数学的产生</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">所以说数学就是这样一种东西：她提醒你有无形的灵魂，她赋予她所发现的真理以生命；她唤起心神，澄净智慧；她给我们的内心思想添辉；她涤尽我们有生以来的蒙昧与无知。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">普罗克洛斯（Proclus）</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_23"></div>
