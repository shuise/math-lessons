<p id="filepos583699" class="calibre_"><span class="calibre1"><span class="bold">第10章　欧洲中世纪时期</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">在大多数科学里，一代人要推倒另一代人所修筑的东西，一个人所树立的另一个人要加以摧毁。只有数学，每一代人都能在旧建筑上增添一层楼。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">汉克尔（Hermann Hankel）</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_80"></div>
