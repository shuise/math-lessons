<p id="filepos3904210" class="calibre_"><span class="calibre1"><span class="bold">第51章　数学基础</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">逻辑是不可战胜的，因为要反对逻辑还得使用逻辑。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">布特鲁（Pierre Boutroux）</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_15">我们知道，数学家对于逻辑不如逻辑学家对于数学那样关心。数学和逻辑是精确科学的两只眼睛：数学派闭上逻辑眼睛，逻辑派闭上数学眼睛，各自相信一只眼睛能比两只看得更好。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">德摩根</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_395"></div>
