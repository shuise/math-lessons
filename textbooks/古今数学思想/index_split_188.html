<p id="filepos1680585" class="calibre_19"><span class="calibre1"><span class="bold">1．引言</span></span></p><p class="calibre_20">物理问题的探索不可避免地要导致去寻求关于曲线和曲面的更多的知识，因为运动物体经过的路径都是曲线，而物体本身则是由曲面界住的三维体。早已热衷于坐标几何的方法和微积分的力量的数学家们曾经用这两个主要工具研究过几何问题。在已经建立起来的坐标几何领域以及由于把微积分应用到几何问题中去而创立的新领域——微分几何方面，在18世纪得到了令人难忘的结果。</p><div class="mbp_pagebreak" id="calibre_pb_188"></div>
