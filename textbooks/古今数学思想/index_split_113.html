<p id="filepos846416" class="calibre_"><span class="calibre1"><span class="bold">第14章　射影几何的肇始</span></span></p><blockquote class="calibre_14"><blockquote class="calibre_15">我坦率承认，我从未对物理或几何的学习或研究抱有兴趣，除非能通过它们获得有助于目前需要的某种知识……能服务于生活的幸福与方便，能有助于保持健康，有助于施展某种技艺……我看到好大一部分技艺扎根于几何，如建筑上的采石工艺，制作日规，特别是透视法。</blockquote></blockquote><blockquote class="calibre_16"><blockquote class="calibre_17">德萨格</blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_113"></div>
