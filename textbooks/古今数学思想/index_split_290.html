<p id="filepos2785476" class="calibre_19"><span class="calibre1"><span class="bold">1．引言</span></span></p><p class="calibre_20">在19世纪所有复杂的技术创造中间，最深刻的一个，非欧几里得几何学，在技术上是最简单的。这个创造引起数学的一些重要新分支，但它的最重要影响是迫使数学家们从根本上改变对数学的性质的理解，以及对它和物质世界的关系的理解，并引出关于数学基础的许多问题，这些问题在20世纪仍然进行着争论。以下将看到，非欧几里得几何是在欧几里得几何领域中一系列长期努力所达到的顶点。这个工作到19世纪早期就成熟了，正是射影几何也在恢复和发展的同一年代，然而这两个领域在当时彼此并无关联。</p><div class="mbp_pagebreak" id="calibre_pb_290"></div>
