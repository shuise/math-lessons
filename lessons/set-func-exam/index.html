<style>

.tip { text-align: center; color: #888; margin-bottom: 24px; }

.question-card .explain.show { display: block; }
.question-card .explain.ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
.question-card .explain.fail { background: #fbe9e7; border-left: 4px solid #f44336; }

}
.reset-btn:hover { background: #e3f2fd; }
.section-header { margin: 28px 0 12px; color: #2c3e50; font-size: 1.2em; border-left: 4px solid #1a73e8; padding-left: 12px; }

// ============================================================
// 渲染与交互
// ============================================================
var answered = [];

function render() {
  var html = "";
  // 题型分组标题
  html += '<div class="section-header">一、选择题（每题 5 分）</div>';
  for (var i = 0; i < 10; i++) { html += renderOne(i); }
  html += '<div class="section-header">二、判断题（每题 5 分）</div>';
  for (var i = 10; i < 20; i++) { html += renderOne(i); }
  html += '<div class="section-header">三、填空题（每题 6 分）</div>';
  for (var i = 20; i < 30; i++) { html += renderOne(i); }
  html += '<div class="section-header">四、推导证明题（每题 4 分）</div>';
  for (var i = 30; i < 40; i++) { html += renderOne(i); }
  document.getElementById("quiz-container").innerHTML = html;
  answered = new Array(questions.length).fill(-1);
}

function renderOne(i) {
  var q = questions[i];
  var num = i + 1;
  var tagHtml = "";
  var diffHtml = diffLabels[q.diff] || "";
  if (q.type === "choice") tagHtml = '<span class="q-tag choice">选择</span>';
  else if (q.type === "tf") tagHtml = '<span class="q-tag tf">判断</span>';
  else if (q.type === "fill") tagHtml = '<span class="q-tag fill">填空</span>';
  else if (q.type === "proof") tagHtml = '<span class="q-tag proof">证明</span>';

  var cardId = 'q' + i;
  var html = '<div class="question-card" id="' + cardId + '">';
  html += '<div class="q-title">' + tagHtml + ' ' + num + '. ' + q.question + ' ' + diffHtml + '</div>';

  if (q.type === "choice" || q.type === "tf") {
    html += '<div class="options">';
    if (q.type === "choice") {
      var letter = ["A", "B", "C", "D"];
      for (var j = 0; j < q.opts.length; j++) {
        html += '<div class="opt" onclick="selectOpt(' + i + ',' + j + ')">' + letter[j] + '. ' + q.opts[j] + '</div>';
      }
    } else {
      html += '<div class="opt" onclick="selectOpt(' + i + ',0)">\u221a 正确</div>';
      html += '<div class="opt" onclick="selectOpt(' + i + ',1)">\u00d7 错误</div>';
    }
    html += '</div>';
  } else if (q.type === "fill") {
    html += '<div class="fill-area">';
    html += '<input class="fill-input" id="fill' + i + '" type="text" placeholder="请输入答案...">';
    html += '<button class="btn-check" id="btn' + i + '" onclick="checkFill(' + i + ')">确认</button>';
    html += '</div>';
  } else if (q.type === "proof") {
    html += '<div class="proof-area">';
    html += '<textarea class="proof-textarea" id="proof' + i + '" rows="4" placeholder="请在此输入你的推导过程..."></textarea>';
    html += '<div>';
    html += '<button class="btn-check" id="btn' + i + '" onclick="checkProof(' + i + ')">提交</button>';
    html += '<button class="btn-show-answer" onclick="toggleAnswer(' + i + ')">\u25bc 查看参考答案</button>';
    html += '</div>';
    html += '<div class="step-area" id="step' + i + '" style="display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:#f8f9fa;border-left:4px solid #1a73e8;line-height:1.8;font-size:0.93em;">';
    if (q.steps) {
      for (var k = 0; k < q.steps.length; k++) {
        if (q.steps[k] === "") {
          html += '<br>';
        } else {
          html += '<div style="margin:4px 0;padding-left:12px;border-left:3px solid #bbb;">' + q.steps[k] + '</div>';
        }
      }
    }
    html += '<div style="margin-top:6px;font-weight:bold;color:#2c3e50;">答案：' + q.answer + '</div>';
    html += '</div>';
    html += '</div>';
  }

  html += '<div class="explain" id="exp' + i + '"></div>';
  html += '</div>';
  return html;
}

// 选择/判断
function selectOpt(qi, oi) {
  if (answered[qi] !== -1) return;
  answered[qi] = oi;
  var q = questions[qi];
  var isCorrect = (q.type === "tf") ? ((oi === 0 && q.answer) || (oi === 1 && !q.answer)) : (oi === q.answer);

  var card = document.getElementById("q" + qi);
  var opts = card.querySelectorAll(".opt");
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add("disabled");
  }

  if (q.type === "choice") {
    opts[q.answer].classList.add("correct-opt");
    if (!isCorrect) opts[oi].classList.add("wrong-opt");
    else opts[oi].classList.add("selected");
  } else {
    // tf: 正确答案高亮
    var correctIdx = q.answer ? 0 : 1;
    opts[correctIdx].classList.add("correct-opt");
    if (!isCorrect) opts[oi].classList.add("wrong-opt");
    else opts[oi].classList.add("selected");
  }

  card.classList.add(isCorrect ? "correct" : "wrong");

  var expDiv = document.getElementById("exp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 " : "\u2717 ") + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// 填空
function checkFill(qi) {
  if (answered[qi] !== -1) return;
  var input = document.getElementById("fill" + qi);
  var q = questions[qi];
  var userAnswer = input.value.trim();
  // 负号归一化：将 Unicode minus (U+2212) 替换为 ASCII hyphen
  var normalize = function(s) { return s.replace(/\u2212/g, "-"); };
  var normUser = normalize(userAnswer);
  var normAnswer = normalize(q.answer);
  var isCorrect = (userAnswer === q.answer || userAnswer.indexOf(q.answer) !== -1);
  isCorrect = isCorrect || (normUser === normAnswer || normUser.indexOf(normAnswer) !== -1);
  answered[qi] = isCorrect ? 1 : 0;
  input.disabled = true;
  document.getElementById("btn" + qi).disabled = true;
  input.classList.add(isCorrect ? "correct-input" : "wrong-input");

  var card = document.getElementById("q" + qi);
  card.classList.add(isCorrect ? "correct" : "wrong");

  var expDiv = document.getElementById("exp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 " : "\u2717 ") + (isCorrect ? "正确！" : "正确答案是：" + q.answer + "。") + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// 推导证明
function checkProof(qi) {
  if (answered[qi] !== -1) return;
  var input = document.getElementById("proof" + qi);
  var q = questions[qi];
  var userAnswer = input.value.trim();
  var isCorrect = false;
  if (q.keywords && q.keywords.length > 0) {
    var matchCount = 0;
    for (var k = 0; k < q.keywords.length; k++) {
      if (userAnswer.indexOf(q.keywords[k]) !== -1) {
        matchCount++;
      }
    }
    if (q.keywordMode === "or") {
      isCorrect = (matchCount >= 1);
    } else {
      isCorrect = (matchCount >= q.keywords.length);
    }
  }
  answered[qi] = isCorrect ? 1 : 0;
  input.disabled = true;
  document.getElementById("btn" + qi).disabled = true;
  input.classList.add(isCorrect ? "correct-input" : "wrong-input");

  var card = document.getElementById("q" + qi);
  card.classList.add(isCorrect ? "correct" : "wrong");

  // 展开答案区域
  var stepArea = document.getElementById("step" + qi);
  if (stepArea) stepArea.style.display = "block";

  var expDiv = document.getElementById("exp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 " : "\u2717 ") + (isCorrect ? "你的推导方向正确！" : "参考答案见下方。") + (q.explain || "");
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

function toggleAnswer(qi) {
  var stepArea = document.getElementById("step" + qi);
  if (stepArea) {
    stepArea.style.display = stepArea.style.display === "none" ? "block" : "none";
  }
}

// 计分
function updateScore() {
  var total = 0;
  // 选择题 1~10 (每题5分，共 50 分)
  for (var i = 0; i < 10; i++) {
    if (answered[i] !== -1) {
      var q = questions[i];
      if ((q.type === "choice" && answered[i] === q.answer) ||
          (q.type === "tf" && ((answered[i] === 0 && q.answer) || (answered[i] === 1 && !q.answer)))) {
        total += 5;
      }
    }
  }
  // 判断题 11~20 (每题5分，共 50 分)
  for (var i = 10; i < 20; i++) {
    if (answered[i] !== -1) {
      var q = questions[i];
      if ((answered[i] === 0 && q.answer) || (answered[i] === 1 && !q.answer)) {
        total += 5;
      }
    }
  }
  // 填空题 21~30 (每题6分，共 60 分)
  for (var i = 20; i < 30; i++) {
    if (answered[i] === 1) total += 6;
  }
  // 推导证明 31~40 (每题4分，共 40 分)
  for (var i = 30; i < 40; i++) {
    if (answered[i] === 1) total += 4;
  }
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a" + total + " / 200";
}

function resetExam() {
  answered = new Array(questions.length).fill(-1);
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a0 / 200";
  for (var i = 0; i < questions.length; i++) {
    var card = document.getElementById("q" + i);
    if (card) {
      card.className = "question-card";
      var opts = card.querySelectorAll(".opt");
      for (var j = 0; j < opts.length; j++) opts[j].className = "opt";
      var expDiv = document.getElementById("exp" + i);
      if (expDiv) expDiv.className = "explain";
    }
    var fillInput = document.getElementById("fill" + i);
    if (fillInput) {
      fillInput.disabled = false;
      fillInput.value = "";
      fillInput.className = "fill-input";
      var btn = document.getElementById("btn" + i);
      if (btn) btn.disabled = false;
    }
    var proofInput = document.getElementById("proof" + i);
    if (proofInput) {
      proofInput.disabled = false;
      proofInput.value = "";
      proofInput.className = "proof-textarea";
      var btn2 = document.getElementById("btn" + i);
      if (btn2) btn2.disabled = false;
      var stepArea = document.getElementById("step" + i);
      if (stepArea) stepArea.style.display = "none";
    }
  }
}

render();
</script>
