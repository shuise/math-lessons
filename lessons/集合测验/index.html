    explain: "\u2205 \u662f\u7a7a\u96c6\uff0c\u91cc\u9762\u6ca1\u6709\u4efb\u4f55\u5143\u7d20\uff1b{0} \u91cc\u9762\u6709\u4e00\u4e2a\u5143\u7d20 0\u3002\u4e00\u4e2a\u662f\u7a7a\u888b\u5b50\uff0c\u4e00\u4e2a\u662f\u888b\u5b50\u91cc\u88c5\u4e86 0\uff0c\u5b8c\u5168\u4e0d\u540c\uff01"
  },
  {
    type: "tf",
    question: "\u82e5 A \u2286 B \u4e14 B \u2286 C\uff0c\u5219 A \u2286 C",
    answer: true,
    explain: "\u8fd9\u662f\u5b50\u96c6\u7684\u4f20\u9012\u6027\u2014\u2014\u5982\u679c A \u7684\u6240\u6709\u5143\u7d20\u90fd\u5728 B \u4e2d\uff0cB \u7684\u6240\u6709\u5143\u7d20\u90fd\u5728 C \u4e2d\uff0c\u90a3\u4e48 A \u7684\u6240\u6709\u5143\u7d20\u81ea\u7136\u4e5f\u5728 C \u4e2d\u3002"
  },
  {
    type: "tf",
    question: "{\u2205} \u662f\u7a7a\u96c6",
    answer: false,
    explain: "{\u2205} \u5305\u542b\u4e00\u4e2a\u5143\u7d20\u2014\u2014\u8fd9\u4e2a\u5143\u7d20\u5c31\u662f\u7a7a\u96c6\u672c\u8eab\u3002\u6240\u4ee5 {\u2205} \u4e0d\u662f\u7a7a\u96c6\uff0c\u5b83\u6709 1 \u4e2a\u5143\u7d20\uff01"
  },
  {
    type: "tf",
    question: "\u96c6\u5408 {x | x\u00b2 = 4} \u4e0e\u96c6\u5408 {\u22122, 2} \u76f8\u7b49",
    answer: true,
    explain: "\u65b9\u7a0b x\u00b2 = 4 \u7684\u89e3\u662f x = 2 \u548c x = \u22122\uff0c\u6240\u4ee5 {x | x\u00b2 = 4} = {\u22122, 2}\u3002\u63cf\u8ff0\u6cd5\u548c\u5217\u4e3e\u6cd5\u8868\u793a\u7684\u662f\u540c\u4e00\u4e2a\u96c6\u5408\uff0c\u5b8c\u5168\u76f8\u7b49\u3002"
  },
  {
    type: "tf",
    question: "\u82e5 A \u2229 B = \u2205\uff0c\u5219 A \u548c B \u6ca1\u6709\u516c\u5171\u5143\u7d20",
    answer: true,
    explain: "\u2229 \u8868\u793a\u4ea4\u96c6\uff0c\u5373\u516c\u5171\u5143\u7d20\u7684\u96c6\u5408\u3002A \u2229 B = \u2205 \u610f\u5473\u7740 A \u548c B \u7684\u516c\u5171\u5143\u7d20\u6784\u6210\u7a7a\u96c6\uff0c\u4e5f\u5c31\u662f\u6ca1\u6709\u4efb\u4f55\u516c\u5171\u5143\u7d20\u3002\u6570\u5b66\u4e0a\u79f0\u8fd9\u6837\u7684\u4e24\u4e2a\u96c6\u5408\u4e3a\u4e0d\u76f8\u4ea4\u3002"
  }
];

function render() {
  var container = document.getElementById("quiz-container");
  var html = "";
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    var tag = q.type === "fill" ? "\u586b\u7a7a\u9898" : (q.type === "choice" ? "\u9009\u62e9\u9898" : "\u5224\u65ad\u9898");
    var tagCls = q.type === "fill" ? "fill" : (q.type === "choice" ? "choice" : "tf");
    var letter = ["A", "B", "C", "D"];

    html += '<div class="quiz-question" id="q' + i + '">';
    html += '<div class="q-title"><span class="q-tag ' + tagCls + '">' + tag + '</span> ' + (i+1) + '. ' + q.question + '</div>';
    html += '<div class="options">';

    if (q.type === "fill") {
      html += '<div class="fill-area">';
      html += '<input type="text" class="fill-input" id="fill' + i + '" placeholder="\u8bf7\u8f93\u5165\u7b54\u6848" onkeydown="if(event.key===\'Enter\')checkFill(' + i + ')">';
      html += '<button class="btn-check" onclick="checkFill(' + i + ')">\u786e\u8ba4</button>';
      html += '</div>';
    } else if (q.type === "choice") {
      for (var j = 0; j < q.opts.length; j++) {
        html += '<div class="opt" onclick="selectOpt(' + i + ',' + j + ')">' + letter[j] + '. ' + q.opts[j] + '</div>';
      }
    } else {
      html += '<div class="opt" onclick="selectOpt(' + i + ',0)">\u2713 \u6b63\u786e</div>';
      html += '<div class="opt" onclick="selectOpt(' + i + ',1)">\u2717 \u9519\u8bef</div>';
    }

    html += '</div>';
    html += '<div class="explain" id="exp' + i + '"></div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function selectOpt(qIdx, chosen) {
  var q = questions[qIdx];
  var parent = document.getElementById("q" + qIdx);
  var opts = parent.getElementsByClassName("opt");
  var expDiv = document.getElementById("exp" + qIdx);

  // \u5982\u679c\u5df2\u7ecf\u56de\u7b54\u8fc7\uff0c\u5ffd\u7565\u70b9\u51fb
  if (opts[0].classList.contains("disabled")) return;

  // \u7981\u7528\u6240\u6709\u9009\u9879
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add("disabled");
  }

  // \u9ad8\u4eae\u9009\u4e2d\u7684
  opts[chosen].classList.add("selected");

  // \u5224\u65ad\u5bf9\u9519
  var correctIdx;
  if (q.type === "choice") {
    correctIdx = q.answer;
  } else {
    correctIdx = q.answer === true ? 0 : 1;
  }

  var isCorrect = chosen === correctIdx;

  // \u6807\u8bb0\u6b63\u786e\u9009\u9879
  opts[correctIdx].classList.add("correct-opt");
  if (!isCorrect) {
    opts[chosen].classList.add("wrong-opt");
  }

  // \u663e\u793a\u89e3\u6790
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");
  expDiv.innerHTML = (isCorrect ? "\u2705 \u6b63\u786e\uff01" : "\u274c \u9519\u8bef\u3002") + " " + q.explain;

  // \u9ad8\u4eae\u9898\u76ee\u8fb9\u6846
  parent.classList.add(isCorrect ? "correct" : "wrong");

  // \u66f4\u65b0\u5f97\u5206
  updateScore();
}

function checkFill(qIdx) {
  var q = questions[qIdx];
  var input = document.getElementById("fill" + qIdx);
  var parent = document.getElementById("q" + qIdx);
  var expDiv = document.getElementById("exp" + qIdx);
  var checkBtn = parent.querySelector(".btn-check");

  if (input.disabled) return;

  var userAnswer = input.value.trim();
  var isCorrect = userAnswer.toLowerCase() === q.answer.toLowerCase();

  input.disabled = true;
  checkBtn.disabled = true;

  input.classList.add(isCorrect ? "correct-input" : "wrong-input");

  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");
  expDiv.innerHTML = (isCorrect ? "\u2705 \u6b63\u786e\uff01" : "\u274c \u9519\u8bef\u3002\u6b63\u786e\u7b54\u6848\uff1a" + q.answer) + " " + q.explain;

  parent.classList.add(isCorrect ? "correct" : "wrong");
  updateScore();
}

function updateScore() {
  var correct = 0;
  for (var i = 0; i < questions.length; i++) {
    var parent = document.getElementById("q" + i);
    if (parent.classList.contains("correct")) correct++;
  }
  var score = correct * 4;
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a" + score + " / 100";
}

function resetQuiz() {
  for (var i = 0; i < questions.length; i++) {
    var parent = document.getElementById("q" + i);
    parent.className = "quiz-question";
    var opts = parent.getElementsByClassName("opt");
    for (var j = 0; j < opts.length; j++) {
      opts[j].className = "opt";
    }
    var exp = document.getElementById("exp" + i);
    exp.className = "explain";
    exp.innerHTML = "";
    // \u91cd\u7f6e\u586b\u7a7a\u9898\u8f93\u5165\u6846
    var fillInput = document.getElementById("fill" + i);
    if (fillInput) {
      fillInput.value = "";
      fillInput.disabled = false;
      fillInput.className = "fill-input";
    }
    var checkBtn = parent.querySelector(".btn-check");
    if (checkBtn) {
      checkBtn.disabled = false;
    }
  }
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a0 / 100";
}

document.getElementById("resetBtn").onclick = resetQuiz;

render();
</script>
</body>
</html>
