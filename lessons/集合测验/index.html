<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集合基础测验</title>
<link rel="stylesheet" href="../style.css">
<style>
.quiz-question {
  background: #fff;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  padding: 18px 22px;
  margin: 16px 0;
  transition: all 0.2s;
}
.quiz-question.correct {
  border-color: #4caf50;
  background: #f1f8e9;
}
.quiz-question.wrong {
  border-color: #f44336;
  background: #fce4ec;
}
.quiz-question .q-title {
  font-weight: bold;
  font-size: 1.05em;
  margin-bottom: 10px;
  color: #2c3e50;
}
.quiz-question .q-title .q-tag {
  display: inline-block;
  padding: 1px 10px;
  border-radius: 12px;
  font-size: 0.75em;
  margin-right: 8px;
  color: #fff;
}
.q-tag.choice { background: #1a73e8; }
.q-tag.tf { background: #e67e22; }
.quiz-question .options { display: flex; flex-direction: column; gap: 8px; }
.quiz-question .opt {
  padding: 8px 14px;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  background: #fafafa;
  user-select: none;
}
.quiz-question .opt:hover { background: #e3f2fd; border-color: #90caf9; }
.quiz-question .opt.selected { border-color: #1a73e8; background: #bbdefb; font-weight: bold; }
.quiz-question .opt.correct-opt { border-color: #4caf50; background: #c8e6c9; font-weight: bold; }
.quiz-question .opt.wrong-opt { border-color: #f44336; background: #ffcdd2; }
.quiz-question .opt.disabled { pointer-events: none; opacity: 0.7; }
.quiz-question .explain {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.93em;
  display: none;
}
.quiz-question .explain.show { display: block; }
.quiz-question .explain.ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
.quiz-question .explain.fail { background: #fbe9e7; border-left: 4px solid #f44336; }
.quiz-footer { text-align: center; margin: 24px 0; }
.quiz-footer .score-box {
  display: inline-block;
  background: #1a73e8;
  color: #fff;
  padding: 12px 32px;
  border-radius: 30px;
  font-size: 1.2em;
  font-weight: bold;
}
.quiz-footer .btn-reset {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 28px;
  border: 2px solid #1a73e8;
  color: #1a73e8;
  border-radius: 20px;
  background: #fff;
  cursor: pointer;
  font-size: 1em;
  transition: 0.15s;
}
.quiz-footer .btn-reset:hover { background: #1a73e8; color: #fff; }
sup, sub { font-size: 0.75em; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回课程列表</a>
<article>
<h1>📐 集合基础测验</h1>
<p style="color:#666;">考试时间：20 分钟 &nbsp;|&nbsp; 题型：选择题 + 判断题 &nbsp;|&nbsp; 共 20 题，每题 5 分</p>
<p style="font-size:0.93em; color:#888;">点击选项提交答案，系统自动判分并给出解析。</p>

<div id="quiz-container"></div>

<div class="quiz-footer">
  <div class="score-box" id="scoreDisplay">得分：0 / 100</div>
  <br>
  <button class="btn-reset" onclick="resetQuiz()">🔄 重新答题</button>
</div>
</article>

<script>
const questions = [
// ===== 选择题 =====
{
  type: "choice",
  question: "下列对象中，能构成集合的是（  ）",
  options: ["某班所有高个子的同学", "接近 0 的数", "方程 x²−1=0 的实数解", "所有好看的电影"],
  answer: 2,
  explain: "集合的元素必须具有确定性——元素要么属于要么不属于，不能模棱两可。"高个子""接近""好看"都不确定，只有方程的解是确定的。"
},
{
  type: "choice",
  question: "下列关系中，正确的是（  ）",
  options: ["0 ∈ ∅", "π ∈ Q", "√2 ∈ R", "−1 ∈ N"],
  answer: 2,
  explain: "∅ 是空集，没有任何元素，所以 0 ∉ ∅。Q 是有理数集，π 是无理数，π ∉ Q。R 是实数集，√2 是实数，所以 √2 ∈ R 正确。N 是自然数集，−1 不是自然数。"
},
{
  type: "choice",
  question: "集合 {x ∈ N | x < 4} 用列举法表示为（  ）",
  options: ["{1, 2, 3}", "{0, 1, 2, 3}", "{−1, 0, 1, 2, 3}", "∅"],
  answer: 1,
  explain: "N 是自然数集，包含 0, 1, 2, 3, …。x < 4 的自然数有 0, 1, 2, 3，所以用列举法表示为 {0, 1, 2, 3}。注意：自然数集包含 0！"
},
{
  type: "choice",
  question: "已知 A = {1, 2, 3}，B = {1, 2}，则下列关系正确的是（  ）",
  options: ["A ⊆ B", "B ⊆ A", "A ∈ B", "B ∈ A"],
  answer: 1,
  explain: "B 的每个元素（1 和 2）都在 A 中，所以 B 是 A 的子集，B ⊆ A。注意集合之间用 ⊆、= 等符号，不用 ∈（∈ 是元素和集合的关系）。"
},
{
  type: "choice",
  question: "设集合 A = {x | x² − 3x + 2 = 0}，则 A =（  ）",
  options: ["{1, 2}", "{−1, −2}", "∅", "{3}"],
  answer: 0,
  explain: "解方程 x² − 3x + 2 = 0，因式分解得 (x−1)(x−2) = 0，解得 x = 1 或 x = 2。所以 A = {1, 2}。"
},
{
  type: "choice",
  question: "集合 A = {a, b, c} 的子集个数是（  ）",
  options: ["3", "6", "7", "8"],
  answer: 3,
  explain: "n 个元素的集合，子集个数为 2ⁿ。A 有 3 个元素，子集个数 = 2³ = 8。包括：∅、{a}、{b}、{c}、{a,b}、{a,c}、{b,c}、{a,b,c}。"
},
{
  type: "choice",
  question: "已知全集 U = {1, 2, 3, 4, 5}，A = {1, 3, 5}，则 ∁<sub>U</sub>A =（  ）",
  options: ["{2, 4}", "{1, 3, 5}", "∅", "U"],
  answer: 0,
  explain: "补集是指全集中不在 A 内的所有元素。U 中去掉 A 的 1, 3, 5，剩下 2 和 4，所以 ∁<sub>U</sub>A = {2, 4}。"
},
{
  type: "choice",
  question: "已知 A = {1, 2, 3}，B = {2, 3, 4}，则 A ∩ B =（  ）",
  options: ["{1, 2, 3, 4}", "{2, 3}", "{1, 4}", "∅"],
  answer: 1,
  explain: "交集 ∩ 是取两个集合的公共元素。A 和 B 共有的元素是 2 和 3，所以 A ∩ B = {2, 3}。"
},
{
  type: "choice",
  question: "已知 A = {1, 2, 3}，B = {2, 3, 4}，则 A ∪ B =（  ）",
  options: ["{2, 3}", "{1, 2, 3, 4}", "{1, 4}", "∅"],
  answer: 1,
  explain: "并集 ∪ 是取两个集合的"总和"——所有元素合在一起，重复的只写一次。A ∪ B = {1, 2, 3, 4}。"
},
{
  type: "choice",
  question: "设 A = {x | x > 2}，B = {x | x < 5}，则 A ∩ B =（  ）",
  options: ["∅", "{x | x > 2}", "{x | x < 5}", "{x | 2 < x < 5}"],
  answer: 3,
  explain: "A ∩ B 既要满足 x > 2，又要满足 x < 5，所以是 {x | 2 < x < 5}。你可以画数轴帮助理解——在数轴上标出两个范围，重叠的部分就是交集。"
},
{
  type: "choice",
  question: "下列集合中，是空集的是（  ）",
  options: ["{0}", "{x | x² + 1 = 0, x ∈ R}", "{∅}", "{x | x = 0}"],
  answer: 1,
  explain: "方程 x² + 1 = 0 在实数范围内无解（x² = −1 在实数中不可能），所以 {x | x² + 1 = 0, x ∈ R} = ∅。注意 {0} 和 {∅} 都不是空集——它们各有一个元素！"
},
{
  type: "choice",
  question: "已知集合 A = {1, 2}，B = {2, 1}，则 A 与 B 的关系是（  ）",
  options: ["A ⊂ B", "B ⊂ A", "A = B", "A ≠ B"],
  answer: 2,
  explain: "集合的元素是无序的。{1, 2} 和 {2, 1} 的元素完全相同，所以 A = B。"
},
{
  type: "choice",
  question: "集合 A = {x | x = 2n, n ∈ Z} 表示的是（  ）",
  options: ["所有奇数", "所有偶数", "所有自然数", "所有整数"],
  answer: 1,
  explain: "当 n 取所有整数时，x = 2n 就是所有 2 的倍数——也就是所有偶数。符号说明：Z 是整数集，包括：…, −3, −2, −1, 0, 1, 2, 3, …"
},
{
  type: "choice",
  question: "设全集 U = {x | x ≤ 5, x ∈ N}，A = {0, 2, 4}，则 ∁<sub>U</sub>A =（  ）",
  options: ["{1, 3, 5}", "{0, 2, 4}", "∅", "U"],
  answer: 0,
  explain: "U = {0, 1, 2, 3, 4, 5}，去掉 A = {0, 2, 4}，剩下的就是 {1, 3, 5}。"
},
{
  type: "choice",
  question: "已知 A = {1, 2, 3, 4}，B = {2, 4}，A ∩ ∁<sub>U</sub>B（U = A）等于（  ）",
  options: ["{1, 3}", "{1, 2, 3, 4}", "{2, 4}", "∅"],
  answer: 0,
  explain: "U = A = {1, 2, 3, 4}，则 ∁<sub>U</sub>B = {1, 3}。A ∩ {1, 3} = {1, 3}。"
},
// ===== 判断题 =====
{
  type: "tf",
  question: "∅ = {0}",
  answer: false,
  explain: "∅ 是空集，里面没有任何元素；{0} 里面有一个元素 0。一个是空袋子，一个是袋子里装了 0，完全不同！"
},
{
  type: "tf",
  question: "若 A ⊆ B 且 B ⊆ C，则 A ⊆ C",
  answer: true,
  explain: "这是子集的传递性——如果 A 的所有元素都在 B 中，B 的所有元素都在 C 中，那么 A 的所有元素自然也在 C 中。这就像排队：你在第二个人的前面，第二个人在第三个人的前面，那你一定在第三个人的前面。"
},
{
  type: "tf",
  question: "{∅} 是空集",
  answer: false,
  explain: "{∅} 包含一个元素——这个元素就是空集本身。所以 {∅} 不是空集，它有 1 个元素！"
},
{
  type: "tf",
  question: "集合 {x | x² = 4} 与集合 {−2, 2} 相等",
  answer: true,
  explain: "方程 x² = 4 的解是 x = 2 和 x = −2，所以 {x | x² = 4} = {−2, 2}。描述法和列举法表示的是同一个集合，完全相等。"
},
{
  type: "tf",
  question: "若 A ∩ B = ∅，则 A 和 B 没有公共元素",
  answer: true,
  explain: "∩ 表示交集，即公共元素的集合。A ∩ B = ∅ 意味着 A 和 B 的公共元素构成空集，也就是没有任何公共元素。数学上称这样的两个集合为"不相交"。"
}
];

// render
const container = document.getElementById("quiz-container");
questions.forEach((q, idx) => {
  const div = document.createElement("div");
  div.className = "quiz-question";
  div.id = "q" + idx;

  const tag = q.type === "choice" ? "选择题" : "判断题";
  const tagCls = q.type === "choice" ? "choice" : "tf";

  let html = `<div class="q-title"><span class="q-tag ${tagCls}">${tag}</span> ${idx+1}. ${q.question}</div><div class="options">`;

  if (q.type === "choice") {
    const labels = ["A", "B", "C", "D"];
    q.options.forEach((opt, oi) => {
      html += `<div class="opt" data-idx="${idx}" data-opt="${oi}" onclick="selectOpt(${idx}, ${oi})">${labels[oi]}. ${opt}</div>`;
    });
  } else {
    html += `<div class="opt" data-idx="${idx}" data-opt="0" onclick="selectOpt(${idx}, 0)">✓ 正确</div>`;
    html += `<div class="opt" data-idx="${idx}" data-opt="1" onclick="selectOpt(${idx}, 1)">✗ 错误</div>`;
  }

  html += `</div><div class="explain" id="exp${idx}"></div></div>`;
  div.innerHTML = html;
  container.appendChild(div);
});

function selectOpt(qIdx, chosen) {
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#q${qIdx} .opt`);
  const expDiv = document.getElementById("exp" + qIdx);
  const parent = document.getElementById("q" + qIdx);

  // 如果已经回答过，忽略点击
  if (opts[0].classList.contains("disabled")) return;

  // 禁用所有选项
  opts.forEach(o => o.classList.add("disabled"));

  // 高亮选中的
  opts.forEach(o => o.classList.remove("selected"));
  opts[chosen].classList.add("selected");

  // 判断对错（tf: answer 是 boolean，若为 true 则正确选项是 0，否则是 1）
  let correctIdx;
  if (q.type === "choice") {
    correctIdx = q.answer;
  } else {
    correctIdx = q.answer === true ? 0 : 1;
  }

  const isCorrect = chosen === correctIdx;

  // 标记正确选项
  opts[correctIdx].classList.add("correct-opt");
  if (!isCorrect) {
    opts[chosen].classList.add("wrong-opt");
  }

  // 显示解析
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");
  expDiv.innerHTML = (isCorrect ? "✅ 正确！" : "❌ 错误。") + " " + q.explain;

  // 高亮题目边框
  parent.classList.add(isCorrect ? "correct" : "wrong");

  // 更新得分
  updateScore();
}

function updateScore() {
  let correct = 0;
  questions.forEach((q, idx) => {
    const parent = document.getElementById("q" + idx);
    if (parent.classList.contains("correct")) correct++;
  });
  const score = correct * 5;
  document.getElementById("scoreDisplay").textContent = `得分：${score} / 100`;
}

function resetQuiz() {
  questions.forEach((q, idx) => {
    const parent = document.getElementById("q" + idx);
    parent.className = "quiz-question";
    const opts = parent.querySelectorAll(".opt");
    opts.forEach(o => {
      o.className = "opt";
    });
    const exp = document.getElementById("exp" + idx);
    exp.className = "explain";
    exp.innerHTML = "";
  });
  document.getElementById("scoreDisplay").textContent = "得分：0 / 100";
}
</script>
</body>
</html>
