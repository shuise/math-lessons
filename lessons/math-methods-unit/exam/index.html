<title>综合考验</title>
<link rel="stylesheet" href="../../style.css">
<style>
body {
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  max-width: 920px;
  margin: 0 auto;
  padding: 24px;
  background: #f5f7fa;
  color: #333;
  line-height: 1.9;
  font-size: 16px;
}
article {
  background: #fff; border-radius: 12px; padding: 36px 40px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  overflow-wrap: break-word; word-wrap: break-word; overflow-x: hidden;
}
h1 { color: #2c3e50; font-size: 1.8em; border-bottom: 3px solid #1a73e8; padding-bottom: 10px; margin-top: 0; text-align: center; }
.tip { text-align: center; color: #888; margin-bottom: 24px; }
.note { text-align: center; color: #999; font-size: 0.88em; margin-bottom: 8px; }
.section-header {
  font-size: 1.25em; font-weight: bold; color: #1a73e8;
  border-left: 4px solid #1a73e8; padding-left: 12px;
  margin: 32px 0 16px;
}

/* ------ 选择题样式（主卡由共享 style.css 提供，仅保留差异规则） ------ */
.quiz-question .q-title .q-tag {
  display: inline-block; padding: 1px 10px; border-radius: 12px;
  font-size: 0.75em; margin-right: 6px; color: #fff;
}
.exam-diagram { margin: 10px 0 12px; padding: 8px 0; border-top: 1px solid #e4e7eb; border-bottom: 1px solid #e4e7eb; }
.exam-diagram svg { display: block; width: 100%; height: auto; max-height: 240px; }
.exam-diagram .draw-shape {
  animation: highlight-shape 1.8s ease-in-out infinite;
}
.exam-diagram .key-mark { transform-box: fill-box; transform-origin: center; animation: key-mark 1.4s ease-in-out infinite; }
@keyframes highlight-shape { 50% { stroke-width: 5; opacity: 0.72; } }
@keyframes key-mark { 50% { transform: scale(1.45); } }
@media (prefers-reduced-motion: reduce) {
  .exam-diagram .draw-shape { animation: none; }
  .exam-diagram .key-mark { animation: none; }
}

/* ------ 填空题样式（主卡/按钮/解析由共享 style.css 提供，仅保留差异规则） ------ */
.fill-card .q-title .q-tag {
  display: inline-block; padding: 1px 10px; border-radius: 12px;
  font-size: 0.75em; margin-right: 6px; color: #fff; background: #1a73e8;
}
.fill-card .fill-row {
  display: flex; align-items: center; gap: 12px; margin: 10px 0;
}
.fill-card .fill-input {
  flex: 1; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px;
  font-size: 0.95em; outline: none; transition: border-color 0.15s;
  box-sizing: border-box; font-family: 'Times New Roman', 'STIX', serif;
}

/* 难度标签（.diff-easy/.diff-medium/.diff-hard/.diff-exam 由共享 style.css 提供，此处仅保留渐变差异） */
.diff-olym { background: linear-gradient(135deg, #fff3e0, #ffe0b2); color: #e65100; border: 1px solid #ffb74d; }

/* 底部（#scoreDisplay/.reset-btn 由共享 style.css 提供） */

/* ------ 思路分析按钮与面板 ------ */
.btn-think {
  margin-top: 10px; padding: 6px 18px;
  border: 2px solid #9c27b0; color: #9c27b0;
  border-radius: 16px; background: #fff;
  cursor: pointer; font-size: 0.88em; transition: 0.15s; user-select: none;
}
.btn-think:hover { background: #f3e5f5; }
.btn-think.open { background: #9c27b0; color: #fff; }
.think-panel {
  display: none; margin-top: 10px; padding: 10px 14px;
  border-radius: 8px; font-size: 0.93em; line-height: 1.8;
  background: #f3e5f5; border-left: 4px solid #9c27b0;
}
.think-panel.show { display: block; }
.think-panel .analysis-label {
  display: inline-block; background: #9c27b0; color: #fff;
  padding: 1px 8px; border-radius: 4px; font-size: 0.82em; margin-right: 6px;
}

</style>
</head>

  {

    question: "求值：1/(1×2) + 1/(2×3) + 1/(3×4) + ... + 1/(99×100) = ___。",

    answerType: "string",
    explain: "裂项相消：1/(k(k+1)) = 1/k - 1/(k+1)。原式 = (1 - 1/2) + (1/2 - 1/3) + ... + (1/99 - 1/100) = 1 - 1/100 = 99/100。",
    think: "分母为相邻整数乘积的分数和，第一反应是「裂项相消」：1/(k(k+1))=1/k−1/(k+1)。展开后相邻项互为相反数、中间全部抵消，只剩首尾两项。为什么有效？裂项后大量项消去，繁琐的和式瞬间变简单。"

  {

    question: "用 0、1、2、3、4 组成无重复数字且能被 3 整除的四位数，共有 ___ 个。",

    answerType: "number",
    explain: "能被 3 整除的条件：各位数字之和能被 3 整除。5 个数字中选 4 个，共有 5 种选法：<br>{0,1,2,3} 和=6 ✓，千位不能为 0，有 3×3×2×1=18 个；<br>{0,2,3,4} 和=9 ✓，同样有 18 个；<br>其余三种组合和不能被 3 整除。总计 18+18=36 个。",
    think: "排列组合与整除特征结合：先用「被 3 整除 ⟺ 各位数字和是 3 的倍数」筛选出能用的数字组合，再对每种组合排顺序，特别注意 0 不能放在千位。为什么先筛组合？整除条件只由数字和决定，先定用哪些数字、再排顺序，避免分类混乱。"

// ============================================================
// 渲染
// ============================================================
var choiceAnswered = [];
var fillChecked = [];
var totalScore = 0;

var diffLabels = {
  "高考": '<span class="diff-tag diff-exam">高考</span>',
  "奥数": '<span class="diff-tag diff-olym">&#11088; 奥数</span>'
};

function renderDiagram(type) {
  if (type === "triangle") {
    return '<div class="exam-diagram"><svg viewBox="0 0 360 210" role="img" aria-label="三角形ABC及角C和三条对边标记">' +
      '<path class="draw-shape" d="M48 174 L312 174 L190 34 Z" fill="none" stroke="#1976d2" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M169 58 A32 32 0 0 1 215 62" fill="none" stroke="#d92d20" stroke-width="3"/>' +
      '<circle class="key-mark" cx="190" cy="34" r="6" fill="#d92d20"/>' +
      '<text x="29" y="191" font-size="15">A</text><text x="318" y="191" font-size="15">B</text><text x="184" y="25" font-size="15">C</text>' +
      '<text x="246" y="94" font-size="15" fill="#475467">a</text><text x="113" y="94" font-size="15" fill="#475467">b</text><text x="177" y="197" font-size="15" fill="#475467">c</text>' +
      '<text x="202" y="72" font-size="13" fill="#d92d20">角 C</text></svg></div>';
  }
  if (type === "circle") {
    return '<div class="exam-diagram"><svg viewBox="0 0 360 235" role="img" aria-label="坐标系中圆心为1负2的圆">' +
      '<line x1="24" y1="70" x2="336" y2="70" stroke="#667085" stroke-width="2"/><polygon points="336,70 327,65 327,75" fill="#667085"/>' +
      '<line x1="160" y1="18" x2="160" y2="224" stroke="#667085" stroke-width="2"/><polygon points="160,18 155,27 165,27" fill="#667085"/>' +
      '<circle class="draw-shape" cx="195" cy="140" r="78" fill="none" stroke="#1976d2" stroke-width="4"/>' +
      '<line x1="160" y1="140" x2="195" y2="140" stroke="#98a2b3" stroke-dasharray="5 5"/><line x1="195" y1="70" x2="195" y2="140" stroke="#98a2b3" stroke-dasharray="5 5"/>' +
      '<circle class="key-mark" cx="195" cy="140" r="6" fill="#d92d20"/><text x="205" y="158" font-size="14">O(1,−2)</text>' +
      '<text x="326" y="59" font-size="13">x</text><text x="171" y="25" font-size="13">y</text></svg></div>';
  }
  return "";
}

function render() {
  // 渲染选择题
  var choiceHtml = "";
  for (var i = 0; i < choiceQuestions.length; i++) {
    var q = choiceQuestions[i];
    var letter = ["A", "B", "C", "D"];
    choiceHtml += '<div class="quiz-question" id="cq' + i + '">';
    choiceHtml += '<div class="q-title"><span class="q-tag choice">选择</span> ' + (i+1) + '. ' + q.question + ' ' + (diffLabels[q.diff] || "") + '</div>';
    if (q.diagram) choiceHtml += renderDiagram(q.diagram);
    choiceHtml += '<div class="options">';
    for (var j = 0; j < q.opts.length; j++) {
      choiceHtml += '<div class="opt" onclick="selectChoice(' + i + ',' + j + ')">' + letter[j] + '. ' + q.opts[j] + '</div>';
    }
    choiceHtml += '</div>';
    choiceHtml += '<button class="btn-think" id="cthinkBtn' + i + '" onclick="toggleThink(0,' + i + ')">思路分析</button>';
    choiceHtml += '<div class="think-panel" id="cthink' + i + '"><span class="analysis-label">思路分析</span>' + q.think + '</div>';
    choiceHtml += '<div class="explain" id="cexp' + i + '"></div>';
    choiceHtml += '</div>';
  }
  document.getElementById("choice-container").innerHTML = choiceHtml;
  choiceAnswered = new Array(choiceQuestions.length).fill(-1);

  // 渲染填空题
  var fillHtml = "";
  for (var i = 0; i < fillQuestions.length; i++) {
    var q = fillQuestions[i];
    var qNum = choiceQuestions.length + i + 1;
    fillHtml += '<div class="fill-card" id="fq' + i + '">';
    fillHtml += '<div class="q-title"><span class="q-tag">填空</span> ' + qNum + '. ' + q.question + ' ' + (diffLabels[q.diff] || "") + '</div>';
    fillHtml += '<div class="fill-row">';
    fillHtml += '<input class="fill-input" id="fInput' + i + '" type="text" placeholder="请输入答案...">';
    fillHtml += '<button class="btn-check" id="fBtn' + i + '" onclick="checkFill(' + i + ')">确认</button>';
    fillHtml += '</div>';
    fillHtml += '<button class="btn-think" id="fthinkBtn' + i + '" onclick="toggleThink(1,' + i + ')">思路分析</button>';
    fillHtml += '<div class="think-panel" id="fthink' + i + '"><span class="analysis-label">思路分析</span>' + q.think + '</div>';
    fillHtml += '<div class="explain" id="fexp' + i + '"></div>';
    fillHtml += '</div>';
  }
  document.getElementById("fill-container").innerHTML = fillHtml;
  fillChecked = new Array(fillQuestions.length).fill(false);
}

// ============================================================
// 选择题交互
// ============================================================
function selectChoice(qi, oi) {
  if (choiceAnswered[qi] !== -1) return;
  choiceAnswered[qi] = oi;
  var q = choiceQuestions[qi];
  var isCorrect = (oi === q.answer);

  var qDiv = document.getElementById("cq" + qi);
  var opts = qDiv.querySelectorAll(".opt");
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add("disabled");
    if (i === q.answer) opts[i].classList.add("correct-opt");
    if (i === oi && !isCorrect) opts[i].classList.add("wrong-opt");
    if (i === oi && isCorrect) opts[i].classList.add("selected");
  }

  qDiv.classList.add(isCorrect ? "correct" : "wrong");

  var expDiv = document.getElementById("cexp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 " : "\u2717 ") + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// ============================================================
// 填空题交互
// ============================================================
function parseMathNumber(value) {
  var normalized = value.trim().replace(/[−﹣]/g, "-");
  if (/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(normalized)) {
    return Number(normalized);
  }
  var fraction = /^([+-]?\d+)\/([+-]?\d+)$/.exec(normalized);
  if (fraction && Number(fraction[2]) !== 0) {
    return Number(fraction[1]) / Number(fraction[2]);
  }
  return NaN;
}

function checkFill(qi) {
  if (fillChecked[qi]) return;
  fillChecked[qi] = true;
  var input = document.getElementById("fInput" + qi);
  var q = fillQuestions[qi];
  var userAnswer = input.value.trim();
  var isCorrect = false;

  var userNum = parseMathNumber(userAnswer);
  var ansNum = parseMathNumber(q.answer);
  if (!isNaN(userNum) && !isNaN(ansNum)) {
    isCorrect = (Math.abs(userNum - ansNum) < 0.0001);
  } else {
    // 非数值答案按去空格后的完整字符串比较，避免只读取前缀。
    var normalizedUser = userAnswer.replace(/\s+/g, "");
    var normalizedAns = q.answer.replace(/\s+/g, "");
    isCorrect = (normalizedUser === normalizedAns);
  }

  input.disabled = true;
  document.getElementById("fBtn" + qi).disabled = true;

  var card = document.getElementById("fq" + qi);
  if (isCorrect) {
    input.classList.add("correct-input");
    card.classList.add("correct");
  } else {
    input.classList.add("wrong-input");
    card.classList.add("wrong");
  }

  var expDiv = document.getElementById("fexp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 正确！" : "\u2717 错误，正确答案是 " + q.answer + "。") + "<br>" + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// ============================================================
// 思路分析
// ============================================================
function toggleThink(type, qi) {
  var panel = document.getElementById((type === 0 ? "cthink" : "fthink") + qi);
  var btn = document.getElementById((type === 0 ? "cthinkBtn" : "fthinkBtn") + qi);
  if (!panel || !btn) return;
  var show = !panel.classList.contains("show");
  panel.classList.toggle("show", show);
  btn.classList.toggle("open", show);
}

// ============================================================
// 计分
// ============================================================
function updateScore() {
  var total = 0;
  // 选择题计分（每题 5 分）
  for (var i = 0; i < choiceQuestions.length; i++) {
    if (choiceAnswered[i] === choiceQuestions[i].answer) {
      total += 5;
    }
  }
  // 填空题计分（每题 5 分）
  for (var i = 0; i < fillQuestions.length; i++) {
    if (fillChecked[i]) {
      var input = document.getElementById("fInput" + i);
      if (input && input.classList.contains("correct-input")) {
        total += 5;
      }
    }
  }
  totalScore = total;
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a" + total + " / 100";
}

// ============================================================
// 重置
// ============================================================
function resetExam() {
  choiceAnswered = new Array(choiceQuestions.length).fill(-1);
  fillChecked = new Array(fillQuestions.length).fill(false);
  totalScore = 0;
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a0 / 100";

  for (var i = 0; i < choiceQuestions.length; i++) {
    var qDiv = document.getElementById("cq" + i);
    if (qDiv) {
      qDiv.className = "quiz-question";
      var opts = qDiv.querySelectorAll(".opt");
      for (var j = 0; j < opts.length; j++) {
        opts[j].className = "opt";
      }
      document.getElementById("cexp" + i).className = "explain";
    }
    var tPanel = document.getElementById("cthink" + i);
    if (tPanel) tPanel.classList.remove("show");
    var tBtn = document.getElementById("cthinkBtn" + i);
    if (tBtn) tBtn.classList.remove("open");
  }

  for (var i = 0; i < fillQuestions.length; i++) {
    var card = document.getElementById("fq" + i);
    if (card) card.className = "fill-card";
    var input = document.getElementById("fInput" + i);
    if (input) {
      input.disabled = false;
      input.value = "";
      input.className = "fill-input";
      document.getElementById("fBtn" + i).disabled = false;
      document.getElementById("fexp" + i).className = "explain";
    }
    var tPanel = document.getElementById("fthink" + i);
    if (tPanel) tPanel.classList.remove("show");
    var tBtn = document.getElementById("fthinkBtn" + i);
    if (tBtn) tBtn.classList.remove("open");
  }
}

render();
</script>
