<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../../lib/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>综合考验</title>
<link rel="stylesheet" href="../../style.css">
<style>
body {
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  max-width: 900px;
  margin: 0 auto;
  padding: 24px;
  background: #f5f7fa;
  color: #333;
  line-height: 1.9;
  font-size: 16px;
}
article {
  background: #fff; border-radius: 12px; padding: 36px 40px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  overflow-wrap: break-word; word-wrap: break-word; overflow-x: hidden;
}
h1 { color: #2c3e50; font-size: 1.8em; border-bottom: 3px solid #1a73e8; padding-bottom: 10px; margin-top: 0; text-align: center; }
.back {
  display: inline-block; margin-bottom: 16px;
  color: #1a73e8; text-decoration: none; font-size: 0.95em;
}
.back:hover { text-decoration: underline; }
.tip { text-align: center; color: #888; margin-bottom: 24px; }
.note { text-align: center; color: #999; font-size: 0.88em; margin-bottom: 8px; }
.section-header {
  font-size: 1.25em; font-weight: bold; color: #1a73e8;
  border-left: 4px solid #1a73e8; padding-left: 12px;
  margin: 32px 0 16px;
}

/* ------ 选择题样式 ------ */
.quiz-question {
  background: #fff; border: 2px solid #e0e0e0; border-radius: 10px;
  padding: 18px 22px; margin: 16px 0; transition: all 0.2s;
}
.quiz-question.correct { border-color: #4caf50; background: #f1f8e9; }
.quiz-question.wrong { border-color: #f44336; background: #fce4ec; }
.quiz-question .q-title {
  font-weight: bold; font-size: 1.05em; margin-bottom: 10px; color: #2c3e50;
}
.quiz-question .q-title .q-tag {
  display: inline-block; padding: 1px 10px; border-radius: 12px;
  font-size: 0.75em; margin-right: 6px; color: #fff;
}
.q-tag.choice { background: #1a73e8; }
.quiz-question .options { display: flex; flex-direction: column; gap: 8px; }
.quiz-question .opt {
  padding: 8px 14px; border: 2px solid #ddd; border-radius: 8px;
  cursor: pointer; transition: all 0.15s; background: #fafafa; user-select: none;
}
.quiz-question .opt:hover { background: #e3f2fd; border-color: #90caf9; }
.quiz-question .opt.selected { border-color: #1a73e8; background: #bbdefb; font-weight: bold; }
.quiz-question .opt.correct-opt { border-color: #4caf50; background: #c8e6c9; font-weight: bold; }
.quiz-question .opt.wrong-opt { border-color: #f44336; background: #ffcdd2; }
.quiz-question .opt.disabled { pointer-events: none; opacity: 0.7; }
.quiz-question .explain {
  margin-top: 10px; padding: 10px 14px; border-radius: 8px;
  font-size: 0.93em; display: none;
}
.quiz-question .explain.show { display: block; }
.quiz-question .explain.ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
.quiz-question .explain.fail { background: #fbe9e7; border-left: 4px solid #f44336; }

/* ------ 填空题样式 ------ */
.fill-card {
  background: #fff; border: 2px solid #e0e0e0; border-radius: 10px;
  padding: 18px 22px; margin: 16px 0; transition: all 0.2s;
}
.fill-card.correct { border-color: #4caf50; background: #f1f8e9; }
.fill-card.wrong { border-color: #f44336; background: #fce4ec; }
.fill-card .q-title {
  font-weight: bold; font-size: 1.05em; margin-bottom: 10px; color: #2c3e50;
}
.fill-card .q-title .q-tag {
  display: inline-block; padding: 1px 10px; border-radius: 12px;
  font-size: 0.75em; margin-right: 6px; color: #fff; background: #1a73e8;
}
.fill-card .fill-row {
  display: flex; align-items: center; gap: 12px; margin: 10px 0;
}
.fill-card .fill-input {
  flex: 1; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px;
  font-size: 0.95em; outline: none; transition: border-color 0.15s;
  box-sizing: border-box; font-family: 'Times New Roman', 'STIX', serif;
}
.fill-card .fill-input:focus { border-color: #1a73e8; }
.fill-card .fill-input.correct-input { border-color: #4caf50; background: #e8f5e9; }
.fill-card .fill-input.wrong-input { border-color: #f44336; background: #fce4ec; }
.fill-card .btn-check {
  padding: 6px 16px; background: #1a73e8; color: #fff; border: none;
  border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: 0.15s;
}
.fill-card .btn-check:hover { background: #1557b0; }
.fill-card .btn-check:disabled { opacity: 0.5; cursor: default; }
.fill-card .explain {
  margin-top: 10px; padding: 10px 14px; border-radius: 8px;
  font-size: 0.93em; display: none;
}
.fill-card .explain.show { display: block; }
.fill-card .explain.ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
.fill-card .explain.fail { background: #fbe9e7; border-left: 4px solid #f44336; }

/* 难度标签 */
.diff-tag {
  display: inline-block; padding: 1px 8px; border-radius: 8px;
  font-size: 0.7em; margin-left: 6px; font-weight: normal;
}
.diff-easy { background: #e8f5e9; color: #2e7d32; }
.diff-medium { background: #fff8e1; color: #f57f17; }
.diff-hard { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
.diff-exam { background: #f3e5f5; color: #6a1b9a; border: 1px solid #ce93d8; }
.diff-olym { background: linear-gradient(135deg, #fff3e0, #ffe0b2); color: #e65100; border: 1px solid #ffb74d; }

/* 底部 */
#scoreDisplay {
  display: inline-block; background: #1a73e8; color: #fff;
  padding: 12px 32px; border-radius: 30px; font-size: 1.2em; font-weight: bold;
}
.reset-btn {
  display: inline-block; margin-top: 12px; padding: 8px 28px;
  border: 2px solid #1a73e8; color: #1a73e8; border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 1em; transition: 0.15s;
}
.reset-btn:hover { background: #e3f2fd; }
</style>
</head>
<body>
<a class="back" href="../../index.html">&larr; 返回课程列表</a>
<article>
<h1>综合考验</h1>
<p class="tip">总分 100 分 · 时间 30 分钟 · 高考难度 60% + 奥数难度 40%</p>
<p class="tip" style="font-size:0.9em;">选择题点击选项提交答案，填空题填写后点击"确认"提交。</p>

<!-- ==================== 第一部分：选择题 ==================== -->
<section>
<h2 class="section-header">一、选择题（每题 5 分，共 70 分）</h2>
<div id="choice-container"></div>
</section>

<!-- ==================== 第二部分：填空题 ==================== -->
<section>
<h2 class="section-header">二、填空题（每题 5 分，共 30 分）</h2>
<div id="fill-container"></div>
</section>

<!-- ==================== 得分 ==================== -->
<div style="text-align:center;margin:24px 0;">
  <div id="scoreDisplay">得分：0 / 100</div>
  <br>
  <button class="reset-btn" onclick="resetExam()">&#8635; 重新答题</button>
</div>

</article>

<script>
// ============================================================
// 选择题（14 题 — Q1~Q12 高考难度，Q13~Q14 奥数难度）
// ============================================================
var choiceQuestions = [
  // ========== 高考难度 Q1~Q12 ==========
  {
    diff: "高考",
    question: "已知函数 f(x) = x³ - 3x + 1，则方程 f(x) = 0 在 [-2, 2] 上的实数根个数为（  ）",
    opts: ["1 个", "2 个", "3 个", "4 个"],
    answer: 2,
    explain: "f(-2) = -8 + 6 + 1 = -1 &lt; 0，f(-1) = -1 + 3 + 1 = 3 &gt; 0，f(1) = 1 - 3 + 1 = -1 &lt; 0，f(2) = 8 - 6 + 1 = 3 &gt; 0。由零点定理，f(x) 在 (-2,-1)、(-1,1)、(1,2) 上各有一个零点，共 3 个实数根。"
  },
  {
    diff: "高考",
    question: "函数 f(x) = ln(x² - 2x + 2) 的值域是（  ）",
    opts: ["[0, +∞)", "(0, +∞)", "(-∞, +∞)", "[ln2, +∞)"],
    answer: 0,
    explain: "令 t = x² - 2x + 2 = (x-1)² + 1 ≥ 1。所以 t ∈ [1, +∞)。y = ln t 在 [1, +∞) 上单调递增，且 ln1 = 0，所以值域为 [0, +∞)。"
  },
  {
    diff: "高考",
    question: "等差数列 {aₙ} 中，a₁ + a₃ + a₅ = 12，则 a₃ =（  ）",
    opts: ["2", "3", "4", "6"],
    answer: 2,
    explain: "由等差数列性质，a₁ + a₃ + a₅ = a₁ + (a₁ + 2d) + (a₁ + 4d) = 3a₁ + 6d = 3(a₁ + 2d) = 3a₃ = 12，所以 a₃ = 4。"
  },
  {
    diff: "高考",
    question: "等比数列 {aₙ} 中，a₂ = 2，a₅ = 16，则公比 q =（  ）",
    opts: ["±2", "2", "±4", "4"],
    answer: 1,
    explain: "a₅ = a₂ · q³，即 16 = 2q³，得 q³ = 8，所以 q = 2（实数范围内 q > 0 也可取）。"
  },
  {
    diff: "高考",
    question: "从 1, 2, 3, 4, 5 中任取两个不同的数，其和为偶数的概率为（  ）",
    opts: ["1/5", "2/5", "3/5", "4/5"],
    answer: 1,
    explain: "和为偶数 → 两数同奇或同偶。奇数有 1,3,5 共 3 个，C(3,2)=3 种取法；偶数有 2,4 共 2 个，C(2,2)=1 种取法。总取法 C(5,2)=10。所以概率 = (3+1)/10 = 2/5。"
  },
  {
    diff: "高考",
    question: "一枚硬币抛 3 次，恰好出现 2 次正面向上的概率为（  ）",
    opts: ["1/8", "3/8", "1/2", "5/8"],
    answer: 1,
    explain: "总共有 2³ = 8 种等可能结果。恰好 2 次正面向上即从 3 次中选择 2 次为正面，有 C(3,2)=3 种。所以概率 = 3/8。"
  },
  {
    diff: "高考",
    question: "在 △ABC 中，角 A、B、C 对边分别为 a、b、c。若 a² + b² = c² + ab，则角 C =（  ）",
    opts: ["30°", "45°", "60°", "90°"],
    answer: 2,
    explain: "由余弦定理：cos C = (a² + b² - c²) / (2ab) = ab / (2ab) = 1/2。所以 C = 60°。"
  },
  {
    diff: "高考",
    question: "圆 x² + y² - 2x + 4y = 0 的圆心坐标是（  ）",
    opts: ["(1, -2)", "(-1, 2)", "(1, 2)", "(-1, -2)"],
    answer: 0,
    explain: "配方：(x² - 2x + 1) + (y² + 4y + 4) = 5，即 (x - 1)² + (y + 2)² = 5。所以圆心为 (1, -2)。"
  },
  {
    diff: "高考",
    question: "已知 x > 0，y > 0，且 x + y = 4，则 xy 的最大值为（  ）",
    opts: ["2", "4", "8", "16"],
    answer: 1,
    explain: "由基本不等式：√(xy) ≤ (x + y)/2 = 2，所以 xy ≤ 4。当且仅当 x = y = 2 时取等号。"
  },
  {
    diff: "高考",
    question: "不等式 |x - 1| + |x + 2| ≤ 5 的解集为（  ）",
    opts: ["[-3, 2]", "[-2, 4]", "[-1, 3]", "[-4, 1]"],
    answer: 0,
    explain: "分三段讨论：<br>x &lt; -2 时：-(x-1)-(x+2) ≤ 5 → -2x ≤ 6 → x ≥ -3，得 [-3, -2)；<br>-2 ≤ x ≤ 1 时：-(x-1)+(x+2) = 3 ≤ 5 恒成立，得 [-2, 1]；<br>x &gt; 1 时：(x-1)+(x+2) ≤ 5 → 2x ≤ 4 → x ≤ 2，得 (1, 2]。<br>综上，解集为 [-3, 2]。"
  },
  {
    diff: "高考",
    question: "已知 f(x) 是定义在 R 上的奇函数，当 x > 0 时 f(x) = x² - 2x，则 f(-1) =（  ）",
    opts: ["-1", "0", "1", "3"],
    answer: 2,
    explain: "奇函数满足 f(-x) = -f(x)。所以 f(-1) = -f(1) = -(1² - 2×1) = -(-1) = 1。"
  },
  {
    diff: "高考",
    question: "若函数 f(x) = ax² + bx + c 满足 f(1) = 0，f(2) = 0，f(0) = 2，则 f(x) 的表达式为（  ）",
    opts: ["x² - 3x + 2", "x² + 3x + 2", "-x² - 3x + 2", "x² - 3x - 2"],
    answer: 0,
    explain: "由 f(0) = 2 得 c = 2。由 f(1) = a + b + 2 = 0，f(2) = 4a + 2b + 2 = 0。解得 a = 1，b = -3。所以 f(x) = x² - 3x + 2。"
  },

  // ========== 奥数难度 Q13~Q14 ==========
  {
    diff: "奥数",
    question: "集合 S = {1, 2, ..., 10} 的子集 A 满足：若 a ∈ A 则 a + 1 ∉ A。求满足条件的 A 的个数为（  ）",
    opts: ["89", "144", "233", "256"],
    answer: 1,
    explain: "问题等价于从 1~10 中选数，相邻数字不能同时选。设 f(n) 为 {1,...,n} 中满足条件的子集数。f(1)=2（选/不选 1），f(2)=3（∅,{1},{2}）。递推：考虑 n，若选 n 则不能选 n-1，f(n) = f(n-2) + f(n-1)。得 f(10)=144。这正是斐波那契数列 F₁₂。"
  },
  {
    diff: "奥数",
    question: "方程 x + y + z = 10 的正整数解有多少组？（  ）",
    opts: ["28", "36", "45", "84"],
    answer: 1,
    explain: "将 10 个 1 排成一排，中间有 9 个空隙，插入 2 个隔板分成 3 份，对应 x、y、z 的值。所以解数为 C(9, 2) = 36 组。这是经典的隔板法（插板法）应用。"
  }
];

// ============================================================
// 填空题（6 题 — Q15~Q20 奥数难度）
// ============================================================
var fillQuestions = [
  {
    diff: "奥数",
    question: "1 到 2025 中，既不是 2 的倍数也不是 3 的倍数的整数共有 ___ 个。",
    answer: "675",
    answerType: "number",
    explain: "总数 2025。2 的倍数有 ⌊2025/2⌋ = 1012 个，3 的倍数有 ⌊2025/3⌋ = 675 个，6 的倍数有 ⌊2025/6⌋ = 337 个。由容斥原理，既不是 2 也不是 3 的倍数：2025 - 1012 - 675 + 337 = 675。"
  },
  {
    diff: "奥数",
    question: "将 11 个相同的小球放入 3 个不同的盒子，每个盒子至少一个，有 ___ 种不同放法。",
    answer: "45",
    answerType: "number",
    explain: "隔板法：11 个小球排成一排，中间有 10 个空隙，插入 2 个隔板分成 3 份（对应 3 个盒子）。所以放法数为 C(10, 2) = 45。"
  },
  {
    diff: "奥数",
    question: "已知 a₁ = 1，aₙ₊₁ = 2aₙ + 1，则 a₁₀ = ___。",
    answer: "1023",
    answerType: "number",
    explain: "aₙ₊₁ + 1 = 2(aₙ + 1)，所以 {aₙ + 1} 是以 a₁ + 1 = 2 为首项、2 为公比的等比数列。aₙ + 1 = 2·2ⁿ⁻¹ = 2ⁿ，故 aₙ = 2ⁿ - 1。所以 a₁₀ = 2¹⁰ - 1 = 1024 - 1 = 1023。"
  },
  {
    diff: "奥数",
    question: "求值：1×2 + 2×3 + 3×4 + ... + 10×11 = ___。",
    answer: "440",
    answerType: "number",
    explain: "Σ_{k=1}^{10} k(k+1) = Σ(k² + k) = Σk² + Σk = (10×11×21)/6 + (10×11)/2 = 385 + 55 = 440。"
  },
  {
    diff: "奥数",
    question: "求值：1/(1×2) + 1/(2×3) + 1/(3×4) + ... + 1/(99×100) = ___。",
    answer: "99/100",
    answerType: "string",
    explain: "裂项相消：1/(k(k+1)) = 1/k - 1/(k+1)。原式 = (1 - 1/2) + (1/2 - 1/3) + ... + (1/99 - 1/100) = 1 - 1/100 = 99/100。"
  },
  {
    diff: "奥数",
    question: "用 0、1、2、3、4 组成无重复数字且能被 3 整除的四位数，共有 ___ 个。",
    answer: "36",
    answerType: "number",
    explain: "能被 3 整除的条件：各位数字之和能被 3 整除。5 个数字中选 4 个，共有 5 种选法：<br>{0,1,2,3} 和=6 ✓，千位不能为 0，有 3×3×2×1=18 个；<br>{0,2,3,4} 和=9 ✓，同样有 18 个；<br>其余三种组合和不能被 3 整除。总计 18+18=36 个。"
  }
];

// ============================================================
// 渲染
// ============================================================
var choiceAnswered = [];
var fillChecked = [];
var totalScore = 0;

var diffLabels = {
  "高考": '<span class="diff-tag diff-exam">高考</span>',
  "奥数": '<span class="diff-tag diff-olym">&#11088; 奥数</span>'
};

function render() {
  // 渲染选择题
  var choiceHtml = "";
  for (var i = 0; i < choiceQuestions.length; i++) {
    var q = choiceQuestions[i];
    var letter = ["A", "B", "C", "D"];
    choiceHtml += '<div class="quiz-question" id="cq' + i + '">';
    choiceHtml += '<div class="q-title"><span class="q-tag choice">选择</span> ' + (i+1) + '. ' + q.question + ' ' + (diffLabels[q.diff] || "") + '</div>';
    choiceHtml += '<div class="options">';
    for (var j = 0; j < q.opts.length; j++) {
      choiceHtml += '<div class="opt" onclick="selectChoice(' + i + ',' + j + ')">' + letter[j] + '. ' + q.opts[j] + '</div>';
    }
    choiceHtml += '</div>';
    choiceHtml += '<div class="explain" id="cexp' + i + '"></div>';
    choiceHtml += '</div>';
  }
  document.getElementById("choice-container").innerHTML = choiceHtml;
  choiceAnswered = new Array(choiceQuestions.length).fill(-1);

  // 渲染填空题
  var fillHtml = "";
  for (var i = 0; i < fillQuestions.length; i++) {
    var q = fillQuestions[i];
    var qNum = choiceQuestions.length + i + 1;
    fillHtml += '<div class="fill-card" id="fq' + i + '">';
    fillHtml += '<div class="q-title"><span class="q-tag">填空</span> ' + qNum + '. ' + q.question + ' ' + (diffLabels[q.diff] || "") + '</div>';
    fillHtml += '<div class="fill-row">';
    fillHtml += '<input class="fill-input" id="fInput' + i + '" type="text" placeholder="请输入答案...">';
    fillHtml += '<button class="btn-check" id="fBtn' + i + '" onclick="checkFill(' + i + ')">确认</button>';
    fillHtml += '</div>';
    fillHtml += '<div class="explain" id="fexp' + i + '"></div>';
    fillHtml += '</div>';
  }
  document.getElementById("fill-container").innerHTML = fillHtml;
  fillChecked = new Array(fillQuestions.length).fill(false);
}

// ============================================================
// 选择题交互
// ============================================================
function selectChoice(qi, oi) {
  if (choiceAnswered[qi] !== -1) return;
  choiceAnswered[qi] = oi;
  var q = choiceQuestions[qi];
  var isCorrect = (oi === q.answer);

  var qDiv = document.getElementById("cq" + qi);
  var opts = qDiv.querySelectorAll(".opt");
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add("disabled");
    if (i === q.answer) opts[i].classList.add("correct-opt");
    if (i === oi && !isCorrect) opts[i].classList.add("wrong-opt");
    if (i === oi && isCorrect) opts[i].classList.add("selected");
  }

  qDiv.classList.add(isCorrect ? "correct" : "wrong");

  var expDiv = document.getElementById("cexp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 " : "\u2717 ") + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// ============================================================
// 填空题交互
// ============================================================
function checkFill(qi) {
  if (fillChecked[qi]) return;
  fillChecked[qi] = true;
  var input = document.getElementById("fInput" + qi);
  var q = fillQuestions[qi];
  var userAnswer = input.value.trim();
  var isCorrect = false;

  if (q.answerType === "number") {
    // 数字答案：直接比较数值
    var userNum = parseFloat(userAnswer);
    var ansNum = parseFloat(q.answer);
    if (!isNaN(userNum) && !isNaN(ansNum)) {
      isCorrect = (Math.abs(userNum - ansNum) < 0.0001);
    }
  } else {
    // 字符串答案（如集合、分数等）：归一化后比较
    var normalizedUser = userAnswer.replace(/\s+/g, "");
    var normalizedAns = q.answer.replace(/\s+/g, "");
    isCorrect = (normalizedUser === normalizedAns);
  }

  input.disabled = true;
  document.getElementById("fBtn" + qi).disabled = true;

  var card = document.getElementById("fq" + qi);
  if (isCorrect) {
    input.classList.add("correct-input");
    card.classList.add("correct");
  } else {
    input.classList.add("wrong-input");
    card.classList.add("wrong");
  }

  var expDiv = document.getElementById("fexp" + qi);
  expDiv.innerHTML = (isCorrect ? "\u2713 正确！" : "\u2717 错误，正确答案是 " + q.answer + "。") + "<br>" + q.explain;
  expDiv.className = "explain show " + (isCorrect ? "ok" : "fail");

  updateScore();
}

// ============================================================
// 计分
// ============================================================
function updateScore() {
  var total = 0;
  // 选择题计分（每题 5 分）
  for (var i = 0; i < choiceQuestions.length; i++) {
    if (choiceAnswered[i] === choiceQuestions[i].answer) {
      total += 5;
    }
  }
  // 填空题计分（每题 5 分）
  for (var i = 0; i < fillQuestions.length; i++) {
    if (fillChecked[i]) {
      var input = document.getElementById("fInput" + i);
      if (input && input.classList.contains("correct-input")) {
        total += 5;
      }
    }
  }
  totalScore = total;
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a" + total + " / 100";
}

// ============================================================
// 重置
// ============================================================
function resetExam() {
  choiceAnswered = new Array(choiceQuestions.length).fill(-1);
  fillChecked = new Array(fillQuestions.length).fill(false);
  totalScore = 0;
  document.getElementById("scoreDisplay").textContent = "\u5f97\u5206\uff1a0 / 100";

  for (var i = 0; i < choiceQuestions.length; i++) {
    var qDiv = document.getElementById("cq" + i);
    if (qDiv) {
      qDiv.className = "quiz-question";
      var opts = qDiv.querySelectorAll(".opt");
      for (var j = 0; j < opts.length; j++) {
        opts[j].className = "opt";
      }
      document.getElementById("cexp" + i).className = "explain";
    }
  }

  for (var i = 0; i < fillQuestions.length; i++) {
    var card = document.getElementById("fq" + i);
    if (card) card.className = "fill-card";
    var input = document.getElementById("fInput" + i);
    if (input) {
      input.disabled = false;
      input.value = "";
      input.className = "fill-input";
      document.getElementById("fBtn" + i).disabled = false;
      document.getElementById("fexp" + i).className = "explain";
    }
  }
}

render();
</script>
