// ============================================================
// 奥数测试 — 10 道解答题

var calcQuestions = [
  // Q1: 函数方程 — 柯西方程 + 单调性 (Part 7)
  {
    diff: "奥数",
    question: '已知定义在 R 上的函数 f(x) 满足：<br>① 对任意 x, y ∈ R，f(x+y) = f(x) + f(y)；<br>② f(1) = 2；<br>③ 当 x > 0 时，f(x) > 0。<br><br>(1) 证明 f(x) 是奇函数；<br>(2) 解不等式 f(x² &minus; 3x) < f(4)。',
    hint: '① 抽象函数题没有解析式可用，突破口只有"赋值法"：代入特殊值挖掘 f 的性质。要证奇函数，目标是 f(&minus;x) = &minus;f(x)，先令 y = 0 求出 f(0) = 0，再令 y = &minus;x 即可，这是这类题的固定套路。<br>② 解含 f 的不等式，f 没有解析式无法直接算，只能借助"单调性"把 f 去掉。为什么能想到单调？条件③ 恰好保证 x₂ &minus; x₁ > 0 时 f(x₂) &minus; f(x₁) = f(x₂ &minus; x₁) > 0，这就是为证明 f 严格递增准备的原料，抓差的正负即可。',
    answer: "(&minus;1, 4)",
    steps: [
      "(1) 奇函数证明：",
      "令 y = 0：f(x) = f(x) + f(0) ⇒ f(0) = 0。",
      "令 y = &minus;x：f(0) = f(x) + f(&minus;x) ⇒ f(&minus;x) = &minus;f(x)。",
      "所以 f(x) 是奇函数。",
      "",
      "(2) 首先证明 f(x) 严格单调递增：",
      "对任意 x₁ < x₂，x₂ &minus; x₁ > 0，由条件③知 f(x₂ &minus; x₁) > 0。",
      "f(x₂) = f(x₁ + (x₂&minus;x₁)) = f(x₁) + f(x₂&minus;x₁) > f(x₁)。",
      "所以 f 在 R 上严格递增。",
      "",
      "由单调性，f(x² &minus; 3x) < f(4) ⇔ x² &minus; 3x < 4。",
      "即 x² &minus; 3x &minus; 4 < 0 ⇒ (x &minus; 4)(x + 1) < 0。",
      "解得 &minus;1 < x < 4，解集为 (&minus;1, 4)。"
    ]
  },
  // Q2: 指数方程根的个数 (Part 5 + Part 7)
  {
    diff: "奥数",
    question: '设 a > 0 且 a ≠ 1。若关于 x 的方程 |a<sup>x</sup> &minus; 1| = 2a 有两个不同的实根，求 a 的取值范围。',
    hint: '① 直接分析带指数的绝对值方程很困难，先换元 t = a<sup>x</sup>（t > 0）把问题降维成关于 t 的普通绝对值方程 |t &minus; 1| = 2a。为什么换元？a<sup>x</sup> 的值域恰好是全体正数，换元后每个 t 对应唯一一个 x，根的个数不会丢失。<br>② |t &minus; 1| = 2a 拆出两个候选 t 值（1 + 2a 和 1 &minus; 2a）后，只需逐个检查"是否为正、是否对应不同的 x"，题目条件"两个不同实根"就被翻译成了对 a 的代数要求，再分区间讨论即可。',
    answer: "0 &lt; a &lt; 1/2",
    steps: [
      "令 t = a<sup>x</sup> > 0，则方程变为 |t &minus; 1| = 2a。",
      "由 |t &minus; 1| = 2a 得 t = 1 + 2a 或 t = 1 &minus; 2a。",
      "t = 1 + 2a > 0 恒成立（a > 0），总存在一个 x 与之对应。",
      "t = 1 &minus; 2a 需满足 1 &minus; 2a > 0 ⇒ a < 1/2。",
      "",
      "当 0 < a < 1/2 时，需验证两个 t 值是否对应不同的 x：",
      "① t₁ = 1 + 2a：x₁ = log<sub>a</sub>(1 + 2a)；",
      "② t₂ = 1 &minus; 2a：x₂ = log<sub>a</sub>(1 &minus; 2a)。",
      "",
      "由于 1 + 2a ≠ 1 &minus; 2a（a > 0），且 a > 0, a ≠ 1，",
      "当 0 < a < 1/2 时，1 &minus; 2a > 0，两个 t 值均为正且不相等，对应两个不同的 x。",
      "",
      "当 a ≥ 1/2 时，1 &minus; 2a ≤ 0，t₂ 不大于 0，无对应的 x。",
      "",
      "综上，a 的取值范围为 (0, 1/2)。"
    ]
  },
  // Q3: 抽象函数的对称性与周期性 (Part 8)
  {
    diff: "奥数",
    question: '定义在 R 上的函数 f(x) 满足：<br>① f(x + 2) = &minus;f(x)；<br>② f(x) 的图像关于直线 x = 1 对称；<br>③ 当 x ∈ (0, 1] 时，f(x) = x(1 &minus; x)。<br><br>求 f(2025) + f(2026) 的值。',
    hint: '① 求 f(2025)，数字大得不可能直接代，方向必然是"找周期"把大数化小。条件① f(x + 2) = &minus;f(x) 就是周期的入口：连用两次得 f(x + 4) = f(x)，周期为 4，再把 2025、2026 除以 4 看余数即可。<br>② 还差 f(1)、f(2) 两个值：f(1) 直接由③代入；f(2) 是难点——同时利用对称性 f(2) = f(0) 与递推式 f(2) = &minus;f(0) 联立，两式迫使 f(0) = 0。为什么能想到双管齐下？"对称 + 递推同时作用在一个点"是抽象函数求值的经典配合。',
    answer: "0",
    steps: [
      "由①：f(x+4) = &minus;f(x+2) = &minus;(&minus;f(x)) = f(x)，所以 4 是 f(x) 的一个周期。",
      "",
      "由②：f(1 + x) = f(1 &minus; x) 对所有 x 成立。",
      "令 x = 1：f(2) = f(0)。",
      "又由①：f(2) = &minus;f(0)。",
      "所以 f(0) = &minus;f(0) ⇒ f(0) = 0，进而 f(2) = 0。",
      "",
      "利用周期 4：",
      "2025 = 4 × 506 + 1 ⇒ f(2025) = f(1)；",
      "2026 = 4 × 506 + 2 ⇒ f(2026) = f(2) = 0。",
      "",
      "由条件③：x ∈ (0, 1] 时 f(x) = x(1 &minus; x)，所以 f(1) = 1 × 0 = 0。",
      "",
      "因此 f(2025) + f(2026) = 0 + 0 = 0。"
    ]
  },
  // Q4: 三角恒等式证明 (Part 5)
  {
    diff: "奥数",
    question: '证明：sin 10° · sin 50° · sin 70° = 1/8。',
    hint: '① 先把角往"倍角链"上凑：由诱导公式 sin50° = cos40°、sin70° = cos20°，原式化为 sin10° · cos20° · cos40°，三个角 10°、20°、40° 恰好是 2 倍关系。<br>② 看到成倍角的连乘积，优先想到倍角公式 sin2x = 2sinx·cosx，它能"两两消化"乘积：现在还缺一个 cos10° 才能配成完整的链，于是补乘 cos10°/cos10°（cos10° ≠ 0，值不变），依次配出 sin20°、sin40°、sin80°，最后与分母的 cos10° 相约。为什么有效？补乘分子分母同乘一个非零量是恒等变形，"配凑"让倍角公式能够一路用到底。',
    answer: "1/8",
    steps: [
      "利用诱导公式先化为余弦：",
      "sin10°·sin50°·sin70° = sin10°·cos40°·cos20°（利用 sin50°=cos40°, sin70°=cos20°）",
      "",
      "由于 cos10° ≠ 0，可乘以 cos10°/cos10°：",
      "= sin10°·cos20°·cos40°",
      "= (sin10°·cos10°·cos20°·cos40°)/cos10°",
      "= (sin20°·cos20°·cos40°)/(2cos10°)",
      "= (sin40°·cos40°)/(4cos10°)",
      "= sin80°/(8cos10°) = cos10°/(8cos10°) = 1/8。"
    ]
  },
  // Q5: 不等式证明 (Part 7) — 配方法，无超纲概念
  {
    diff: "奥数",
    question: '已知 a、b、c 均为正实数，证明：a² + b² + c² ≥ ab + bc + ca，并指出等号成立的条件。',
    hint: '① 求证左边 ≥ 右边，且式子关于 a、b、c 完全对称，首选"作差法"：把右边移到左边，问题就化为证明差式 ≥ 0，这是不等式证明最基础、最直接的策略。<br>② 差式中恰好有三对"平方项与交叉项"（a² 与 ab、b² 与 bc、c² 与 ca），两两一组恰好能配成 (a &minus; b)² 这种完全平方式。为什么想到配方？因为平方和恒非负，只要把差值写成若干完全平方之和，符号一目了然，等号条件也直接看每个平方何时同时为 0。',
    answer: "作差比较法，配成完全平方式",
    steps: [
      "思路：要证明左边 ≥ 右边，可将右边移到左边，设法配方成非负形式。",
      "",
      "证明：a² + b² + c² − (ab + bc + ca)",
      "= ½[2a² + 2b² + 2c² − 2ab − 2bc − 2ca]",
      "= ½[(a²−2ab+b²) + (b²−2bc+c²) + (c²−2ca+a²)]",
      "= ½[(a−b)² + (b−c)² + (c−a)²] ≥ 0。",
      "",
      "所以 a² + b² + c² ≥ ab + bc + ca。",
      "当且仅当 a = b = c 时，三个完全平方式同时为 0，等号成立。",
      "",
      "点评：核心思路是「作差 → 配平方 → 判定符号」，这是不等式证明最基础也最常用的方法之一。"
    ]
  },
  // Q6: 二次函数综合 (Part 5 + Part 7)
  {
    diff: "奥数",
    question: '已知二次函数 f(x) = ax² + bx + c（a > 0）满足：<br>① f(x) 的最小值为 &minus;4；<br>② f(2) &minus; f(1) = 5；<br>③ 不等式 f(x) < 0 的解集长度为 4。<br>求 f(x) 的解析式。',
    hint: '① 求 a、b、c 三个未知数需要三个独立方程，题目恰好给了三条信息，关键是"把每条信息翻译成可计算的式子"：最小值 → 顶点纵坐标 (4ac &minus; b²)/4a；f(2) &minus; f(1) → 代入作差得 3a + b = 5；解集长度 → 两根之差 |x₁ &minus; x₂| = √Δ / a。<br>② 为什么这样翻译？因为每条条件都指向一个可以直接计算的量，三个方程解三个未知数，思路自然清晰。注意"解集长度"本质就是两根之差的绝对值，由判别式给出，不需要把根真的解出来。',
    answer: "f(x) = x² + 2x &minus; 3",
    steps: [
      "由 a > 0 且 f(x) 存在最小值，最小值在顶点处取得：",
      "(4ac &minus; b²)/(4a) = &minus;4 ⇒ b² &minus; 4ac = 16a。 ①",
      "",
      "由 f(2) &minus; f(1) = 5：",
      "(4a + 2b + c) &minus; (a + b + c) = 3a + b = 5 ⇒ b = 5 &minus; 3a。 ②",
      "",
      "设 f(x) = 0 的两根为 x₁、x₂（x₁ < x₂），因 a > 0，f(x) < 0 的解集为 (x₁, x₂)，其长度为 x₂ &minus; x₁ = 4。",
      "由求根公式：x₂ &minus; x₁ = √(b² &minus; 4ac) / a = 4。",
      "即 √(b² &minus; 4ac) = 4a。 ③",
      "",
      "由①、③得：√(16a) = 4a ⇒ 4√a = 4a ⇒ √a = a。",
      "因为 a > 0，解得 a = 1。",
      "",
      "代入②：b = 5 &minus; 3 &times; 1 = 2。",
      "代入①：2² &minus; 4 &times; 1 &times; c = 16 &times; 1 ⇒ 4 &minus; 4c = 16 ⇒ c = &minus;3。",
      "",
      "所以 f(x) = x² + 2x &minus; 3 = (x + 3)(x &minus; 1)。",
      "",
      "验证：",
      "① 顶点 x = &minus;1，最小值 f(&minus;1) = 1 &minus; 2 &minus; 3 = &minus;4 ✓；",
      "② f(2) &minus; f(1) = (4 + 4 &minus; 3) &minus; (1 + 2 &minus; 3) = 5 &minus; 0 = 5 ✓；",
      "③ f(x) < 0 ⇔ (x + 3)(x &minus; 1) < 0 ⇔ &minus;3 < x < 1，解集长度为 1 &minus; (&minus;3) = 4 ✓。",
      "",
      "点评：本题综合了顶点公式、函数值之差与韦达定理/求根公式的应用，关键是建立三个方程（①最小值、②函数值差、③根距）并求解。"
    ]
  },
  // Q7: 对数与三角综合 (Part 5)
  {
    diff: "奥数",
    question: '已知 f(x) = ln(sin x + cos x)。<br>(1) 求 f(x) 的定义域；<br>(2) 求 f(x) 的单调递增区间。',
    hint: '① 定义域由"真数大于 0"决定：sin x + cos x > 0。两项正弦和不好直接分析，用辅助角公式合成 √2·sin(x + π/4)，问题就退化为"正弦函数在哪里为正"，这是"正弦 + 余弦"为定形式的标准处理。<br>② 单调性用复合函数的思想：ln 在定义域上严格递增，外层的增函数不会改变内层函数的单调方向，所以 f 的增减完全由 sin(x + π/4) 决定，只需求 sin 的单调区间再换回 x 即可。为什么能这样拆？因为外层 ln 是严格增的"单向阀门"，t 增则 ln t 增。',
    answer: "定义域(2kπ-π/4, 2kπ+3π/4)，递增区间(2kπ-π/4, 2kπ+π/4]，k∈Z",
    steps: [
      "(1) 定义域：sin x + cos x > 0。",
      "sin x + cos x = √2 sin(x + π/4)。",
      "sin(x + π/4) > 0 ⇔ 2kπ < x + π/4 < 2kπ + π，k ∈ Z。",
      "即 2kπ &minus; π/4 < x < 2kπ + 3π/4。",
      "所以定义域为 (2kπ &minus; π/4, 2kπ + 3π/4)，k ∈ Z。",
      "",
      "(2) 对每个 k ∈ Z，在上述定义域内令 t = x + π/4，则 2kπ < t < 2kπ + π。",
      "自然对数函数在 (0, +∞) 上严格递增，因此 f(x) 的单调性与 sin t 在该区间内的单调性相同。",
      "sin t 在 (2kπ, 2kπ + π/2] 上严格递增，在 [2kπ + π/2, 2kπ + π) 上严格递减。",
      "所以 f(x) 的最大单调递增区间为 (2kπ &minus; π/4, 2kπ + π/4]，k ∈ Z。"
    ]
  },
  // Q8: 图像变换与方程 (Part 6 + Part 8)
  {
    diff: "奥数",
    diagram: "parameter-line",
    question: '讨论方程 |x² &minus; 4| &minus; kx + 1 = 0 的实根个数随实数 k 的变化。',
    hint: '① 方程含参数 k，直接做代数分类会很繁琐。移项得 |x² &minus; 4| = kx &minus; 1：左边是确定的"W 形"曲线，右边是过定点 (0, &minus;1) 的直线族，实根个数 = 两图像交点的个数。这是"方程 ⇔ 图像交点"的数形结合思想。<br>② 为什么可操作？|x² &minus; 4| 分三段后每段都是二次曲线，与直线的交点可以用判别式和端点值精确判定；让斜率 k 从负到正"扫过"，交点个数只在临界位置发生变化，按区间分类即可。注意 k = ±1/2 时直线恰好经过折点 (±2, 0)，端点要避免重复计数。',
    answer: "k &lt; &minus;1/2 时 2 个；k = &minus;1/2 时 1 个；&minus;1/2 &lt; k &lt; 1/2 时 0 个；k = 1/2 时 1 个；k &gt; 1/2 时 2 个",
    steps: [
      "移项得 |x² &minus; 4| = kx &minus; 1。",
      "令 f(x) = |x² &minus; 4|，g(x) = kx &minus; 1。",
      "实根个数即两个图像交点的个数。",
      "",
      "f(x) 的图像为 W 形曲线，分三段：",
      "① x ≥ 2：y = x²&minus;4（右支，开口向上）；",
      "② &minus;2 < x < 2：y = 4&minus;x²（中段，开口向下，最高点 (0,4)）；",
      "③ x ≤ &minus;2：y = x²&minus;4（左支）。",
      "g(x) 是过定点 (0, &minus;1) 的直线，斜率为 k。",
      "",
      "【右支 x ≥ 2】联立 x²&minus;4 = kx&minus;1，得 h(x) = x² &minus; kx &minus; 3 = 0。",
      "h(x) 的两根异号，正根不小于 2 当且仅当 h(2) = 1 &minus; 2k ≤ 0，即 k ≥ 1/2。",

      "【中段 &minus;2 < x < 2】联立 4&minus;x² = kx&minus;1，得 p(x) = x² + kx &minus; 5 = 0。",

      "",
      "综合（k = ±1/2 时直线分别经过折点 (±2, 0)，端点只计一次）：",

      "k = &minus;1/2：1 个（x = &minus;2）；",
      "&minus;1/2 < k < 1/2：0 个；",

    ]

  // Q9: 分式函数值域与参数 (Part 5 + Part 7)
  {
    diff: "奥数",
    question: '已知函数 f(x) = (x² + ax + 1)/(x² + 1) 的值域为 [m, n]，且 n &minus; m = 1。<br>求实数 a 的值。',
    hint: '① 分子分母都含 x² 项，先拆分：f(x) = 1 + ax/(x² + 1)，把"常数"与"变量部分"分离。为什么拆？加常数只把值域整体平移，不改变宽度 n &minus; m，于是只需研究 g(x) = ax/(x² + 1) 的最值。<br>② g(x) 是奇函数，值域关于原点对称：若最大值是 M，最小值就是 &minus;M，所以 n &minus; m = 2M = 1，问题转化为"求 g 的最大值"。求 M 走不等式路线：由 (|x| &minus; 1)² ≥ 0 得 x² + 1 ≥ 2|x|，一步给出 |x|/(x²+1) ≤ 1/2。为什么这条路走得通？奇对称把"宽度"换成"最值"，不等式直接封住上界。',

      "当 a ≠ 0 时，g(x) 是奇函数，最大值与最小值互为相反数。",

      "由 M = 1/2 得 |a| = 1。",
      "",
      "综上，a = 1 或 a = &minus;1。",
      "",

  // Q10: 函数思想 — 根的存在性与个数 (Part 7)

    diff: "奥数",
    question: '证明方程 x⁵ &minus; 5x + 1 = 0 在区间 (0, 1) 内恰有一个实根。',
    hint: '① "恰有一个实根"要拆成两件事分别处理：至少有一个（存在性）+ 至多有一个（唯一性），这是证明"恰有"类结论的固定套路。<br>② 存在性用零点定理：只要找到两个端点函数值异号（F(0) = 1 > 0、F(1) = &minus;3 < 0），连续的多项式函数就必在中间穿过 x 轴。<br>③ 唯一性用单调性：证明 F 在 (0, 1) 上严格单调递减，单调函数与 x 轴至多有一个交点。怎么证递减？作差后提出公因式 (x₁ &minus; x₂)，剩余因式是五项之和，在 (0, 1) 内每项都小于 1，总和一定小于 5，符号立刻确定。为什么这两步够用？"存在 + 唯一"合起来就是"恰有一个"。',
    answer: "在区间 (0, 1) 内恰有一个实根",
    steps: [
      "令 F(x) = x⁵ &minus; 5x + 1，x ∈ [0, 1]。",
      "",
      "第一步：证明至少有一个根。",
      "F(0) = 1 > 0，F(1) = 1 &minus; 5 + 1 = &minus;3 < 0。",
      "F(x) 是多项式函数，在 [0, 1] 上连续。由零点定理，存在 c ∈ (0, 1) 使 F(c) = 0。",
      "所以方程在 (0, 1) 内至少有一个根。",
      "",
      "第二步：证明至多有一个根。",
      "任取 (0, 1) 内两点 x₁ < x₂，考察差值：",
      "F(x₁) − F(x₂) = (x₁⁵ − x₂⁵) − 5(x₁ − x₂)",
      "= (x₁ − x₂)[(x₁⁴ + x₁³x₂ + x₁²x₂² + x₁x₂³ + x₂⁴) − 5]。",
      "因为 0 < x₁ < x₂ < 1，每个加数均小于 1，即",
      "x₁⁴ + x₁³x₂ + x₁²x₂² + x₁x₂³ + x₂⁴ < 1 + 1 + 1 + 1 + 1 = 5，",
      "故中括号内 < 0；又 x₁ − x₂ < 0，所以 F(x₁) − F(x₂) > 0。",
      "即 F(x) 在 (0, 1) 上严格单调递减。",
      "",
      "单调递减的函数在区间内至多只有一个零点，",
      "结合第一步已证存在一个零点，所以方程在 (0, 1) 内<strong>恰有一个实根</strong>。"
    ]
  }

// ============================================================
// 渲染与交互
// ============================================================
var calcChecked = [];
var totalScore = 0;

function render() {
  var calcHtml = "";
  for (var i = 0; i < calcQuestions.length; i++) {
    var q = calcQuestions[i];
    calcHtml += '<div class="calc-card" id="calc' + i + '">';
    calcHtml += '<div class="q-title"><span class="q-tag">奥数</span> ' + (i+1) + '. ' + q.question + ' <span class="diff-tag diff-olym">奥数</span></div>';
    if (q.diagram) calcHtml += renderGraphDiagram();
    calcHtml += '<div style="margin:8px 0;"><strong>你的解答：</strong></div>';
    calcHtml += '<textarea class="calc-input" id="calcInput' + i + '" rows="3" placeholder="请在草稿纸上推演后在此输入关键结论..."></textarea>';
    calcHtml += '<button class="btn-check" id="calcBtn' + i + '" onclick="checkCalc(' + i + ')">提交</button>';
    calcHtml += '<div class="hint-area" id="calcHint' + i + '">' + q.hint + '</div>';
    calcHtml += '<div class="step-area" id="calcStep' + i + '">';
    for (var k = 0; k < q.steps.length; k++) {
      if (q.steps[k] === "") {
        calcHtml += '<br>';
      } else {
        calcHtml += '<div class="step">' + q.steps[k] + '</div>';
      }
    }
    calcHtml += '<div class="answer">答案：' + q.answer + '</div>';
    calcHtml += '</div>';
    calcHtml += '<button class="btn-hint" id="calcHintBtn' + i + '" onclick="toggleHint(' + i + ')">思路分析</button>';
    calcHtml += '<button class="btn-toggle" id="calcToggle' + i + '" onclick="toggleCalc(' + i + ')">查看解答</button>';
    calcHtml += '</div>';
  }
  document.getElementById("calc-container").innerHTML = calcHtml;
  calcChecked = new Array(calcQuestions.length).fill(false);
}

function renderGraphDiagram() {
  return '<div class="graph-figure" role="img" aria-label="曲线 y 等于 x 平方减 4 的绝对值，以及绕定点 0 负 1 转动的直线 y 等于 kx 减 1">' +
    '<svg viewBox="0 0 360 235">' +
    '<line x1="24" y1="190" x2="340" y2="190" stroke="#8c98a4"/><line x1="180" y1="18" x2="180" y2="226" stroke="#8c98a4"/>' +
    '<text x="344" y="194" font-size="12">x</text><text x="185" y="18" font-size="12">y</text>' +
    '<path d="M54 94 Q72 145 90 190 Q135 90 180 90 Q225 90 270 190 Q288 145 306 94" fill="none" stroke="#1a73e8" stroke-width="3"/>' +
    '<circle cx="90" cy="190" r="4" fill="#1a73e8"/><circle cx="270" cy="190" r="4" fill="#1a73e8"/>' +
    '<text x="70" y="207" font-size="12">(−2, 0)</text><text x="274" y="207" font-size="12">(2, 0)</text>' +
    '<line class="scan-line" x1="35" y1="215" x2="325" y2="215" stroke="#e65100" stroke-width="3"/>' +
    '<circle cx="180" cy="215" r="5" fill="#e65100"/><text x="188" y="228" font-size="12" fill="#b53d00">定点 (0, −1)</text>' +
    '<text x="230" y="42" font-size="12" fill="#1a73e8">y = |x² − 4|</text><text x="44" y="40" font-size="12" fill="#b53d00">y = kx − 1</text>' +
    '</svg></div>';
}

function checkCalc(ci) {
  if (calcChecked[ci]) return;
  var input = document.getElementById("calcInput" + ci);
  if (!input.value.trim()) {
    alert("请先输入本题的关键结论或解答过程。");
    input.focus();
    return;
  }
  calcChecked[ci] = true;
  showCalc(ci);
  document.getElementById("calcBtn" + ci).disabled = true;
  if (confirm('你已查看本题解答。如果答案正确，点击"确定"获得6分；否则点击"取消"。')) {
    totalScore += 6;
    document.getElementById("calc" + ci).classList.add("correct");
    input.classList.add("correct-input");
    updateScore();
  } else {
    document.getElementById("calc" + ci).classList.add("wrong");
    input.classList.add("wrong-input");
    updateScore();
  }
}

function showCalc(ci) {
  var area = document.getElementById("calcStep" + ci);
  var btn = document.getElementById("calcToggle" + ci);
  area.classList.add("show", "ok");
  btn.textContent = "隐藏解答";
}

function toggleHint(ci) {
  var area = document.getElementById("calcHint" + ci);
  var btn = document.getElementById("calcHintBtn" + ci);
  var isShowing = area.classList.toggle("show");
  btn.textContent = isShowing ? "收起思路" : "思路分析";
}

function toggleCalc(ci) {
  var area = document.getElementById("calcStep" + ci);
  var btn = document.getElementById("calcToggle" + ci);
  var isShowing = area.classList.toggle("show");
  area.classList.toggle("ok", isShowing);
  btn.textContent = isShowing ? "隐藏解答" : "查看解答";
}

function updateScore() {
  document.getElementById("scoreDisplay").textContent = "得分：" + totalScore + " / 60";
}

function resetExam() {
  if (!confirm('确定要重新答题吗？所有已提交的答案将被清除。')) return;
  totalScore = 0;
  calcChecked = [];
  render();
  updateScore();
}

window.onload = render;
</script>
