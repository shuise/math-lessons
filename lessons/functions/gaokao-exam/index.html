<script>

var choiceQuestions = [
  // Q1: 二次函数最值 (Part 5)
  {

    question: "函数 f(x) = &minus;x² + 2x + 3 的最大值为（  ）",

  // Q3: 对数运算 (Part 5)

    opts: ["1/4", "1/2", "√3/4", "1"],

  {

    question: "将 y = 2<sup>x</sup> 的图像向右平移 1 个单位，再向上平移 2 个单位，得到的函数是（  ）",

  {

// ============================================================
// 解答题（5 题 — 每题 10 分）
// ============================================================
var calcQuestions = [
  // Q1: 二次函数含参最值 (Part 5 + Part 7)
  {
    question: "已知二次函数 f(x) = x² &minus; 2ax + 3 在区间 [0, 2] 上的最小值为 g(a)。<br>(1) 求 g(a) 的表达式；<br>(2) 当 a = 1 时，求 f(x) 在 [0, 2] 上的最大值与最小值。",
    answer: "g(a)分段，a=1时最小值2，最大值3",
    keywords: ["对称轴", "分类讨论"],
    steps: [
      "f(x) = x² &minus; 2ax + 3 = (x &minus; a)² + 3 &minus; a²，对称轴 x = a，开口向上。",
      "需按对称轴与区间 [0, 2] 的位置关系分三类：",
      "① 当 a < 0 时，对称轴在区间左侧，f(x) 在 [0, 2] 递增，最小值 g(a) = f(0) = 3。",
      "② 当 0 ≤ a ≤ 2 时，对称轴在区间内，最小值 g(a) = f(a) = 3 &minus; a²。",
      "③ 当 a > 2 时，对称轴在区间右侧，f(x) 在 [0, 2] 递减，最小值 g(a) = f(2) = 7 &minus; 4a。",
      "综上：g(a) = { 3, a < 0; 3&minus;a², 0≤a≤2; 7&minus;4a, a>2 }",
      "(2) a = 1 时，对称轴 x = 1 ∈ [0, 2]。最小值 f(1) = 2。",
      "最大值在端点处：f(0) = 3，f(2) = 3，所以最大值 = 3。"
    ]
  },
  // Q2: 指数对数不等式 (Part 5)
  {
    question: "解不等式 2<sup>x² &minus; 3x</sup> < (1/2)<sup>x &minus; 4</sup>。",
    answer: "(1 &minus; √5, 1 + √5)",
    keywords: ["1-√5", "1+√5"],
    steps: [
      "将右边化为同底： (1/2)<sup>x&minus;4</sup> = (2<sup>&minus;1</sup>)<sup>x&minus;4</sup> = 2<sup>&minus;(x&minus;4)</sup> = 2<sup>&minus;x+4</sup>。",
      "原不等式化为：2<sup>x²&minus;3x</sup> < 2<sup>&minus;x+4</sup>。",
      "指数函数 y = 2<sup>t</sup> 单调递增，所以 x² &minus; 3x < &minus;x + 4。",
      "整理得 x² &minus; 2x &minus; 4 < 0。",
      "Δ = 4 + 16 = 20，两根 x = (2 ± √20)/2 = 1 ± √5。",
      "所以不等式解集为 (1 &minus; √5, 1 + √5)，即约 (&minus;1.24, 3.24)。"
    ]
  },
  // Q3: 三角恒等变换 (Part 5)
  {
    question: "已知 sin α + cos α = 1/5，且 α ∈ (0, π)。<br>(1) 求 sin α &minus; cos α 的值；<br>(2) 求 tan α 的值。",
    answer: "sinα-cosα=7/5, tanα=-4/3",
    keywords: ["7/5", "-4/3"],
    steps: [
      "(1) 由 sin α + cos α = 1/5，两边平方得：",
      "sin²α + 2 sinα cosα + cos²α = 1/25。",
      "因为 sin²α + cos²α = 1，所以 1 + 2 sinα cosα = 1/25。",
      "解得 sinα cosα = &minus;12/25 < 0。",
      "由于 α ∈ (0, π)，sinα > 0，所以 cosα < 0，即 α ∈ (π/2, π)。",
      "此时 sinα &minus; cosα > 0。",
      "(sinα &minus; cosα)² = 1 &minus; 2 sinα cosα = 1 + 24/25 = 49/25。",
      "所以 sinα &minus; cosα = 7/5。",
      "(2) 联立 sinα + cosα = 1/5 和 sinα &minus; cosα = 7/5，解得：",
      "sinα = 4/5，cosα = &minus;3/5。",
      "所以 tanα = sinα/cosα = &minus;4/3。"
    ]
  },
  // Q4: 方程思想 — 根的分布 (Part 7)
  {
    question: "已知方程 x² &minus; (m+2)x + 2m + 1 = 0 在区间 (0, 3) 内恰有一个实根，求实数 m 的取值范围。",
    answer: "m \u2264 \u22121/2，或 m = 0，或 m > 4",
    keywords: ["-1/2", "m=0", "4"],
    keywordMode: "and",
    steps: [
      "记 f(x) = x² &minus; (m+2)x + 2m + 1。",
      "方程在 (0, 3) 内恰有一个实根，分两种情况：",
      "情况一：f(0)·f(3) < 0（两端点异号）。",
      "f(0) = 2m + 1，f(3) = 9 &minus; 3(m+2) + 2m + 1 = 9 &minus; 3m &minus; 6 + 2m + 1 = 4 &minus; m。",
      "(2m+1)(4&minus;m) < 0 ⇒ m < &minus;1/2 或 m > 4（记得 m < &minus;1/2 时两根？需检查 Δ）。",
      "Δ = (m+2)² &minus; 4(2m+1) = m² + 4m + 4 &minus; 8m &minus; 4 = m² &minus; 4m = m(m&minus;4)。",
      "m < &minus;1/2 时 Δ > 0 成立。",
      "m > 4 时 Δ > 0 成立。",
      "还需考虑区间内部的重根：Δ = 0 给出 m = 0 或 m = 4。m = 0 时方程为 (x &minus; 1)² = 0，重根 x = 1 ∈ (0, 3)，应计入；m = 4 时重根 x = 3，不在开区间内，应排除。",
      "情况二：有一个根恰好是端点（另一根不在区间内）。",
      "若 x = 0 是根：f(0) = 2m+1 = 0 ⇒ m = &minus;1/2。另一根：韦达 x₁+x₂ = m+2 = 3/2 ⇒ x₂ = 3/2 ∈ (0,3)。但 x=0 不在区间 (0,3) 内，故 (0,3) 内恰有一根，m = &minus;1/2 应取。",
      "若 x = 3 是根：f(3) = 4&minus;m = 0 ⇒ m = 4。此时方程变为 x²&minus;6x+9=0，两根均为 3（重根），不在 (0,3) 内，故 m = 4 排除。",
      "综合：f(0)·f(3) < 0 ⇒ m < &minus;1/2 或 m > 4。<br>f(0)=0 ⇒ m=&minus;1/2，x=0 不在区间内，另一根 3/2 ∈ (0,3)，故恰有一根。<br>f(3)=0 ⇒ m=4，两根均为 3，不在 (0,3) 内，排除。",
      "综上，m ≤ &minus;1/2，或 m = 0，或 m > 4。"
    ]
  },
  // Q5: 综合 — 函数性质应用 (Part 8)
  {
    question: "已知函数 f(x) = sin(2x &minus; π/3)。<br>(1) 求 f(x) 的最小正周期和对称中心；<br>(2) 说明如何由 y = sin x 的图像经过变换得到 y = f(x) 的图像；<br>(3) 求 f(x) 在 [0, π/2] 上的值域。",
    answer: "T=π, 对称中心(kπ/2+π/6,0), 值域[-√3/2,1]",
    keywords: ["π", "π/6", "-√3/2"],
    steps: [
      "(1) 最小正周期 T = 2π/2 = π。",
      "令 2x &minus; π/3 = kπ，得 x = kπ/2 + π/6，k ∈ Z。",
      "所以对称中心为 (kπ/2 + π/6, 0)。",
      "(2) 变换步骤（两种顺序均可）：",
      "方法一：① y = sin x 向右平移 π/3 ⇒ y = sin(x&minus;π/3)；",
      "② 横坐标缩短为原来 1/2 ⇒ y = sin(2x&minus;π/3)。",
      "方法二：① 横坐标缩短 1/2 ⇒ y = sin 2x；",
      "② 向右平移 π/6 ⇒ y = sin(2x&minus;π/3)。",
      "(3) x ∈ [0, π/2] 时，2x&minus;π/3 ∈ [&minus;π/3, 2π/3]。",
      "sin t 在 t = &minus;π/3 处取最小值 &minus;√3/2，在 t = π/2 处取最大值 1。",
      "所以值域为 [&minus;√3/2, 1]。"
    ]
  }
];

var choiceAnswered = [];
var calcChecked = [];
var totalScore = 0;

var diffLabels = {
  "基础": '<span class="diff-tag diff-easy">基础</span>',
  "中等": '<span class="diff-tag diff-medium">中等</span>',
  "较难": '<span class="diff-tag diff-hard">较难</span>',
  "高考": '<span class="diff-tag diff-exam">高考难度</span>'
};

function render() {
  // 选择题
  var choiceHtml = "";
  for (var i = 0; i < choiceQuestions.length; i++) {
    var q = choiceQuestions[i];
    var letter = ["A", "B", "C", "D"];
    choiceHtml += '<div class="quiz-question" id="cq' + i + '">';
    choiceHtml += '<div class="q-title"><span class="q-tag choice">选择</span> ' + (i+1) + '. ' + q.question + ' ' + (diffLabels[q.diff] || "") + '</div>';
    choiceHtml += '<div class="options">';
    for (var j = 0; j < q.opts.length; j++) {
      choiceHtml += '<div class="opt" onclick="selectChoice(' + i + ',' + j + ')">' + letter[j] + '. ' + q.opts[j] + '</div>';
    }
    choiceHtml += '</div>';
    choiceHtml += '<button class="btn-toggle-ans" data-q="' + i + '" onclick="toggleChoiceAnswer(' + i + ')">查看答案</button>';
    choiceHtml += '<div class="explain" id="cexp' + i + '"></div>';
    choiceHtml += '</div>';
  }
  document.getElementById("choice-container").innerHTML = choiceHtml;
  choiceAnswered = new Array(choiceQuestions.length).fill(-1);

  // 解答题
  var calcHtml = "";
  for (var i = 0; i < calcQuestions.length; i++) {
    var q = calcQuestions[i];
    calcHtml += '<div class="calc-card" id="calc' + i + '">';
    calcHtml += '<div class="q-title"><span class="q-tag">解答</span> ' + (i+1) + '. ' + q.question + '</div>';
    calcHtml += '<div style="margin:8px 0;"><strong>你的答案：</strong></div>';
    calcHtml += '<textarea class="calc-input" id="calcInput' + i + '" rows="3" placeholder="请在此输入你的解答过程或答案..."></textarea>';
    calcHtml += '<button class="btn-check" id="calcBtn' + i + '" onclick="checkCalc(' + i + ')">提交</button>';
    calcHtml += '<div class="step-area" id="calcStep' + i + '">';
    for (var k = 0; k < q.steps.length; k++) {
      calcHtml += '<div class="step">' + q.steps[k] + '</div>';
    }
    calcHtml += '<div class="answer">答案：' + q.answer + '</div>';
    calcHtml += '</div>';
    calcHtml += '<button class="btn-toggle" onclick="toggleCalc(' + i + ')">查看解答</button>';
    calcHtml += '</div>';
  }
  document.getElementById("calc-container").innerHTML = calcHtml;
  calcChecked = new Array(calcQuestions.length).fill(false);
}

// 选择题（可重新选择，即时反馈不暴露正确答案）
function selectChoice(qi, oi) {
  var q = choiceQuestions[qi];
  var parent = document.getElementById("cq" + qi);
  var opts = parent.getElementsByClassName("opt");
  var exp = document.getElementById("cexp" + qi);
  // 清除上一次的对错标记
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove("selected", "correct-opt", "wrong-opt");
  }
  // 标注当前选择并即时反馈
  opts[oi].classList.add("selected");
  parent.dataset.chosen = oi;
  var isCorrect = (oi === q.answer);
  if (isCorrect) {
    opts[oi].classList.add("correct-opt");
    parent.classList.remove("correct", "wrong");
    parent.classList.add("correct");
  } else {
    opts[oi].classList.add("wrong-opt");
    parent.classList.remove("correct", "wrong");
    parent.classList.add("wrong");
  }
  // 如果正显示答案，自动收起
  if (exp.classList.contains("show")) {
    exp.classList.remove("show");
    var btn = parent.querySelector(".btn-toggle-ans");
    btn.classList.remove("showing");
    btn.textContent = "查看答案";
  }
  updateScore();
}

function toggleChoiceAnswer(qi) {
  var q = choiceQuestions[qi];
  var parent = document.getElementById("cq" + qi);
  var btn = parent.querySelector(".btn-toggle-ans");
  var exp = document.getElementById("cexp" + qi);
  var isShowing = exp.classList.contains("show");
  if (isShowing) {
    exp.classList.remove("show");
    btn.classList.remove("showing");
    btn.textContent = "查看答案";
  } else {
    var chosen = parseInt(parent.dataset.chosen);
    if (isNaN(chosen)) return;
    exp.className = "explain show ok";
    exp.innerHTML = "<strong>正确答案：</strong>" + q.opts[q.answer] + "<br><strong>解析：</strong>" + q.explain;
    btn.classList.add("showing");
    btn.textContent = "隐藏答案";
  }
}

// 解答题（手动判分，每题10分，由用户自行核对解答后点击得分）
function checkCalc(ci) {
  if (calcChecked[ci]) return;
  calcChecked[ci] = true;
  toggleCalc(ci);
  document.getElementById("calcBtn" + ci).disabled = true;
  // 用户可自行判断是否得分，点击显示解答后提问
  if (confirm('你已查看本题解答。如果答案正确，点击"确定"获得10分；否则点击"取消"。')) {
    totalScore += 10;
    document.getElementById("calc" + ci).classList.add("correct");
    updateScore();
  } else {
    document.getElementById("calc" + ci).classList.add("wrong");
    updateScore();
  }
}

function toggleCalc(ci) {
  var area = document.getElementById("calcStep" + ci);
  area.classList.toggle("show");
  if (area.classList.contains("show")) {
    area.classList.add("ok");
  }
}

function updateScore() {
  var choiceScore = 0;
  for (var i = 0; i < choiceQuestions.length; i++) {
    var parent = document.getElementById("cq" + i);
    if (parent && parent.classList.contains("correct")) {
      choiceScore += 5;
    }
  }
  document.getElementById("scoreDisplay").textContent = "得分：" + (choiceScore + totalScore) + " / 100";
}

function resetExam() {
  if (!confirm("确定要重新答题吗？所有已提交的答案将被清除。")) return;
  totalScore = 0;
  choiceAnswered = [];
  calcChecked = [];
  render();
  updateScore();
}

window.onload = render;
</script>
