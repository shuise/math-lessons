    explain: "y = x + 1 → x = y − 1，交换 x,y 得 f⁻¹(x) = x − 1。"
  },
  {
    type: "choice",
    diff: "较难",
    question: "已知 f(x) = x² − 2x 在 (−∞, a] 上有反函数，则 a 的最大值为（  ）",
    opts: ["0", "1", "2", "−1"],
    answer: 1,
    explain: "二次函数 f(x) = (x−1)² − 1 的对称轴为 x = 1。在 (−∞,1] 上单调递减，是一一映射。超过 1 则包含递增部分，不再单调。故 a 最大为 1。"
  },
  {
    type: "choice",
    diff: "较难",
    question: "幂函数 y = x<sup>1/3</sup> 的图像（  ）",
    opts: ["关于原点对称", "关于 y 轴对称", "关于 x 轴对称", "无对称性"],
    answer: 0,
    explain: "y = x<sup>1/3</sup> = ∛x 是奇函数：∛(−x) = −∛x，故图像关于原点对称。"

  {
    type: "choice",
    diff: "较难",
    question: "函数 y = log₂(x−1) + 2 的图像恒过定点（  ）",

    answer: 1,
    explain: "对数函数 y = log₂x 恒过 (1, 0)。经过平移：x−1=1 → x=2，log₂1=0，y=0+2=2。故恒过 (2, 2)。"
  },
  {
    type: "choice",
    diff: "较难",
    question: "方程 x³ + 1 = 0 的实数解个数为（  ）",

    answer: 1,
    explain: "x³ + 1 = 0 → x³ = −1 → x = −1。幂函数 y = x³ 是 R 上严格递增的奇函数，任意值有唯一原像，故仅一个实数解。"

// ============================================================
// 渲染与交互
// ============================================================
function render() {
  var labels = ["A", "B", "C", "D"];
  var html = "";
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    var tagType = q.type === "judge" ? "judge" : "choice";
    var tagName = q.type === "judge" ? "判断" : "选择";
    var diffHtml = q.diff ? '<span class="diff-tag diff-' + q.diff + '">' + q.diff + '</span>' : "";
    html += '<div class="quiz-question" id="q' + i + '">';
    html += '<div class="q-title"><span class="q-tag ' + tagType + '">' + tagName + '</span> ' + (i+1) + '. ' + q.question + ' ' + diffHtml + '</div>';
    html += '<div class="options">';
    for (var j = 0; j < q.opts.length; j++) {
      var letter = q.type === "choice" ? labels[j] + ". " : "";
      html += '<div class="opt" onclick="selectOpt(' + i + ',' + j + ')">' + letter + q.opts[j] + '</div>';
    }
    html += '</div>';
    html += '<button class="btn-toggle-ans" data-q="' + i + '" onclick="toggleAnswer(' + i + ')">查看答案</button>';
    html += '<div class="explain" id="exp' + i + '"></div>';
    html += '</div>';
  }
  document.getElementById("quiz-container").innerHTML = html;
}

function selectOpt(qIdx, chosen) {
  var q = questions[qIdx];
  var parent = document.getElementById("q" + qIdx);
  var opts = parent.getElementsByClassName("opt");
  var exp = document.getElementById("exp" + qIdx);
  // 清除上一次的对错标记
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove("selected", "correct-opt", "wrong-opt");
  }
  // 标注当前选择并即时反馈
  opts[chosen].classList.add("selected");
  parent.dataset.chosen = chosen;
  var isCorrect = (chosen === q.answer);
  if (isCorrect) {
    opts[chosen].classList.add("correct-opt");
    parent.classList.remove("correct", "wrong");
    parent.classList.add("correct");
  } else {
    opts[chosen].classList.add("wrong-opt");
    parent.classList.remove("correct", "wrong");
    parent.classList.add("wrong");
  }
  // 如果正显示答案，自动收起
  if (exp.classList.contains("show")) {
    exp.classList.remove("show");
    var btn = parent.querySelector(".btn-toggle-ans");
    btn.classList.remove("showing");
    btn.textContent = "查看答案";
  }
  updateScore();
}

function toggleAnswer(qIdx) {
  var q = questions[qIdx];
  var parent = document.getElementById("q" + qIdx);
  var btn = parent.querySelector(".btn-toggle-ans");
  var exp = document.getElementById("exp" + qIdx);
  var isShowing = exp.classList.contains("show");
  if (isShowing) {
    exp.classList.remove("show");
    btn.classList.remove("showing");
    btn.textContent = "查看答案";
  } else {
    var chosen = parseInt(parent.dataset.chosen);
    if (isNaN(chosen)) return;
    exp.className = "explain show ok";
    exp.innerHTML = "<strong>正确答案：</strong>" + q.opts[q.answer] + "<br><strong>解析：</strong>" + q.explain;
    btn.classList.add("showing");
    btn.textContent = "隐藏答案";
  }
}

function updateScore() {
  var score = 0;
  for (var i = 0; i < questions.length; i++) {
    var parent = document.getElementById("q" + i);
    if (parent && parent.classList.contains("correct")) {
      score += (questions[i].type === "judge" ? 4 : 6);
    }
  }
  document.getElementById("scoreDisplay").textContent = "得分：" + score + " / 200";
}

function resetQuiz() {
  if (!confirm("确定要重新答题吗？")) return;
  render();
  updateScore();
}

window.onload = function() {
  render();
  updateScore();
};
</script>
