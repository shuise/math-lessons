    ans: "(1) f(x) = f(x/2 + x/2) = [f(x/2)]² ≥ 0。若存在 x₀ 使 f(x₀) = 0，则 f(1) = f(1 - x₀)·f(x₀) = 0，与 f(1) = 2 矛盾。<br>所以对任意 x ∈ R，f(x) &gt; 0。<br>(2) 任取 x₁ &lt; x₂，则 x₂ - x₁ &gt; 0，f(x₂ - x₁) &gt; 1。<br>f(x₂) = f(x₁ + (x₂ - x₁)) = f(x₁)·f(x₂ - x₁) &gt; f(x₁)·1 = f(x₁)，所以 f(x) 在 R 上单调递增。<br>(3) 由单调递增，f(x²) &lt; f(2x + 3) ⟺ x² &lt; 2x + 3，即 x² - 2x - 3 &lt; 0，(x - 3)(x + 1) &lt; 0。<br><b>∴ 不等式的解集为 (-1, 3)。</b>"
  },
  {
    part: "proof", kw: "单调性 · 无理式",
    q: "用定义法证明：函数 f(x) = √x 在 [0, +∞) 上单调递增。",
    hint: "任取 0 ≤ x₁ &lt; x₂，作差 f(x₁) - f(x₂) = √x₁ - √x₂，分子有理化化为 (x₁ - x₂)/(√x₁ + √x₂)，分母恒正，定号后下结论。",
    ans: "任取 0 ≤ x₁ &lt; x₂，则<br>f(x₁) - f(x₂) = √x₁ - √x₂ = (x₁ - x₂)/(√x₁ + √x₂)。<br>因为 x₁ &lt; x₂，所以 x₁ - x₂ &lt; 0；而 √x₁ + √x₂ &gt; 0。<br>故 f(x₁) - f(x₂) &lt; 0，即 f(x₁) &lt; f(x₂)。<br>∴ f(x) = √x 在 [0, +∞) 上单调递增。证毕。"
  },
  {
    part: "proof", kw: "奇偶性 · 单调性 · 多项式",
    q: "证明：函数 f(x) = x³ + 3x 是奇函数，且在 R 上单调递增。",
    hint: "奇偶性直接计算 f(-x)；单调性用定义法：作差 f(x₁) - f(x₂) 后用立方差公式分解，剩余二次因式配方为非负，加 3 后恒正，据此定号。",
    ans: "(1) 定义域 R，关于原点对称。f(-x) = (-x)³ + 3(-x) = -x³ - 3x = -(x³ + 3x) = -f(x)，所以 f(x) 是奇函数。<br>(2) 任取 x₁ &lt; x₂，则<br>f(x₁) - f(x₂) = (x₁³ - x₂³) + 3(x₁ - x₂) = (x₁ - x₂)(x₁² + x₁x₂ + x₂² + 3)。<br>其中 x₁² + x₁x₂ + x₂² = (x₁ + x₂/2)² + (3/4)x₂² ≥ 0，故 x₁² + x₁x₂ + x₂² + 3 &gt; 0。<br>而 x₁ - x₂ &lt; 0，所以 f(x₁) - f(x₂) &lt; 0，即 f(x₁) &lt; f(x₂)，f(x) 在 R 上单调递增。证毕。"
  },
  {
    part: "proof", kw: "不等式 · 均值不等式",
    q: "证明：对任意正数 a、b，有 a/b + b/a ≥ 2，并指出等号成立的条件。",
    hint: "把 a/b 与 b/a 看作两个正数，它们的乘积为 1，直接用均值不等式；等号当且仅当 a/b = b/a 时成立。",
    ans: "因为 a、b &gt; 0，所以 a/b &gt; 0，b/a &gt; 0，且 (a/b)·(b/a) = 1。<br>由均值不等式：a/b + b/a ≥ 2√[(a/b)·(b/a)] = 2。<br>当且仅当 a/b = b/a，即 a² = b²，又 a、b &gt; 0，故 a = b 时取等号。证毕。"
  },
  {
    part: "proof", kw: "三角函数 · 恒等式",
    q: "证明恒等式：sinα/(1 + cosα) = (1 - cosα)/sinα（其中 sinα ≠ 0 且 cosα ≠ -1）。",
    hint: "从左边出发，分子分母同乘以 (1 - cosα)，利用 sin²α + cos²α = 1 化简；条件保证分母不为零、可以约分。",
    ans: "左边 = sinα/(1 + cosα) = [sinα(1 - cosα)]/[(1 + cosα)(1 - cosα)] = [sinα(1 - cosα)]/(1 - cos²α) = [sinα(1 - cosα)]/sin²α = (1 - cosα)/sinα = 右边。<br>其中 1 - cos²α = sin²α，且 sinα ≠ 0 故可约分；分母 cosα ≠ -1 保证原式有意义。∴ 恒等式成立。证毕。"
  },
  {
    part: "proof", kw: "对数 · 换底公式",
    q: "证明换底公式：log<sub>a</sub> b = log<sub>c</sub> b / log<sub>c</sub> a（其中 a、b、c &gt; 0，a ≠ 1，c ≠ 1）。",
    hint: "设 log<sub>a</sub> b = t，则由对数定义得 b = a<sup>t</sup>；两边取以 c 为底的对数得 log<sub>c</sub> b = t·log<sub>c</sub> a，由 log<sub>c</sub> a ≠ 0 解出 t，即得结论。",
    ans: "设 log<sub>a</sub> b = t，则 a<sup>t</sup> = b。<br>两边同时取以 c 为底的对数：log<sub>c</sub>(a<sup>t</sup>) = log<sub>c</sub> b，即 t·log<sub>c</sub> a = log<sub>c</sub> b。<br>因为 c ≠ 1，所以 log<sub>c</sub> a ≠ 0，于是 t = log<sub>c</sub> b / log<sub>c</sub> a，即 log<sub>a</sub> b = log<sub>c</sub> b / log<sub>c</sub> a。证毕。"
  }
];

function render() {
  var container = document.getElementById("list");
  var html = "";
  var current = null;
  var calcNo = 0, proofNo = 0;
  for (var i = 0; i < problems.length; i++) {
    var p = problems[i];
    if (p.part !== current) {
      current = p.part;
      if (current === "calc") {
        html += '<div class="part-header">第一部分 · 计算题（30 题）</div>';
      } else {
        html += '<div class="part-header part-proof">第二部分 · 证明题（10 题）</div>';
      }
    }
    var no = (current === "calc") ? (++calcNo) : (++proofNo);
    var tagClass = (current === "calc") ? "q-tag" : "q-tag proof";
    html += '<div class="calc-card" id="card' + i + '">';
    html += '<div class="q-title"><span class="' + tagClass + '">' + (current === "calc" ? "计算题" : "证明题") + '</span>第 ' + no + ' 题<span class="q-kw">' + p.kw + '</span></div>';
    html += '<div class="q-text">' + p.q + '</div>';
    html += '<div class="btn-row">';
    html += '<button class="btn-hint" id="hintBtn' + i + '" onclick="toggleHint(' + i + ')">分析提示</button>';
    html += '<button class="btn-answer" id="ansBtn' + i + '" onclick="toggleAnswer(' + i + ')">正确答案</button>';
    html += '</div>';
    html += '<div class="hint-area" id="hint' + i + '"><span class="panel-label">分析提示</span>' + p.hint + '</div>';
    html += '<div class="answer-area" id="ans' + i + '"><span class="panel-label ans">正确答案</span>' + p.ans + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function toggleHint(i) {
  var area = document.getElementById("hint" + i);
  var btn = document.getElementById("hintBtn" + i);
  if (!area || !btn) return;
  var show = !area.classList.contains("show");
  area.classList.toggle("show", show);
  btn.classList.toggle("open", show);
}

function toggleAnswer(i) {
  var area = document.getElementById("ans" + i);
  var btn = document.getElementById("ansBtn" + i);
  if (!area || !btn) return;
  var show = !area.classList.contains("show");
  area.classList.toggle("show", show);
  btn.classList.toggle("open", show);
}

render();
</script>
