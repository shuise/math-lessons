function render() {
  var container = document.getElementById("list");
  var html = "";
  var current = null;
  var calcNo = 0, proofNo = 0;
  for (var i = 0; i < problems.length; i++) {
    var p = problems[i];
    if (p.part !== current) {
      current = p.part;
      if (current === "calc") {
        html += '<div class="part-header">第一部分 · 计算题（15 题）</div>';
      } else {
        html += '<div class="part-header part-proof">第二部分 · 证明题（5 题）</div>';
      }
    }
    var no = (current === "calc") ? (++calcNo) : (++proofNo);
    var tagClass = (current === "calc") ? "q-tag" : "q-tag proof";
    html += '<div class="calc-card" id="card' + i + '">';
    html += '<div class="q-title"><span class="' + tagClass + '">' + (current === "calc" ? "计算题" : "证明题") + '</span>第 ' + no + ' 题<span class="q-kw">' + p.kw + '</span></div>';
    html += '<div class="q-text">' + p.q + '</div>';
    html += '<div class="btn-row">';
    html += '<button class="btn-hint" id="hintBtn' + i + '" onclick="toggleHint(' + i + ')">分析提示</button>';
    html += '<button class="btn-answer" id="ansBtn' + i + '" onclick="toggleAnswer(' + i + ')">正确答案</button>';
    html += '</div>';
    html += '<div class="hint-area" id="hint' + i + '"><span class="panel-label">分析提示</span>' + p.hint + '</div>';
    html += '<div class="answer-area" id="ans' + i + '"><span class="panel-label ans">正确答案</span>' + p.ans + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function toggleHint(i) {
  var area = document.getElementById("hint" + i);
  var btn = document.getElementById("hintBtn" + i);
  if (!area || !btn) return;
  var show = !area.classList.contains("show");
  area.classList.toggle("show", show);
  btn.classList.toggle("open", show);
}

function toggleAnswer(i) {
  var area = document.getElementById("ans" + i);
  var btn = document.getElementById("ansBtn" + i);
  if (!area || !btn) return;
  var show = !area.classList.contains("show");
  area.classList.toggle("show", show);
  btn.classList.toggle("open", show);
}

render();
</script>
