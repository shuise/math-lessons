  <h2 class="chapter-two1" id="calibre_pb_0">插曲1：变慢的时间</h2>

  <p class="yinwen">［我不会］在我的大脑里存储太多这类知识，因为书上已经有了……大学教育的价值不在于学一大堆知识，而在于思维的训练。</p>

  <p class="yinwen">——爱因斯坦（Albert Einstein）回答“爱迪生测试”中的一个问题，为什么他不知道声速，引自1921年5月18日的《纽约时报》。</p>

  <p class="yinwen">有许多事情你从未见过，而且你不知道你没见过，因为你没见过。你得先看见，才能知道自己没见过，然后你才看见了说：“嘿，我从没见过这个。”太晚了，你已经看见了！</p>

  <p class="bodytext-right">——乔治·卡林（George Carlin），《再做一次》（DoinIt Again）</p>
