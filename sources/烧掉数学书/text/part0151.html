  <h4 class="chapter-four"><img alt="" class="zaozi" src="../images/00427.jpeg"/>.1.2　幸运眷顾勇者！</h4>

  <p class="bodytext">目前我们还不知道微积分的那些熟悉的操作在应用于无穷维时能不能继续有效。也许不再适用。不过，要检验一项推广是否有意义，以及总是有意义，就要看它能不能做到我们想要的，在整本书中一直都是这样。对于我们的直觉能够认识到正确答案的简单情形，在大多数时候，“我们想要的”都与我们的直觉一致。因此我们可以自信地宣称，不管我们将要做的事情有没有意义，还是值得冒险。我们直接掷出骰子，勇往直前。</p>
