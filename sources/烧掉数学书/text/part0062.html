  <h4 class="chapter-four">3.4.7　模式再次显现</h4>

  <p class="bodytext">我们基本已经做完了，只需利用上面已经发明的东西，用（<span class="jiacu">某个东西</span>）作为<img alt="" class="gongshi" src="../images/00321.jpeg"/>的缩写，用等式（3.11）和（3.12）可以得到：</p>

  <div class="zhong1">
 <img alt="" class="image-tuzhu" src="../images/00322.jpeg"/>
  </div>

  <p class="bodytext">唯一丑陋的部分是指数，不过如果我们多看几眼，就会发现指数其实就是<img alt="" class="gongshi" src="../images/00323.jpeg"/>，因此可以得到</p>

  <div class="zhong2">
 <img alt="" class="image-tuzhu" src="../images/00324.jpeg"/>
  </div>

  <p class="bodytext">完美！这正是我们一直以来看到的模式！太棒了。可以卖弄一下哲学了。</p>
