  <h3 class="chapter-three">开始</h3>

  <p class="bodytext">我们已经发明了前三张清单里的数学概念，但最后一张清单呢？在随后的两章，我们会发现高中数学中绝大多数不相关的事实（目前还没有讨论的微积分“预备知识”）可以很容易地用我们已经发明的这些工具得到，或者用我们沿途将要发明的这些工具的简单表兄弟得到。在所有例子中，我们都会发现这些所谓的预备知识其实是事后知识，需要微积分才能彻底理解。既然如此，总结了这么多我们已经发明的“高级”知识和还不知道的“基础”知识之后，让我们开始回望未来。准备好了吗？出发吧。</p>

  <p class="bodytext-c">（什么也没发生……这里就好像没人来过……）</p>
