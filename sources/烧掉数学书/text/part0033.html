  <h3 class="chapter-three">2.3　理解放大镜</h3>

  <p class="bodytext">这一节我们来进一步熟悉无穷放大镜。虽然是我们自己发明的，但我们并不完全清楚自己发明了什么以及它有什么特点。虽然我们发明了这个<span class="jiacu">思想</span>，但对这台特殊的机器还没有太多使用经验。这一节我们用各种例子来练习使用它。我们只知道那些能够完全用加和乘描述的机器，因此我们现在还只能摆弄这类机器。</p>
