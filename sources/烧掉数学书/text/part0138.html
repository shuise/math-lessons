  <h3 class="chapter-three">N.2　多变量微积分的符号雷区</h3>

  <p class="yinwen">现代数学对大多数外行来说是未知的领域。它的边界被专业术语的浓密灌木丛包围起来；它的风景只是一大堆难解的方程和高深的概念。很少有人认识到现代数学的世界充满了生动的景象和迷人的思想。</p>

  <p class="bodytext-right">——伊瓦斯·彼德逊（Ivars Peterson），《数学巡礼》（The Mathematical Tourist）</p>
