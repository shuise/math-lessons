  <h4 class="chapter-four">5.2.4　MM型机器……待续</h4>

  <p class="bodytext">我们还有一个类型有待探索：MM型。不过，这个讨论有点抽象，我们需要确保对自己所做的感到舒服，因此我们会在后面再回来讨论MM型机器。就目前来说，我们刚发现了一堆关于AM型机器与MA型机器的对应的有趣事实，以及是自身的导数的特殊机器。趁现在还有印象，我们再花点时间进一步非正式地探究一下我们的不动之物。</p>
