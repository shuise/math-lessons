  <h2 class="chapter-two1" id="calibre_pb_0">章曲Ω：无为有处有还无</h2>

  <p class="yinwen">现在过来和我在一起。我们可以有许多好玩的事情。有东西需要装满，有东西需要腾空，有东西需要拿走，有东西需要放回，有东西需要拿起，有东西需要放下，另外我们还要削铅笔，挖洞，敲钉，盖章，还有很多很多事情。为什么，如果你留在这里，你就再也不用思考——只需很少的练习你也会成为习惯的怪兽。</p>

  <p class="bodytext-right">——可怕的小事，诺顿·贾斯特（Nortotl Juster）的《幻象天堂》（The Phantom Tollbooth）中的角色</p>
