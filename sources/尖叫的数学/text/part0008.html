<div class="kuang">
<p class="yinwen">在这里，你们将会在遥远过去的几个瞬间，在查理大帝的宫廷中，在莎士比亚的戏剧里，在奥古斯丁的《忏悔录》和刘易斯·卡罗尔的书中，看到时间与空间的空无。</p>
<p class="yinwen">无是道家所说的虚无，是塞琉古帝国文字和中国汉字里数码与数码之间留出的空白，是吴哥时期一块石碑上的点，也是五世纪时古印度人使用的点。</p>
<p class="yinwen">印度的“sūnya”是cifra，也是zefiro，它被阿拉伯人带到西方的基督教国家，成了莱布尼茨眼中上帝创造世界的象征，最终，以空集的形式，衍生出所有的数字。</p>
</div>
