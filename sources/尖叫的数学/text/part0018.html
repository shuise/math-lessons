<p class="yinwen">是否存在一个数字，能够让我们像计算正方形一样去计算圆形呢？</p>
<p class="yinwen">从遥远的古代开始，数学家们一直追寻或者说在越来越严格的限制内仅用尺规去探寻的那个神秘常数究竟是什么？</p>
<p class="yinwen">为什么无数的割圆者最终都放弃追寻那个数字的本质？</p>
