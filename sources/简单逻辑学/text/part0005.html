  <p class="yinwen">一个想精通逻辑学的人可能会认为：熟悉错误的推理方式是没有积极意义的，甚至会产生背道而驰的结论。其实这种观点是错误的。正确推理无疑是第一位的，然而学习推理中可能出现的错误对我们来说具有双重意义：（1）它将使我们对正确推理有更深入的了解，让我们的神经更为敏锐，从而使我们更加坚定地遵循正确的路径；（2）在我们面对错误推理时，它将保护我们不受误导。</p>
