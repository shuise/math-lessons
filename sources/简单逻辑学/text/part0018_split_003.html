<h2 class="bodycontent-second-title1" id="sigil_toc_id_121">03　中项不周延</h2>

  <p class="bodycontent-text">在讨论三段论时，我们知道中项（出现在前提中但不出现在结论中）必须至少有一次是全称的（周延的），因为它要有适当的范围来联结大前提和小前提。如若不然，就会产生中项不周延谬误。通俗一些，可以称之为牵连犯罪。针对后一点，我们来看下面的例子：</p>

  <p class="fei">几个纳粹党人是恺撒俱乐部的成员。</p>

  <p class="fei">汉斯是恺撒俱乐部的成员。</p>

  <p class="fei">所以，汉斯是纳粹党人。</p>

  <p class="bodycontent-text"><span class="huidi">分析</span>这是个错误推理，并不能因为汉斯是俱乐部的成员，而俱乐部里有几个纳粹党人，就得出汉斯也是纳粹党人的结论。这种情况下，汉斯是有嫌疑的，但这并不是说我们就可以把自己的猜测作为真相来宣布。</p>
