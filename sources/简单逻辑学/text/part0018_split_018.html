<h2 class="bodycontent-second-title1" id="sigil_toc_id_136">18　分类错误</h2>

  <p class="bodycontent-text">如果人类天生是分析动物，那么人类同时也天生是分类动物。我们将一个事物放入某个和它有某方面共同点的一个大类中，以此来加深对事物的了解（你应该记得，这是逻辑定义的第一步）。对事物进行错误的分类，例如把苹果当成橙子，可能会带来严重的后果。图书馆中，一本书的错误分类可能导致几年的遍寻不果。将事物归入错误的类别是因为我们最开始就没有正确认识它们，而没有正确认识的原因是我们散漫的态度。</p>
