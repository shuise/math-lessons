  <p class="yinwen">从理论上来说，推理走上歧途的方式数不胜数，但是推理中常见的错误可以归纳为几个典型的类别。错误的推理形式总称为“谬误”。最基本的谬误形式有两种，形式谬误和非形式谬误。“形式谬误”，顾名思义，问题出现在形式上，或是论证结构上。“非形式谬误”，则说的是形式谬误之外的各种逻辑错误。本章将重点讨论这两种主要的谬误形式。</p>
