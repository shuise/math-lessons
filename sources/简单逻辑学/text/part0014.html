  <p class="yinwen">推理中的错误可能仅仅是个意外，或者说得更严肃点，是粗心的结果。如果要追根究底的话，它们可能是态度不端的产物，或者正是它们自身的某些缺陷导致了非逻辑思维的产生。在这一章中，我们来纵览一些容易滋生非逻辑思维的态度和观点，目的是形成自觉避免它们的习惯，使我们的思维合乎逻辑。</p>
