<h2 class="bodycontent-second-title1" id="sigil_toc_id_119">09　常识</h2>

  <p class="bodycontent-text">逻辑，生于常识，但又高于常识。逻辑思维的出现以及对非逻辑思维的避免，都根植于常识的某一面。常识是对日常生活中显而易见的事物的敏锐洞悉。它以可靠的辨别力为标志，以语言作为首要的揭示事物的方式，不欺瞒，将语言的作用定位于表达而不是炫耀。常识更接近本源，服务于推理的基本原则。它是被亚里士多德定义的“理性的动物”所共享的普遍意识。</p>

  <div class="xian"></div>

  <p class="yinwen1">当人们动脑筋工作时，逻辑是个伟大的工具。当人们进入冥想或者心不在焉时，意识不再发挥作用。因为意识不是人本身——它就像人的手脚，仅仅是个工具。</p>

  <p class="right1">薄伽梵·室利·拉杰尼希</p>

  <p class="right2">哲学家，世界古宗教研究者</p>
