<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学课程</title>
<link rel="icon" type="image/png" href="lessons/lib/logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #333;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    padding: 48px 20px 32px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* logo 区 */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
    user-select: none;
  }
  .logo img { width: 96px; height: 96px; border-radius: 20px; display: block; }
  .logo h1 { font-size: 26px; font-weight: 600; letter-spacing: 2px; color: #1a1a1a; }

  /* 入口列表 */
  .entries { display: flex; flex-direction: column; }
  .entry {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 4px;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid #eee;
    transition: background .15s;
    min-height: 64px;
  }
  .entry:active { background: #f6f7f9; }
  @media (hover: hover) { .entry:hover { background: #f6f7f9; } }
  .entry-icon {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
  }
  .entry-text { flex: 1; min-width: 0; }
  .entry-text .t { font-size: 17px; font-weight: 600; color: #1a1a1a; }
  .entry-text .d { font-size: 13px; color: #888; margin-top: 3px; }
  .entry-arrow { flex: none; color: #c0c4cc; font-size: 18px; }

  /* 底部声明 */
  .notice {
    margin-top: auto;
    padding: 32px 0 8px;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
    color: #999;
  }

  @media (max-width: 720px) {
    .wrap { padding: 36px 16px 24px; }
    .logo img { width: 80px; height: 80px; }
    .logo h1 { font-size: 22px; }
    .logo { margin-bottom: 28px; }
    .entry { padding: 16px 2px; }
    .entry-text .t { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <img src="lessons/lib/logo-o.png" alt="数学课程 logo">
    <h1>数学课程</h1>
  </div>

  <nav class="entries">
    <a class="entry" href="self-learning/index.html">
      <span class="entry-icon" style="background:#e67e22;">初</span>
      <span class="entry-text">
        <span class="t">初中课件</span><br>
        <span class="d">数与式、方程、函数、三角形、圆等</span>
      </span>
      <span class="entry-arrow">›</span>
    </a>
    <a class="entry" href="lessons/index.html">
      <span class="entry-icon" style="background:#1a73e8;">高</span>
      <span class="entry-text">
        <span class="t">高中课件</span><br>
        <span class="d">集合、函数、向量、圆锥曲线等</span>
      </span>
      <span class="entry-arrow">›</span>
    </a>
    <a class="entry" href="specials/index.html">
      <span class="entry-icon" style="background:#cd0000;">专</span>
      <span class="entry-text">
        <span class="t">数学专题</span><br>
        <span class="d">特殊的知识点讲解，独立成篇。</span>
      </span>
      <span class="entry-arrow">›</span>
    </a>
    <a class="entry" href="textbooks/index.html">
      <span class="entry-icon" style="background:#8e44ad;">书</span>
      <span class="entry-text">
        <span class="t">书籍</span><br>
        <span class="d">数学教材学习摘要与参考汇总</span>
      </span>
      <span class="entry-arrow">›</span>
    </a>
    <a class="entry" href="game/index.html">
      <span class="entry-icon" style="background:#2ea043;">玩</span>
      <span class="entry-text">
        <span class="t">数学游戏</span><br>
        <span class="d">在游戏中锻炼计算与思维</span>
      </span>
      <span class="entry-arrow">›</span>
    </a>
  </nav>

  <p class="notice">声明：课件内容可能存在错误，如发现问题请及时反馈。</p>

</div>
</body>
</html>
